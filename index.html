. In the cytoplasm, <b>citrate lyase<\/b>: citrate + CoA + <b>ATP<\/b> → <b>acetyl-CoA + oxaloacetate<\/b> (citrate synthase in reverse, paid for with ATP). OAA returns to the mitochondrion.<\/p><h3>2. Acetyl-CoA carboxylase (the committed, regulated step)<\/h3><p>Acetyl-CoA + HCO<sub>3<\/sub><sup>−<\/sup>(CO<sub>2<\/sub>) + ATP → <b>malonyl-CoA<\/b> (irreversible). Like pyruvate carboxylase, the added CO<sub>2<\/sub> <b>primes<\/b> and energizes the substrate and leaves again in the next step.<\/p><ul><li>Regulated allosterically and by phosphorylation. <b>Phosphorylated = inactive.<\/b> <b>Insulin<\/b> triggers dephosphorylation (activates it); glucagon opposes it.<\/li><li><div class=\"box\"><b>Malonyl-CoA inhibits carnitine acyltransferase I<\/b>, so newly made fatty acids can't enter the matrix to be β-oxidized. (PS4 Q13.)<\/div><\/li><\/ul><h3>3. Fatty acid synthase<\/h3><ul><li>In mammals, <b>one ~800 kDa polypeptide<\/b> with several active sites (plants and bacteria have about 5 separate polypeptides). Know two parts: <b>ACP (acyl carrier protein)<\/b>, a long flexible tether with a thiol that carries intermediates between active sites (substrate channeling, like PDH's lipoyl arm), and <b>KS (β-ketoacyl synthase)<\/b>, a second thiol attachment point.<\/li><li>Loading: the malonyl group goes onto <b>ACP<\/b>; in round 1, an <b>acetyl<\/b> group (from acetyl-CoA) goes onto <b>KS<\/b>.<\/li><\/ul><h3>One round (β-oxidation in reverse)<\/h3><table><tr><th>#<\/th><th>Step<\/th><th>Product (on ACP)<\/th><th>β-Oxidation mirror<\/th><\/tr><tr><td>1<\/td><td><b>Condensation<\/b>: malonyl loses CO<sub>2<\/sub> → a carbanion attacks the KS-bound acyl carbonyl<\/td><td><b>β-ketoacyl-ACP<\/b><\/td><td>Cleavage (thiolase)<\/td><\/tr><tr><td>2<\/td><td><b>Reduction<\/b> (<b>NADPH<\/b>)<\/td><td><b>β-hydroxyacyl-ACP<\/b><\/td><td>Oxidation (NADH)<\/td><\/tr><tr><td>3<\/td><td><b>Dehydration<\/b> (−H<sub>2<\/sub>O, lyase)<\/td><td><b>trans-Δ²-enoyl-ACP<\/b><\/td><td>Hydration<\/td><\/tr><tr><td>4<\/td><td><b>Reduction<\/b> (<b>NADPH<\/b>)<\/td><td><b>Acyl-ACP<\/b> (saturated; C4 after round 1)<\/td><td>Oxidation (FAD)<\/td><\/tr><\/table><p>Then the chain moves <b>ACP → KS<\/b>, a new malonyl loads onto ACP, and the cycle repeats. Each round adds 2 C at the <b>carbonyl (C1) end<\/b> and uses <b>2 NADPH<\/b> (from the pentose phosphate pathway, plus malic enzyme). It stops at <b>16–18 C<\/b> (palmitate). Longer chains are elongated in the ER. The product is released as fatty acyl-CoA → triglycerides.<\/p><p>You don't need FAS's individual enzyme names, but know the intermediate names (the same as β-oxidation with ACP in place of CoA) and where NADPH is used.<\/p><h3>Cholesterol<\/h3><ul><li><b>Uses<\/b>: membrane component (adds rigidity), <b>bile acids<\/b> (fat-digesting emulsifiers made by the liver), <b>steroid hormones<\/b> (testosterone, estrogen), <b>vitamin D<\/b> (made in skin with sunlight). The liver makes about 1 g/day.<\/li><li><b>Pathway (know the key points)<\/b>: acetyl-CoA → acetoacetyl-CoA → <b>HMG-CoA<\/b> (shared with ketone body synthesis) → <b>mevalonate<\/b> by <b>HMG-CoA reductase<\/b> (uses <b>2 NADPH<\/b>; the <b>rate-limiting, committed step<\/b>) → activated <b>isoprene<\/b> units (5 C, made with ATP; one C lost as CO<sub>2<\/sub>) → stitched together → rings closed → cholesterol.<\/li><li>Serum cholesterol travels in <b>lipoproteins<\/b> (LDL, HDL). Too high a level is a risk factor for atherosclerosis, heart attack, and stroke.<\/li><li><div class=\"box\"><b>Statins<\/b> (Lipitor, Crestor) are <b>competitive inhibitors of HMG-CoA reductase<\/b>, lowering the liver's cholesterol synthesis.<\/div><\/li><\/ul>", "mc": [{"q": "Which tissues synthesize fatty acids?", "opts": ["All tissues", "Liver and adipose", "Muscle and brain", "Kidney and RBCs"], "ans": 1, "why": "β-Oxidation is widespread; synthesis is restricted."}, {"q": "Where does fatty acid synthesis occur?", "opts": ["Mitochondrial matrix", "Cytoplasm", "Peroxisome", "Nucleus"], "ans": 1, "why": "Separate from β-oxidation (matrix) to avoid futile cycling."}, {"q": "How does acetyl-CoA reach the cytoplasm for fatty acid synthesis?", "opts": ["Carnitine shuttle", "As citrate, then citrate lyase splits it (using ATP)", "Direct diffusion", "Malate–aspartate shuttle"], "ans": 1, "why": "The citrate shuttle."}, {"q": "The committed, regulated step of fatty acid synthesis is:", "opts": ["Fatty acid synthase", "Acetyl-CoA carboxylase", "Citrate lyase", "Thiolase"], "ans": 1, "why": "Acetyl-CoA + CO2 + ATP → malonyl-CoA."}, {"q": "Insulin activates acetyl-CoA carboxylase by:", "opts": ["Phosphorylating it", "Triggering its dephosphorylation", "Degrading it", "Allosteric ATP"], "ans": 1, "why": "The phosphorylated form is inactive."}, {"q": "Malonyl-CoA prevents newly synthesized fatty acids from being oxidized by inhibiting:", "opts": ["Acyl-CoA dehydrogenase", "Carnitine acyltransferase I", "Thiolase", "Hormone-sensitive lipase"], "ans": 1, "why": "This blocks entry of fatty acyl groups into the matrix."}, {"q": "In mammals, fatty acid synthase is:", "opts": ["Five separate polypeptides", "One very large multifunctional polypeptide", "A membrane complex", "A mitochondrial enzyme"], "ans": 1, "why": "About 800 kDa; plants and bacteria use separate polypeptides."}, {"q": "The acyl carrier protein (ACP) functions like:", "opts": ["Cytochrome c", "PDH's lipoyl-lysine arm (substrate channeling)", "Ubiquinone", "Carnitine"], "ans": 1, "why": "A long flexible tether that carries intermediates between active sites."}, {"q": "In the condensation step, the CO2 that leaves comes from:", "opts": ["Acetyl-CoA", "The carboxyl added by acetyl-CoA carboxylase (malonyl)", "NADPH", "ACP"], "ans": 1, "why": "Its loss creates the carbanion that attacks the acyl carbonyl."}, {"q": "Order of the four steps in one round of fatty acid synthesis:", "opts": ["Oxidation, hydration, oxidation, cleavage", "Condensation, reduction, dehydration, reduction", "Reduction, condensation, hydration, oxidation", "Condensation, oxidation, dehydration, oxidation"], "ans": 1, "why": "Exactly β-oxidation reversed."}, {"q": "The reductant used in fatty acid synthesis is:", "opts": ["NADH", "FADH2", "NADPH", "QH2"], "ans": 2, "why": "2 NADPH per round."}, {"q": "After round 1, the acyl-ACP has how many carbons?", "opts": ["2", "3", "4", "6"], "ans": 2, "why": "Acetyl (2) + 2 from malonyl (whose 3rd carbon leaves as CO2)."}, {"q": "Fatty acid synthase typically stops at:", "opts": ["C10", "C16–18", "C24", "C30"], "ans": 1, "why": "Longer chains are elongated in the ER."}, {"q": "The rate-limiting enzyme of cholesterol synthesis is:", "opts": ["HMG-CoA synthase", "HMG-CoA reductase", "HMG-CoA lyase", "Thiolase"], "ans": 1, "why": "HMG-CoA → mevalonate, using 2 NADPH."}, {"q": "Statin drugs work by:", "opts": ["Blocking LDL receptors", "Competitively inhibiting HMG-CoA reductase", "Activating lipase", "Inhibiting acetyl-CoA carboxylase"], "ans": 1, "why": "This slows hepatic cholesterol synthesis."}], "sa": [{"q": "Diagram how acetyl-CoA is moved from the matrix to the cytoplasm for fatty acid synthesis.", "a": "Matrix: acetyl-CoA + oxaloacetate → citrate (citrate synthase). Citrate is exported by the citrate transporter. Cytoplasm: citrate + CoA + ATP → acetyl-CoA + oxaloacetate + ADP + Pi (citrate lyase). Acetyl-CoA is then carboxylated to malonyl-CoA (acetyl-CoA carboxylase); OAA returns to the mitochondrion (via malate/pyruvate)."}, {"q": "Describe one round of fatty acid synthesis, naming the intermediates and showing how it mirrors β-oxidation.", "a": "Malonyl-ACP and acetyl-KS (or acyl-KS) condense: malonyl loses CO2 and its carbanion attacks the acyl carbonyl → β-ketoacyl-ACP (reverse of thiolase cleavage). Reduction with NADPH → β-hydroxyacyl-ACP (reverse of the NAD⁺ oxidation). Dehydration → trans-Δ²-enoyl-ACP (reverse of hydration). Reduction with NADPH → saturated acyl-ACP (reverse of the FAD oxidation). The chain moves to KS and a new malonyl loads onto ACP."}, {"q": "How does the liver avoid oxidizing fatty acids it has just made?", "a": "Synthesis is in the cytoplasm and β-oxidation is in the matrix, and fatty acyl groups need the carnitine shuttle to get in. Malonyl-CoA, made by acetyl-CoA carboxylase only when synthesis is on, allosterically inhibits carnitine acyltransferase I, so new fatty acids can't be imported and broken down. Hormones also coordinate this: insulin activates acetyl-CoA carboxylase."}]}, {"num": 17, "title": "Amino Acid Metabolism", "key": ["Animals burn amino acids for energy (humans 10–15% of calories, carnivores ~90%); plants never do", "Step 1 for every amino acid: transamination (aminotransferases) moves NH₂ onto α-ketoglutarate → glutamate, leaving the α-keto acid skeleton", "Glucogenic skeletons → pyruvate or citric acid cycle intermediates (can make glucose); ketogenic → acetyl-CoA / acetoacetyl-CoA (ketone bodies). Many are both; leucine is purely ketogenic", "α-KG ⇌ glutamate ⇌ glutamine is the amino-group reservoir; glutamine carries nitrogen in the blood to the liver", "Key enzymes: glutamate DH (glutamate ⇌ α-KG + NH₃, NAD(P)H), glutamine synthetase (+NH₃, ATP), glutaminase (glutamine → glutamate + NH₃)", "Urea cycle (liver; matrix + cytosol): NH₃ + aspartate's N + CO₂ → urea (H₂N–CO–NH₂), excreted by the kidneys. Fumarate links to the citric acid cycle"], "guide": "<h3>Amino acids as fuel<\/h3><p>Dietary protein is digested to free amino acids, absorbed in the small intestine, and used for protein synthesis or <b>energy<\/b>. Plants never burn amino acids: they work hard to make all 20 and keep every bit of fixed nitrogen.<\/p><h3>Step 1: deamination by transamination<\/h3><div class=\"box\">Amino acid + <b>α-ketoglutarate<\/b> ⇌ <b>α-keto acid<\/b> (carbon skeleton) + <b>glutamate<\/b> (<b>aminotransferases<\/b>, a family specific to R-group types)<\/div><p>The NH<sub>2<\/sub> and the carbonyl O swap places. The amino group has to come off before the skeleton can be oxidized.<\/p><h3>Step 2: the carbon skeletons<\/h3><p>There are 20 pathways (not required), but only two kinds of end product:<\/p><table><tr><th><\/th><th>Glucogenic<\/th><th>Ketogenic<\/th><\/tr><tr><td>Skeleton becomes<\/td><td><b>Pyruvate or citric acid cycle intermediates<\/b> (α-KG, succinyl-CoA, fumarate, OAA)<\/td><td><b>Acetyl-CoA or acetoacetyl-CoA<\/b><\/td><\/tr><tr><td>Muscle/other tissues<\/td><td>→ respiration → ATP<\/td><td>→ citric acid cycle → ATP<\/td><\/tr><tr><td>Liver (glucagon)<\/td><td>→ OAA → <b>gluconeogenesis<\/b><\/td><td>→ <b>ketone bodies<\/b><\/td><\/tr><tr><td>Examples<\/td><td>Ala → pyruvate; Asp (and Asn) → OAA; Glu (and Gln) → α-KG<\/td><td><b>Leucine<\/b> (purely ketogenic)<\/td><\/tr><\/table><p>Larger, complex amino acids are broken into pieces, often <b>both<\/b> glucogenic and ketogenic. You don't need to know each amino acid's exact entry point, but the simple ones are predictable.<\/p><h3>The amino-group reservoir and transport<\/h3><p>Transamination would eventually use up all the α-KG, and free <b>ammonia is toxic<\/b> even at low concentrations. The <b>α-KG ⇌ glutamate ⇌ glutamine<\/b> system stores amino groups and carries them to the liver.<\/p><table><tr><th>Enzyme<\/th><th>Reaction<\/th><\/tr><tr><td><b>Glutamate dehydrogenase<\/b><\/td><td>Glutamate + H<sub>2<\/sub>O + NAD(P)⁺ ⇌ <b>α-KG + NH<sub>3<\/sub><\/b> + NAD(P)H (oxidative deamination, reversible)<\/td><\/tr><tr><td><b>Glutamine synthetase<\/b><\/td><td>Glutamate + NH<sub>3<\/sub> + ATP → <b>glutamine<\/b> (via γ-glutamyl phosphate; Lecture 4)<\/td><\/tr><tr><td><b>Glutaminase<\/b><\/td><td>Glutamine + H<sub>2<\/sub>O → <b>glutamate + NH<sub>3<\/sub><\/b> (hydrolysis)<\/td><\/tr><\/table><p><b>Peripheral tissues<\/b> (e.g. muscle): transamination makes glutamate. Some is recycled to α-KG by glutamate DH, releasing NH<sub>3<\/sub>; the NH<sub>3<\/sub> plus more glutamate → <b>glutamine<\/b> (two nitrogens) → blood → <b>liver<\/b>. In the liver, glutaminase releases NH<sub>3<\/sub> + glutamate, and glutamate DH releases a second NH<sub>3<\/sub> + α-KG. The liver uses the α-KG carbon in many pathways.<\/p><h3>Getting rid of nitrogen: evolutionary strategies<\/h3><ul><li><b>Fish<\/b>: excrete <b>ammonia<\/b> directly through the gills (aquariums need microbes to process it).<\/li><li><b>Mammals<\/b> (water available): <b>urea<\/b>, excreted in a large volume of urine.<\/li><li><b>Birds and reptiles<\/b> (water-conserving): <b>uric acid<\/b>, less toxic, excreted as a white paste.<\/li><li><b>Plants<\/b>: never have excess nitrogen; they rely on nitrogen-fixing soil microbes.<\/li><\/ul><h3>Urea cycle (liver)<\/h3><p>Know the inputs and outputs: <b>free NH<sub>3<\/sub> (from glutaminase and glutamate DH) → urea<\/b>, excreted by the kidneys. Details for understanding:<\/p><ol><li><b>Matrix<\/b>: NH<sub>3<\/sub> + HCO<sub>3<\/sub><sup>−<\/sup> + <b>2 ATP<\/b> → <b>carbamoyl phosphate<\/b> (carbamoyl phosphate synthetase). Some glutamate gives its NH<sub>2<\/sub> to OAA → <b>aspartate<\/b> (aspartate aminotransferase).<\/li><li>Carbamoyl phosphate + <b>ornithine<\/b> → <b>citrulline<\/b> → exported to the cytosol (aspartate too).<\/li><li>Citrulline + aspartate + ATP → <b>argininosuccinate<\/b> (argininosuccinate synthetase).<\/li><li>Argininosuccinate → <b>arginine + fumarate<\/b> (argininosuccinase, a lyase).<\/li><li>Arginine + H<sub>2<\/sub>O → <b>urea<\/b> + ornithine (<b>arginase<\/b>). Ornithine is regenerated.<\/li><\/ol><div class=\"box\">Net: <b>NH<sub>3<\/sub> + aspartate's NH<sub>2<\/sub> + CO<sub>2<\/sub> → urea, H<sub>2<\/sub>N–C(=O)–NH<sub>2<\/sub><\/b>. It's expensive (≈3 ATP, 4 high-energy bonds), but necessary. <b>Citric acid cycle link<\/b>: OAA enters as aspartate and leaves as <b>fumarate<\/b>, which goes back to OAA (fumarase, malate DH, recovering an NADH). The cycle is the hub again.<\/div><p><i>Course wrap-up: all these reactions tell one story of how energy moves through living things.<\/i><\/p>", "mc": [{"q": "Why don't plants catabolize amino acids for energy?", "opts": ["They lack aminotransferases", "Making amino acids is costly and fixed nitrogen is precious", "They can't digest protein", "Amino acids are toxic to plants"], "ans": 1, "why": "Plants get energy from photosynthesis and keep all their nitrogen."}, {"q": "The first step in catabolizing any amino acid is usually:", "opts": ["Decarboxylation", "Transamination of the amino group onto α-ketoglutarate", "Oxidation of the R group", "Phosphorylation"], "ans": 1, "why": "Aminotransferases make glutamate plus the α-keto acid skeleton."}, {"q": "A glucogenic amino acid's skeleton is converted to:", "opts": ["Acetyl-CoA only", "Pyruvate or citric acid cycle intermediates", "Ketone bodies", "Urea"], "ans": 1, "why": "These can supply net carbon for gluconeogenesis."}, {"q": "Which amino acid is purely ketogenic?", "opts": ["Alanine", "Aspartate", "Leucine", "Glutamate"], "ans": 2, "why": "Its carbons yield only acetyl-CoA or acetoacetyl-CoA."}, {"q": "In the fasting liver, ketogenic amino acid carbon mainly becomes:", "opts": ["Glucose", "Ketone bodies", "Glycogen", "Urea"], "ans": 1, "why": "Acetyl-CoA goes into ketone body synthesis."}, {"q": "Which two molecules are the main reservoir and transport form for amino groups?", "opts": ["Alanine and pyruvate", "Glutamate and glutamine", "Aspartate and urea", "Ornithine and citrulline"], "ans": 1, "why": "Glutamine carries two nitrogens in the blood to the liver."}, {"q": "Glutamine synthetase:", "opts": ["Removes NH3 from glutamine", "Adds NH3 to glutamate using ATP", "Oxidizes glutamate", "Makes urea"], "ans": 1, "why": "Via a γ-glutamyl phosphate intermediate."}, {"q": "Glutaminase in the liver:", "opts": ["Makes glutamine", "Hydrolyzes glutamine → glutamate + NH3", "Makes α-KG from glutamine directly", "Makes carbamoyl phosphate"], "ans": 1, "why": "It releases nitrogen for the urea cycle."}, {"q": "Glutamate dehydrogenase converts glutamate to:", "opts": ["Glutamine", "α-Ketoglutarate + NH3 (with NAD(P)H)", "Aspartate", "Proline"], "ans": 1, "why": "Oxidative deamination, reversible."}, {"q": "Birds and reptiles excrete nitrogen mainly as:", "opts": ["Ammonia", "Urea", "Uric acid", "Glutamine"], "ans": 2, "why": "Less toxic and water-conserving."}, {"q": "The urea cycle occurs mainly in:", "opts": ["Kidney", "Liver (matrix + cytosol)", "Muscle", "Brain"], "ans": 1, "why": "The kidneys only filter urea out of the blood."}, {"q": "The two nitrogens in urea come from:", "opts": ["Two glutamines", "Free NH3 (via carbamoyl phosphate) and aspartate", "Arginine and lysine", "Ornithine and citrulline"], "ans": 1, "why": "Carbamoyl phosphate gives one; aspartate gives the other."}, {"q": "Which urea cycle product links to the citric acid cycle?", "opts": ["Ornithine", "Fumarate", "Citrulline", "Urea"], "ans": 1, "why": "Released from argininosuccinate; goes back to OAA."}, {"q": "Urea is released by which enzyme?", "opts": ["Arginase", "Argininosuccinase", "Carbamoyl phosphate synthetase", "Glutaminase"], "ans": 0, "why": "Arginine + H2O → urea + ornithine."}, {"q": "Which enzyme uses 2 ATP to fix ammonia in the first urea cycle step?", "opts": ["Glutamine synthetase", "Carbamoyl phosphate synthetase", "Arginase", "Glutamate DH"], "ans": 1, "why": "NH3 + HCO3⁻ + 2 ATP → carbamoyl phosphate."}], "sa": [{"q": "Describe how amino groups from amino acids catabolized in muscle reach the liver and are excreted.", "a": "In muscle, aminotransferases move amino groups onto α-KG, making glutamate. Some glutamate is converted back to α-KG by glutamate dehydrogenase, releasing NH3; glutamine synthetase adds NH3 to glutamate (ATP), making glutamine, which travels in the blood to the liver. In the liver, glutaminase releases NH3 + glutamate, and glutamate DH releases a second NH3 + α-KG. The NH3 (plus a nitrogen from aspartate) goes into the urea cycle, and urea is filtered by the kidneys into the urine."}, {"q": "Explain the difference between glucogenic and ketogenic amino acids and give an example of each.", "a": "Glucogenic amino acids yield pyruvate or citric acid cycle intermediates, which can feed gluconeogenesis (e.g. alanine → pyruvate, aspartate → OAA, glutamate → α-KG). Ketogenic amino acids yield acetyl-CoA or acetoacetyl-CoA, which can't make net glucose but can make ketone bodies in the liver (e.g. leucine). Many large amino acids are both, splitting into pieces with each fate."}, {"q": "Summarize the urea cycle: inputs, outputs, and its link to the citric acid cycle.", "a": "Matrix: NH3 + HCO3⁻ + 2 ATP → carbamoyl phosphate; + ornithine → citrulline, which is exported. Cytosol: citrulline + aspartate (+ATP) → argininosuccinate → arginine + fumarate → arginase → urea + ornithine. Net: NH3 + aspartate N + CO2 → urea. Aspartate comes from OAA (transamination) and its carbons leave as fumarate, which the citric acid cycle converts back to OAA."}]}], "ps": [{"num": 1, "title": "Thermodynamics, Enzymes, and Metabolism", "lectures": "Lectures 1–5", "intro": "Equation sheet (same as the exam): ΔG = ΔG°′ + RT ln([products]/[reactants]); ΔG°′ = −RT ln K′eq; R = 8.315 J/mol·K; always use T = 310 K, so RT = 2.578 kJ/mol.", "qs": [{"q": "Draw a dipeptide with alanine at the N-terminus and an unspecified amino acid (–R) at the C-terminus. Circle the peptide bond.", "key": null, "sug": "H3N⁺–CH(CH3)–C(=O)–NH–CH(R)–COO⁻. The peptide bond is the C(=O)–NH amide bond between alanine's carbonyl carbon and the second residue's nitrogen."}, {"q": "K′eq = 0.34. Without calculating, which apply? (a) ΔG°′ = 0 (b) exergonic (c) ΔG°′ is positive (d) could not go forward under cellular conditions (e) could go forward under cellular conditions", "key": "(c) and (e). K′eq < 1 means ΔG°′ is positive, but actual ΔG depends on concentrations, so the reaction can still run forward in cells.", "sug": null}, {"q": "How do enzymes affect the rate constant (k)? How does that affect velocity?", "key": "Enzymes lower the activation energy. A small decrease in activation energy produces a large increase in the rate constant, and therefore a large increase in reaction velocity.", "sug": null}, {"q": "How do enzymes affect the equilibrium constant?", "key": "Not at all. ΔG°′ and K′eq reflect the free energy of reactants vs. products, which is the same with or without the enzyme. Enzymes only speed up how fast equilibrium is reached.", "sug": null}, {"q": "Calculate ΔG°′ for K′eq = (a) 6.8 (b) 0.0475 (c) 254.", "key": "ΔG°′ = (−2.578 kJ/mol) ln K′eq. (a) −4.95 kJ/mol (b) +7.86 kJ/mol (c) −14.2 kJ/mol", "sug": null}, {"q": "Calculate K′eq for ΔG°′ = (a) −13.8 (b) −15.9 (c) +3.1 kJ/mol.", "key": "ln K′eq = ΔG°′ / −2.578. (a) 211 (b) 478 (c) 0.301", "sug": null}, {"q": "X ⇌ Y + Z at equilibrium: [X] = 8.2×10⁻² M, [Y] = [Z] = 1.7×10⁻⁶ M. k1 = 128 s⁻¹. Find k−1.", "key": "Keq = (1.7×10⁻⁶)² / 8.2×10⁻² = 3.5×10⁻¹¹ M. Keq = k1/k−1, so k−1 = 128 s⁻¹ / 3.5×10⁻¹¹ M = 3.7×10¹² M⁻¹s⁻¹.", "sug": null}, {"q": "Glucose + Pi → glucose 6-P + H2O, ΔG°′ = +13.8 kJ/mol. (a) K′eq? (b) With glucose = Pi = 4.8 mM, what [G6P] at equilibrium, and is that enough? (c) With Pi at 4.8 mM, what [glucose] gives 0.25 mM G6P, and is that reasonable?", "key": "(a) ln K′eq = −5.35, K′eq = 0.00475. (b) [G6P] = 0.00475 × (0.0048)² ≈ 1×10⁻⁷ M: far too low (intermediates need ≈0.25 mM). (c) [glucose] = 2.5×10⁻⁴ / (0.00475 × 0.0048) = 10.9 M: impossible, far above glucose's solubility. This is why ATP is used to phosphorylate glucose.", "sug": null}, {"q": "Leucine aminotransferase: glutamate (12 mM) + α-ketoisocaproate (8 mM) → α-ketoglutarate (3 mM) + leucine (0.5 mM), ΔG°′ = +7.2 kJ/mol. Find ΔG at 37 °C. Which direction?", "key": "Q = (0.003)(0.0005)/(0.012)(0.008) = 0.016. ΔG = 7.2 + 2.58 ln(0.016) = 7.2 − 10.7 = −3.5 kJ/mol. Forward.", "sug": null}, {"q": "ΔG for ATP hydrolysis with ATP 2.25 mM, ADP 0.25 mM, Pi 1.65 mM, ΔG°′ = −30.5 kJ/mol.", "key": "Q = (0.00025)(0.00165)/0.00225 = 0.00018 (always convert to M; 0.18 means you forgot). ΔG = −30.5 + 2.58 ln(0.00018) = −52.7 kJ/mol.", "sug": null}, {"q": "True or false: (a) allosteric effector binding is reversible (b) covalent modification is reversible (c) allosteric regulation can increase or decrease activity (d) covalent modification can increase or decrease activity (e) allosteric regulation requires a regulatory enzyme (f) covalent modification requires a regulatory enzyme.", "key": null, "sug": "(a) T (b) T (c) T (d) T (e) F: an effector just binds non-covalently (f) T: a kinase/phosphatase adds or removes the group."}, {"q": "Reactions with ΔG°′ = −13.2 and +5.3 kJ/mol are coupled. Endergonic or exergonic overall?", "key": null, "sug": "Add them: −13.2 + 5.3 = −7.9 kJ/mol, so exergonic."}, {"q": "Phosphoglucomutase (G6P → G1P, +7.3) and phosphohexose isomerase (G6P → F6P, +1.7). Write the pathway G1P → F6P and its ΔG°′.", "key": "G1P → G6P: −7.3 (reverse, flip sign). G6P → F6P: +1.7. Total G1P → F6P: −5.6 kJ/mol.", "sug": null}, {"q": "Classify: triose-phosphate isomerase, lactate dehydrogenase, chymotrypsin, Erk (protein kinase), protein phosphatase 1, enolase, phosphoglucomutase. (1 oxidoreductase, 2 transferase, 3 hydrolase, 4 lyase, 5 isomerase, 6 ligase)", "key": "TPI 5. LDH 1 (dehydrogenases and oxidases are oxidoreductases). Chymotrypsin 3 (cuts using water). Erk 2 (all kinases are transferases). PP1 3 (removes phosphate by hydrolysis). Enolase 4 (removes water, forms a double bond). Phosphoglucomutase 5 (mutases are isomerases).", "sug": null}, {"q": "ATP + H2O → ADP + Pi, ΔG°′ = −30.5 kJ/mol. How much energy can breaking the γ-phosphate contribute to an endergonic reaction?", "key": null, "sug": "Up to about 30.5 kJ/mol under standard conditions (more under cellular conditions, ≈ −50 kJ/mol), when coupled through a shared intermediate."}, {"q": "Use G6P + H2O → glucose + Pi (Keq 270) and ATP + glucose → G6P + ADP (Keq 890) to find ΔG°′ for ATP hydrolysis.", "key": "Endergonic: glucose + Pi → G6P, Keq = 1/270 = 0.0037. Keq(exergonic) × 0.0037 = 890, so Keq(ATP hydrolysis) = 2.41×10⁵. ΔG°′ = −2.578 × ln(2.41×10⁵) = −31.9 kJ/mol at 37 °C (−30.5 at 25 °C).", "sug": null}, {"q": "For NAD⁺/NADH reactions, circle the H that came from or went to NADH as hydride, mark H⁺ to/from solution, and add electron-pushing arrows.", "key": "Structural: the carbon-bound H on the reduced carbon is the hydride (:H⁻) from NADH or to NAD⁺; the O–H hydrogen is exchanged with solution as H⁺.", "sug": null}]}, {"num": 2, "title": "Glycolysis, Fermentation, and Ethanol Catabolism", "lectures": "Lectures 6–7", "intro": "Only a partial key was posted. Answers marked “Suggested” are mine, based on the lectures, not the official key.", "qs": [{"q": "Does glycolysis require oxygen?", "key": null, "sug": "No. Glycolysis is anaerobic. NAD⁺ must be regenerated, though, by fermentation or by respiration."}, {"q": "Where in the cell does glycolysis occur?", "key": null, "sug": "The cytoplasm (cytosol)."}, {"q": "Total vs. net ATP from 1 glucose → 2 pyruvate, and why they differ.", "key": null, "sug": "4 ATP made in total (2 per triose, from phosphoglycerate kinase and pyruvate kinase). Net 2, because 2 ATP are spent up front by hexokinase and PFK-1."}, {"q": "Define substrate-level phosphorylation. How many steps in glycolysis?", "key": null, "sug": "Making ATP (or GTP) by direct transfer of a phosphoryl group from a high-energy substrate to ADP, without the ETC or ATP synthase. Two steps: phosphoglycerate kinase (1,3-BPG) and pyruvate kinase (PEP)."}, {"q": "Which step is the regulated entry point for glucose? Name the enzyme and say why.", "key": null, "sug": "Fructose 6-P → fructose 1,6-bisphosphate by phosphofructokinase-1 (PFK-1). It is the first committed, irreversible step unique to glycolysis (G6P has other fates), so it is the logical control point."}, {"q": "Purpose of lactate and ethanol fermentation? Why do fermentation pathways matter for energy production?", "key": null, "sug": "To regenerate NAD⁺ from NADH so glyceraldehyde-3-P dehydrogenase, and therefore glycolysis, can keep running and making ATP when respiration can't reoxidize NADH (no O2 or no mitochondria). Fermentation makes no extra ATP itself."}, {"q": "Is pyruvate → lactate reversible? Why does it matter?", "key": "Reversible. In animals, lactate made under anaerobic conditions goes to the liver and is converted back to pyruvate (e.g. for gluconeogenesis).", "sug": null}, {"q": "Is pyruvate → ethanol reversible? Why?", "key": "Irreversible. One carbon leaves as CO2 in the first step (pyruvate decarboxylase), and fixing free CO2 is too energetically expensive outside photosynthesis, so acetaldehyde can't go back to pyruvate.", "sug": null}, {"q": "T/F: (a) ethanol fermentation and catabolism use the same enzymes in reverse (b) ethanol catabolism converts NAD⁺ to NADH (c) mammals do both (d) brewer's yeast does both.", "key": "(a) False (b) True (c) False (d) True", "sug": null}, {"q": "Write G3P → 1,3-BPG → 3-PG with enzymes. Where does the energy for substrate-level phosphorylation come from?", "key": "Step 7's substrate-level phosphorylation is driven by breaking the high-energy acyl phosphate on C1 of 1,3-BPG. That phosphate came from free Pi in step 6, and attaching it cost +49 kJ/mol. Where did that energy come from? (A core theme of the course.)", "sug": "G3P + NAD⁺ + Pi → 1,3-BPG + NADH (glyceraldehyde-3-P dehydrogenase). 1,3-BPG + ADP → 3-PG + ATP (phosphoglycerate kinase). The energy comes from oxidizing the aldehyde to a carboxylic-acid level: the thioester intermediate captures that oxidation energy, which lets Pi attack and form the acyl phosphate."}, {"q": "Write glycolysis reaction 1 with structures and arrow type. Name the enzyme and the liver isozyme.", "key": null, "sug": "Glucose + ATP → glucose 6-phosphate + ADP, irreversible (one-way arrow). Enzyme: hexokinase. Liver isozyme: glucokinase (hexokinase IV)."}, {"q": "Liver alcohol dehydrogenase with ethanol, then with methanol. Why is IV ethanol used for methanol poisoning?", "key": "ADH oxidizes many alcohols. Methanol → formaldehyde, which is highly toxic. IV ethanol competes with methanol for the ADH active site, slowing formaldehyde production long enough for methanol to be cleared by the kidneys and lungs.", "sug": "Ethanol + NAD⁺ → acetaldehyde + NADH + H⁺. Methanol + NAD⁺ → formaldehyde + NADH + H⁺."}, {"q": "Pyruvate kinase: PEP hydrolysis ΔG°′ = −61.9, ATP hydrolysis −30.5. ATP 5.3 mM, ADP 0.5 mM, PEP 6.0 mM, pyruvate 5.0 mM. Find ΔG.", "key": "ΔG°′ = −61.9 + 30.5 = −31.4 kJ/mol. Q = (0.0053)(0.0050)/(0.0005)(0.0060) = 8.83, ln Q = 2.18. ΔG = −31.4 + 2.578(2.18) = −25.8 kJ/mol.", "sug": null}]}, {"num": 3, "title": "Cellular Respiration", "lectures": "Lectures 8–12", "intro": "", "qs": [{"q": "Draw an acetyl group.", "key": "See lecture slides.", "sug": "CH3–C(=O)– , a methyl attached to a carbonyl carbon, which attaches to CoA through a thioester."}, {"q": "PDH complex mechanism: group on lipoyl-lysine, acetyl-CoA structure, disulfide/dithiol forms, last step, oxidation state, path of the electron pair from pyruvate, substrate channeling, and Enzyme 2's full name.", "key": "See lecture and slides.", "sug": "Hydroxyethyl-TPP transfers an acetyl to oxidized lipoamide (disulfide), giving acetyl-dihydrolipoamide. E2 (dihydrolipoyl transacetylase) moves the acetyl to CoA-SH, leaving reduced dihydrolipoamide (two –SH). E3 (dihydrolipoyl dehydrogenase) reoxidizes it via FAD → NADH. The electron pair from pyruvate's C1–C2 bond ends up in NADH. Substrate channeling: intermediates are passed between active sites on the swinging lipoyl arm without diffusing away."}, {"q": "Trace glucose's 6 carbons through glycolysis, PDH, and the citric acid cycle (intermediates, carbons, NADH, CO2). Where is the H2O made? Challenge: how many H2O per glucose?", "key": "Water forms at complex 4 (O2 reduction). Each electron pair at complex 4 gives 1 H2O, so 12; but enolase makes 2 and citrate synthase and fumarase each consume 2, so the net is 10 H2O per glucose.", "sug": "Glucose (6C) → 2 pyruvate (3C) + 2 NADH. 2 pyruvate → 2 acetyl-CoA (2C) + 2 CO2 + 2 NADH. 2 acetyl-CoA → 4 CO2 + 6 NADH + 2 FADH2 + 2 GTP. Total 6 CO2 out = 6 C in."}, {"q": "A cell is deprived of O2 for a long time with plenty of glucose. Which occurs? (a) ETC carriers all oxidized (b) all ATP synthesis stops (c) citric acid cycle stops (d) proton gradient dissipates (e) a and c (f) c and d", "key": "F. (a) No: carriers fill with electrons, so reduced. (b) No: glycolysis still makes ATP. (c) Yes: all matrix NAD⁺ becomes NADH. (d) Yes: H⁺ leaks back through ATP synthase with no pumping.", "sug": null}, {"q": "Ubiquinone/ubiquinol (1 M each) vs. the standard hydrogen electrode gives +0.045 V. (a) E°′ of ubiquinone? (b) Which is higher, ubiquinone or O2?", "key": "(a) +0.045 V, which is the definition of standard reduction potential. (b) Oxygen: it is the final acceptor at the end of the ETC.", "sug": null}, {"q": "Complex 3 passes electrons from QH2 to a carrier. (a) Name it (b) what is it made of (c) where is it (d) balanced equation (e) ΔG°′ with E°′ 0.045 and 0.254 V, F = 96.5 kJ/V·mol.", "key": "(a) Cytochrome c. (b) A single-polypeptide protein with a heme prosthetic group. (c) Soluble in the intermembrane space. (d) QH2 + 2 cyt c(ox) → Q + 2 cyt c(red) + 2H⁺. (e) ΔE°′ = 0.209 V; ΔG°′ = −2(96.5)(0.209) = −40.3 kJ/mol (or −20.2 for the 1-electron version).", "sug": null}, {"q": "Succinyl-CoA synthetase: describe how substrate-level phosphorylation of GDP happens and the enzyme-bound intermediate.", "key": "Think through it by analogy to glycolysis reactions 6 and 7.", "sug": "Pi attacks the thioester of succinyl-CoA, releasing CoA and forming succinyl phosphate (acyl phosphate). The phosphate moves to a histidine on the enzyme (phosphohistidine intermediate), then to GDP → GTP. The exergonic thioester cleavage drives the endergonic GTP formation."}, {"q": "ATP yield from electron pairs: (a) H⁺ pumped per NADH (b) H⁺ per ATP through F0 (c) H⁺ per Pi imported (d) total H⁺ per ATP (e) ATP per NADH (f) ATP per FADH2.", "key": "(b) 3 H⁺: each 120° turn of γ releases one ATP. (c) 1 H⁺ (H⁺–phosphate symporter). (d) 4 H⁺ per ATP.", "sug": "(a) 4 + 4 + 2 = 10 H⁺ (complexes 1, 3, 4). (e) 10/4 = 2.5 ATP per NADH. (f) Complex 2 pumps none: 4 + 2 = 6 H⁺, so 6/4 = 1.5 ATP per FADH2."}, {"q": "TPP: where does the circled electron pair go? Name three TPP enzymes, their intermediates, products, and the fate of the electrons.", "key": "(1) Pyruvate decarboxylase: pyruvate → acetaldehyde; electrons form the aldehyde C–H bond. (2) PDH complex: pyruvate → acetyl-CoA; electrons form NADH. (3) α-ketoglutarate dehydrogenase: α-KG → succinyl-CoA; electrons form NADH.", "sug": null}, {"q": "Why is the citric acid cycle 8 steps when 4 could oxidize acetyl to CO2?", "key": "It is a central hub: many pathways share its intermediates and enzymes. OAA and α-KG start amino acid synthesis. Malate dehydrogenase is part of the NADH shuttle. Citrate synthase moves acetyl groups out for fatty acid synthesis. OAA feeds gluconeogenesis. OAA (as aspartate) and fumarate exchange with the urea cycle.", "sug": null}, {"q": "How is the PDH complex regulated?", "key": "Negative allosteric effectors: ATP, NADH, acetyl-CoA. Positive: AMP, NAD⁺, CoA. These report the cell's energy state. Also covalent control: a PDH kinase phosphorylates and inactivates E1, and the kinase is itself allosterically activated by ATP. A PDH phosphatase with constant low activity removes the phosphate once the kinase turns off.", "sug": null}, {"q": "Isolated mitochondria plus substrates and inhibitors (rotenone, BNI, antimycin A, cyanide, SYSE): oxidation state of each complex. When is O2 consumed?", "key": "Before a block, carriers are reduced; after it, oxidized. Examples: NADH + rotenone: C1 reduced, rest oxidized. NADH + BNI: all oxidized. NADH + antimycin A: C1 reduced, C3 partially reduced, C4 oxidized. NADH + cyanide: C1, C3, C4 reduced. NADH + succinate + SYSE: C1, C3, C4 reduced, C2 oxidized.", "sug": "O2 is consumed whenever electrons can reach complex 4 and cyanide is absent: conditions 2, 3, 4, 7, 11, 12."}, {"q": "Sketch O2 consumption and ATP synthesis vs. time: start with succinate, ADP, Pi; add uncoupler at 4 min, ATP synthase inhibitor at 8 min.", "key": "Do this one on your own.", "sug": "0–4 min: both rise steadily. After the uncoupler: O2 consumption jumps (no back-pressure from the gradient) and ATP synthesis stops. After the ATP synthase inhibitor: O2 consumption stays high (still uncoupled) and ATP stays flat."}, {"q": "Mutant PDH: a little CO2 and acetyl-CoA, then everything stops; no NADH. Which enzyme is broken?", "key": "Rule out enzymes whose products appear; a broken later enzyme backs up the whole assembly line.", "sug": "E3, dihydrolipoyl dehydrogenase. E1 works (CO2 made) and E2 works (acetyl-CoA made), but without E3 the lipoyl arms stay reduced after one round, so everything stops and no NADH forms."}]}, {"num": 4, "title": "Gluconeogenesis through Amino Acid Metabolism", "lectures": "Lectures 13–17", "intro": "", "qs": [{"q": "Four fates of glucose 6-phosphate (pathway and end product).", "key": "See lectures.", "sug": "Glycolysis → pyruvate. Glycogen synthesis → glycogen. Pentose phosphate pathway → NADPH + ribose 5-P. Glucose 6-phosphatase (liver) → free glucose into the blood."}, {"q": "Three fates of acetyl-CoA and when each happens.", "key": "See lectures.", "sug": "Citric acid cycle (cell needs ATP). Fatty acid synthesis (fed state, high insulin, excess energy). Ketone body synthesis (liver during fasting or low blood glucose)."}, {"q": "Three fates of pyruvate.", "key": "See lectures.", "sug": "PDH → acetyl-CoA. Lactate dehydrogenase → lactate (or ethanol in yeast). Pyruvate carboxylase → oxaloacetate (gluconeogenesis or replenishing the cycle). Also transamination → alanine."}, {"q": "Hormonal regulation table.", "key": "Insulin (high blood glucose after eating): glycogen synthesis, fatty acid synthesis, glycolysis. Glucagon (fasting or exercise, low blood glucose): triglyceride breakdown in adipose, glycogenolysis, gluconeogenesis.", "sug": null}, {"q": "Two biosynthetic products of the pentose phosphate pathway and pathways that use them.", "key": "See lectures.", "sug": "NADPH: fatty acid and cholesterol synthesis (fed state, liver and adipose), plus glutathione reduction. Ribose 5-phosphate: nucleotide and DNA/RNA synthesis (dividing cells)."}, {"q": "Glycogen synthesis from glucose 6-phosphate.", "key": "See lectures.", "sug": "G6P → G1P (phosphoglucomutase). G1P + UTP → UDP-glucose + PPi (UDP-glucose pyrophosphorylase; PPi hydrolysis drives it). UDP-glucose + glycogen(n) → glycogen(n+1) + UDP (glycogen synthase, α1→4). Branching enzyme makes α1→6 branches."}, {"q": "First bypass of gluconeogenesis when lactate is NOT the main pyruvate source (malate route).", "key": "Matrix: pyruvate + HCO3⁻ + ATP → OAA (pyruvate carboxylase). OAA + NADH → malate (mito malate DH). Malate exits. Cytoplasm: malate + NAD⁺ → OAA + NADH (cyto malate DH). OAA + GTP → PEP + GDP + CO2 (PEP carboxykinase).", "sug": null}, {"q": "Why use this route?", "key": "To move NADH reducing equivalents out of the mitochondria, since gluconeogenesis needs cytosolic NADH. When lactate is the source, lactate → pyruvate makes NADH in the cytosol already.", "sug": null}, {"q": "How do aspartate and alanine supply carbon for gluconeogenesis?", "key": "See lectures.", "sug": "Transamination: alanine ⇌ pyruvate; aspartate ⇌ oxaloacetate (the amino group goes to α-KG → glutamate). Pyruvate and OAA then enter gluconeogenesis."}, {"q": "Two components released from triglycerides and how each is catabolized.", "key": "See lectures.", "sug": "Fatty acids → β-oxidation → acetyl-CoA → citric acid cycle. Glycerol → glycerol 3-P → DHAP → glycolysis (or gluconeogenesis in liver)."}, {"q": "acetyl-CoA + CO2 + ATP → ?; enzyme?", "key": "Malonyl-CoA + ADP + Pi; acetyl-CoA carboxylase.", "sug": null}, {"q": "How is acetyl-CoA exported from the matrix for fatty acid synthesis?", "key": "See lectures.", "sug": "Citrate shuttle: acetyl-CoA + OAA → citrate (citrate synthase, matrix). Citrate exits. Cytosol: citrate lyase (uses ATP) → acetyl-CoA + OAA. OAA → malate → pyruvate (malic enzyme, makes NADPH) → back into the mitochondria."}, {"q": "What allosteric regulation stops new fatty acids from being β-oxidized during synthesis?", "key": "Hint: malonyl-CoA is the effector.", "sug": "Malonyl-CoA inhibits carnitine acyltransferase I (CPT-1), so fatty acyl groups can't enter the mitochondria for β-oxidation."}, {"q": "Carbon 1, α, β, γ through one round of β-oxidation and one round of fatty acid synthesis.", "key": "See lectures.", "sug": "β-oxidation: acyl-CoA → trans-Δ2-enoyl-CoA (acyl-CoA DH, FAD → FADH2) → L-3-hydroxyacyl-CoA (hydratase) → 3-ketoacyl-CoA (DH, NAD⁺ → NADH) → thiolysis → acetyl-CoA + acyl-CoA(n−2). Synthesis is the reverse logic on ACP using NADPH: condensation (−CO2) → reduction → dehydration → reduction."}, {"q": "ETC entry points for electrons from fully oxidizing glucose in brain, and ATP per pair.", "key": "Hint: which shuttle carries glycolytic NADH?", "sug": "Brain uses the glycerol 3-phosphate shuttle: cytosolic NADH enters as FADH2 → Q (1.5 ATP). Mitochondrial NADH (PDH, CAC) → complex 1 (2.5 ATP). Succinate → complex 2 (1.5 ATP)."}, {"q": "ETC entry points for fatty acid oxidation in skeletal muscle and ATP per pair.", "key": "Hint: one entry point is an enzyme in β-oxidation.", "sug": "Acyl-CoA dehydrogenase FADH2 → ETF → ETF:Q oxidoreductase → Q (1.5 ATP). NADH from β-oxidation and the CAC → complex 1 (2.5 ATP). Succinate DH → complex 2 (1.5 ATP)."}, {"q": "Which two molecules store and transport amino groups?", "key": "Glutamate and glutamine (α-KG ⇌ glutamate ⇌ glutamine). Glutamine made in non-liver tissues carries nitrogen in the blood to the liver, where it becomes glutamate/α-KG and the nitrogen goes to urea.", "sug": null}, {"q": "What does the urea cycle make for excretion?", "key": "See lectures.", "sug": "Urea, H2N–C(=O)–NH2, excreted by the kidneys."}, {"q": "Ketogenic amino acids are converted into what?", "key": "See lectures.", "sug": "Acetyl-CoA or acetoacetyl-CoA (ketone body precursors), not gluconeogenic intermediates."}, {"q": "Synthesis of alanine, asparagine, glutamine.", "key": "Alanine: pyruvate → alanine. Asparagine: OAA → aspartate → asparagine. Glutamine: α-KG → glutamate → glutamine.", "sug": null}, {"q": "Possible (P) or not (NP) for large net amounts: (a) glucose → acetyl-CoA → fatty acids (b) fatty acids → acetyl-CoA → glucose (c) glycerol → pyruvate → glucose (d) glycerol → pyruvate → ribose 5-P (e) glucose → acetyl-CoA → alanine (f) fatty acids → ketone bodies → glucose (g) alanine → pyruvate → glucose", "key": "Think about it…", "sug": "(a) P (b) NP: PDH is irreversible and acetyl-CoA's 2 carbons are lost as CO2 (c) P (d) P (e) NP: acetyl-CoA can't go back to pyruvate (f) NP (g) P"}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const L = DATA.lectures, PS = DATA.ps;
const UNITS = [
  {name:"Energy & enzymes", r:[1,5]},
  {name:"Glucose breakdown", r:[6,7]},
  {name:"Cellular respiration", r:[8,12]},
  {name:"Building & fuel use", r:[13,17]}
];
const LET = "ABCDEFGH";
let state = {};
try { state = JSON.parse(localStorage.getItem('bibc102') || '{}') || {}; } catch(e) { state = {}; }
state.mc = state.mc || {}; state.ps = state.ps || {};
function save(){ try { localStorage.setItem('bibc102', JSON.stringify(state)); } catch(e){} }
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function wrapTables(html){ return html.replace(/<table>/g,'<div class="tblwrap"><table>').replace(/<\/table>/g,'</table></div>'); }

function lecStats(n){
  const lec = L.find(x=>x.num===n); let done=0, right=0;
  lec.mc.forEach((q,i)=>{ const a=state.mc[n+'-'+i]; if(a!==undefined){done++; if(a===q.ans) right++;} });
  return {done, right, total: lec.mc.length};
}
function renderScore(){
  let done=0,right=0,total=0;
  L.forEach(l=>{const s=lecStats(l.num); done+=s.done; right+=s.right; total+=s.total;});
  const psDone = Object.values(state.ps).filter(v=>v==='g'||v==='b').length;
  const psGot = Object.values(state.ps).filter(v=>v==='g').length;
  const psTotal = PS.reduce((a,s)=>a+s.qs.length,0);
  $('#score').innerHTML = `Quizzes <b>${right}/${done}</b> right · ${done}/${total} done &nbsp;·&nbsp; Problem sets <b>${psGot}</b>/${psTotal} got it <button class="linkbtn" id="reset">Reset progress</button>`;
  $('#reset').onclick = () => {
    const b = $('#reset');
    if (b.dataset.armed) { state = {mc:{}, ps:{}}; save(); route(); }
    else { b.dataset.armed = 1; b.textContent = 'Click again to erase all answers'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='Reset progress'; } }, 3000); }
  };
}

function renderRail(cur){
  let h = '';
  UNITS.forEach(u=>{
    h += `<h4>${u.name}</h4>`;
    L.filter(l=>l.num>=u.r[0]&&l.num<=u.r[1]).forEach(l=>{
      const s = lecStats(l.num);
      const pct = s.done ? `${s.right}/${s.total}` : '';
      h += `<button data-l="${l.num}" aria-current="${cur===l.num}"><span class="n">L${l.num}</span><span>${esc(l.title)}</span><span class="pct ${s.done===s.total?'done':''}">${pct}</span></button>`;
    });
  });
  $('#rail').innerHTML = h;
  $('#rail').querySelectorAll('button').forEach(b=>b.onclick=()=>{ location.hash = 'l'+b.dataset.l; });
}

function jumpSelect(cur){
  return `<div class="jump"><label class="note" for="jumpsel">Lecture</label><select id="jumpsel">${L.map(l=>`<option value="${l.num}" ${l.num===cur?'selected':''}>L${l.num} · ${esc(l.title)}</option>`).join('')}</select></div>`;
}

let lecTab = 'guide';
function renderLecture(n){
  const lec = L.find(x=>x.num===n) || L[0]; n = lec.num;
  renderRail(n);
  const unit = UNITS.find(u=>n>=u.r[0]&&n<=u.r[1]);
  const s = lecStats(n);
  let h = jumpSelect(n) + `<div class="eyebrow">Lecture ${n} · ${unit.name}</div><h1>${esc(lec.title)}</h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-guide" aria-selected="${lecTab==='guide'}">Study guide</button>
      <button role="tab" id="t-quiz" aria-selected="${lecTab==='quiz'}">Quiz · ${s.done}/${s.total}</button>
    </div>`;
  if (lecTab==='guide'){
    h += `<section class="keys"><h3>Must know</h3><ul>${lec.key.map(k=>`<li>${esc(k)}</li>`).join('')}</ul></section>
      <article class="guide">${wrapTables(lec.guide)}</article>
      <div class="row" style="margin-top:28px"><button class="btn primary" id="goquiz">Take the Lecture ${n} quiz</button>${n<17?`<button class="btn" id="next">Next: Lecture ${n+1}</button>`:''}</div>`;
  } else {
    h += `<div class="bar"><span>${s.right} right out of ${s.done} answered</span><button class="btn" id="clearq">Retake this quiz</button></div>`;
    lec.mc.forEach((q,i)=>{
      const k = n+'-'+i, a = state.mc[k];
      h += `<div class="q" data-k="${k}"><div class="qh"><span class="qn">${i+1}</span><p class="stem">${esc(q.q)}</p></div><div class="opts">`;
      q.opts.forEach((o,j)=>{
        let cls = '';
        if (a!==undefined){ if(j===q.ans) cls='right'; else if(j===a) cls='wrong'; }
        h += `<button data-j="${j}" class="${cls}" ${a!==undefined?'disabled':''}><span class="l">${LET[j]}</span><span>${esc(o)}</span></button>`;
      });
      h += `</div>`;
      if (a!==undefined) h += `<p class="why ${a===q.ans?'ok':'no'}"><b>${a===q.ans?'Correct.':'Not quite. Answer: '+LET[q.ans]+'.'}</b> ${esc(q.why)}</p>`;
      h += `</div>`;
    });
    h += `<h3 style="font:700 1.15rem var(--display);margin:28px 0 12px">Short answer</h3><p class="note">Write your answer first, then compare it with the model answer.</p>`;
    lec.sa.forEach((q,i)=>{
      h += `<div class="q"><div class="qh"><span class="qn">SA${i+1}</span><p class="stem">${esc(q.q)}</p></div>
        <textarea id="sa-${n}-${i}" aria-label="Your answer"></textarea>
        <div class="row"><button class="btn reveal" data-i="${i}">Show model answer</button></div>
        <div class="ans sug" id="saa-${n}-${i}" hidden><span class="tag">Model answer</span>${esc(q.a)}</div></div>`;
    });
  }
  $('#main').innerHTML = h;
  $('#t-guide').onclick = ()=>{ lecTab='guide'; renderLecture(n); };
  $('#t-quiz').onclick = ()=>{ lecTab='quiz'; renderLecture(n); };
  const js = $('#jumpsel'); if (js) js.onchange = ()=>{ location.hash = 'l'+js.value; };
  if (lecTab==='guide'){
    $('#goquiz').onclick = ()=>{ lecTab='quiz'; renderLecture(n); window.scrollTo(0,0); };
    const nx = $('#next'); if (nx) nx.onclick = ()=>{ location.hash = 'l'+(n+1); };
  } else {
    $('#clearq').onclick = ()=>{ lec.mc.forEach((q,i)=>delete state.mc[n+'-'+i]); save(); renderScore(); renderLecture(n); };
    document.querySelectorAll('.q[data-k]').forEach(card=>{
      card.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
        state.mc[card.dataset.k] = +b.dataset.j; save(); renderScore();
        const y = window.scrollY; renderLecture(n); window.scrollTo(0,y);
      });
    });
    document.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{ const el=$('#saa-'+n+'-'+b.dataset.i); el.hidden=!el.hidden; b.textContent = el.hidden?'Show model answer':'Hide model answer'; });
    try { lec.sa.forEach((q,i)=>{ const t=$('#sa-'+n+'-'+i); const v=localStorage.getItem('sa-'+n+'-'+i); if(v) t.value=v; t.oninput=()=>{ try{localStorage.setItem('sa-'+n+'-'+i,t.value);}catch(e){} }; }); } catch(e){}
  }
}

const EQ_HTML = `<div class="eqs">
  <div class="eq"><code>ΔG = ΔG°′ + RT ln Q</code><span>Actual free energy. Q = [products]/[reactants] at current concentrations, in molar.</span></div>
  <div class="eq"><code>ΔG°′ = −RT ln K′eq</code><span>R = 8.315 J/mol·K, T = 310 K, so −RT = −2.578 kJ/mol.</span></div>
  <div class="eq"><code>ΔG°′ = −nFΔE°′</code><span>F = 96.5 kJ/V·mol; ΔE°′ = E°′(acceptor) − E°′(donor).</span></div>
  <div class="eq"><code>Coupled: add ΔG, multiply K</code><span>Reverse a reaction: flip the sign of ΔG°′, take 1/K.</span></div>
</div>`;

let psSet = 1, psFilter = 'all';
function renderPS(){
  renderRail(0);
  const set = PS.find(s=>s.num===psSet);
  let h = `<div class="eyebrow">Practice · closest thing to the midterms</div><h1>Problem sets</h1>
    <div class="pschips">${PS.map(s=>{
      const got = s.qs.filter((q,i)=>state.ps[s.num+'-'+i]==='g').length;
      return `<button data-s="${s.num}" aria-pressed="${s.num===psSet}">PS${s.num}: ${esc(s.title)}<small>${s.lectures} · ${got}/${s.qs.length} got it</small></button>`;}).join('')}</div>`;
  if (psSet===1) h += EQ_HTML;
  if (set.intro) h += `<p class="note">${esc(set.intro)}</p>`;
  h += `<div class="bar"><span>Work each problem on paper, reveal the answer, then mark yourself.</span>
    <span class="row" style="margin:0">${[['all','All'],['todo','Not yet marked'],['b','Missed']].map(([f,t])=>`<button class="btn ${psFilter===f?'primary':''}" data-f="${f}" aria-pressed="${psFilter===f}">${t}</button>`).join('')}</span></div>`;
  set.qs.forEach((q,i)=>{
    const k = set.num+'-'+i, m = state.ps[k];
    if (psFilter==='todo' && m) return;
    if (psFilter==='b' && m!=='b') return;
    h += `<div class="q"><div class="qh"><span class="qn">${i+1}</span><p class="stem">${esc(q.q)}</p></div>
      <div class="row"><button class="btn show" data-k="${k}">Show answer</button>
        <span class="row self" style="margin:0"><button class="btn mark g ${m==='g'?'on':''}" data-k="${k}" data-m="g">Got it</button><button class="btn mark b ${m==='b'?'on':''}" data-k="${k}" data-m="b">Missed it</button></span></div>
      <div id="psa-${k}" hidden>
        ${q.key?`<div class="ans key"><span class="tag">Official key</span>${esc(q.key)}</div>`:''}
        ${q.sug?`<div class="ans sug"><span class="tag">${q.key?'Worked out from lecture':'Suggested answer (not from the key)'}</span>${esc(q.sug)}</div>`:''}
      </div></div>`;
  });
  $('#main').innerHTML = h;
  if (!set.qs.some((q,i)=>{const m=state.ps[set.num+'-'+i]; return psFilter==='all'||(psFilter==='todo'&&!m)||(psFilter==='b'&&m==='b');}))
    $('#main').insertAdjacentHTML('beforeend', `<p class="empty">${psFilter==='b'?'No missed problems in this set.':'Every problem in this set is marked.'}</p>`);
  document.querySelectorAll('.pschips button').forEach(b=>b.onclick=()=>{ psSet=+b.dataset.s; location.hash='ps'+psSet; });
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ psFilter=b.dataset.f; renderPS(); });
  document.querySelectorAll('.show').forEach(b=>b.onclick=()=>{ const el=$('#psa-'+b.dataset.k); el.hidden=!el.hidden; b.textContent=el.hidden?'Show answer':'Hide answer'; });
  document.querySelectorAll('.mark').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; state.ps[k] = state.ps[k]===b.dataset.m ? undefined : b.dataset.m; if(!state.ps[k]) delete state.ps[k]; save(); renderScore();
    const y=window.scrollY; const open=[...document.querySelectorAll('[id^="psa-"]')].filter(e=>!e.hidden).map(e=>e.id);
    renderPS(); open.forEach(id=>{ const e=document.getElementById(id); if(e){ e.hidden=false; const sb=document.querySelector(`.show[data-k="${id.slice(4)}"]`); if(sb) sb.textContent='Hide answer'; } }); window.scrollTo(0,y);
  });
}

function fmt(x, d=3){ if(!isFinite(x)) return '—'; const a=Math.abs(x); return (a!==0&&(a<1e-3||a>=1e5)) ? x.toExponential(2) : x.toFixed(d).replace(/\.?0+$/,''); }
function renderEq(){
  renderRail(0);
  $('#main').innerHTML = `<div class="eyebrow">Same sheet you get on the exam</div><h1>Equations and calculators</h1>${EQ_HTML}
  <p class="note" style="margin-bottom:16px">Use these to check your work on problem set calculations. Concentrations in molar (5 mM = 0.005).</p>
  <div class="calc"><h3>ΔG°′ ↔ K′eq</h3><span class="note">Enter one and the other fills in.</span>
    <div class="fields"><label for="c-g">ΔG°′ (kJ/mol)<input id="c-g" inputmode="decimal" placeholder="-13.8"></label><label for="c-k">K′eq<input id="c-k" inputmode="decimal" placeholder="211"></label></div>
    <div class="out" id="o1">ln K′eq = ΔG°′ / −2.578</div></div>
  <div class="calc"><h3>Actual ΔG</h3><span class="note">Enter Q directly, or products and reactants as comma-separated molar values.</span>
    <div class="fields"><label for="c-g0">ΔG°′ (kJ/mol)<input id="c-g0" inputmode="decimal" placeholder="-30.5"></label>
      <label for="c-p">Products (M)<input id="c-p" placeholder="0.00025, 0.00165"></label><label for="c-r">Reactants (M)<input id="c-r" placeholder="0.00225"></label></div>
    <div class="out" id="o2">ΔG = ΔG°′ + 2.578 ln Q</div></div>
  <div class="calc"><h3>Redox ΔG°′</h3>
    <div class="fields"><label for="c-ea">E°′ acceptor (V)<input id="c-ea" inputmode="decimal" placeholder="0.254"></label><label for="c-ed">E°′ donor (V)<input id="c-ed" inputmode="decimal" placeholder="0.045"></label><label for="c-n">n electrons<input id="c-n" inputmode="numeric" value="2"></label></div>
    <div class="out" id="o3">ΔG°′ = −n(96.5)ΔE°′</div></div>
  <div class="calc"><h3>ATP bookkeeping</h3><span class="note">4 H⁺ per ATP (3 through F₀ + 1 for Pi import).</span>
    <div class="tblwrap" style="margin-top:10px"><table style="border-collapse:collapse;width:100%;font-size:.92rem">
      <tr><td style="padding:6px 10px">NADH → complex I</td><td style="padding:6px 10px">10 H⁺</td><td style="padding:6px 10px"><b>2.5 ATP</b></td></tr>
      <tr><td style="padding:6px 10px">FADH₂ / succinate / G3P shuttle / acyl-CoA DH → Q</td><td style="padding:6px 10px">6 H⁺</td><td style="padding:6px 10px"><b>1.5 ATP</b></td></tr>
      <tr><td style="padding:6px 10px">Glucose, complete oxidation</td><td style="padding:6px 10px"></td><td style="padding:6px 10px"><b>30–32 ATP</b></td></tr>
      <tr><td style="padding:6px 10px">Palmitate (C16)</td><td style="padding:6px 10px"></td><td style="padding:6px 10px"><b>106 ATP</b></td></tr>
    </table></div></div>`;
  const RT = 2.578, num = v => { const x = parseFloat(String(v).replace('−','-')); return isNaN(x)?null:x; };
  const g=$('#c-g'), k=$('#c-k');
  g.oninput=()=>{ const v=num(g.value); if(v===null) return; const lnk=v/-RT; k.value=fmt(Math.exp(lnk),4); $('#o1').textContent=`ln K′eq = ${fmt(v)} / −2.578 = ${fmt(lnk)}  →  K′eq = ${fmt(Math.exp(lnk),4)}`; };
  k.oninput=()=>{ const v=num(k.value); if(v===null||v<=0) return; const G=-RT*Math.log(v); g.value=fmt(G); $('#o1').textContent=`ΔG°′ = −2.578 × ln(${fmt(v,4)}) = −2.578 × ${fmt(Math.log(v))} = ${fmt(G,2)} kJ/mol`; };
  const calc2=()=>{ const g0=num($('#c-g0').value); const prod=$('#c-p').value.split(',').map(num).filter(x=>x!==null); const reac=$('#c-r').value.split(',').map(num).filter(x=>x!==null);
    if(g0===null||!prod.length||!reac.length){ $('#o2').textContent='ΔG = ΔG°′ + 2.578 ln Q'; return; }
    const Q = prod.reduce((a,b)=>a*b,1)/reac.reduce((a,b)=>a*b,1); const G=g0+RT*Math.log(Q);
    $('#o2').textContent=`Q = ${fmt(Q,5)}, ln Q = ${fmt(Math.log(Q))}  →  ΔG = ${fmt(g0)} + 2.578(${fmt(Math.log(Q))}) = ${fmt(G,2)} kJ/mol  (${G<0?'forward':G>0?'reverse':'at equilibrium'})`; };
  ['#c-g0','#c-p','#c-r'].forEach(s=>$(s).oninput=calc2);
  const calc3=()=>{ const a=num($('#c-ea').value), d=num($('#c-ed').value), n=num($('#c-n').value); if(a===null||d===null||n===null) return;
    const dE=a-d, G=-n*96.5*dE; $('#o3').textContent=`ΔE°′ = ${fmt(a)} − ${fmt(d)} = ${fmt(dE)} V  →  ΔG°′ = −${n}(96.5)(${fmt(dE)}) = ${fmt(G,1)} kJ/mol`; };
  ['#c-ea','#c-ed','#c-n'].forEach(s=>$(s).oninput=calc3);
}

function setView(v){ document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===v)); }
function route(){
  const h = location.hash.slice(1);
  renderScore();
  let m;
  if ((m = h.match(/^ps([1-4])$/))) { psSet=+m[1]; setView('ps'); renderPS(); }
  else if (h==='ps') { setView('ps'); renderPS(); }
  else if (h==='eq') { setView('eq'); renderEq(); }
  else { m = h.match(/^l(\d{1,2})$/); const n = m ? Math.min(17,Math.max(1,+m[1])) : (state.last||1); state.last=n; save(); setView('lec'); renderLecture(n); }
}
let prevHash = location.hash;
window.addEventListener('hashchange', ()=>{ if (/^#l\d/.test(location.hash) && location.hash!==prevHash) lecTab='guide'; prevHash=location.hash; route(); window.scrollTo(0,0); });
document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v; location.hash = v==='lec' ? 'l'+(state.last||1) : v==='ps' ? 'ps'+psSet : 'eq';
});
route();
</script>
