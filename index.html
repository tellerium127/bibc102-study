<style>
/* Layout: sticky top bar, left rail of lectures grouped by unit, reading column with tabs (guide / quiz), separate problem-set and equation views */
:root{
  --bg:#f5f6f2; --panel:#ffffff; --ink:#18211e; --muted:#5d6a64; --line:#dde2dc;
  --accent:#1f6b56; --accent-soft:#e3efe9; --key:#8a5a00; --key-soft:#fbf1dc;
  --good:#1d7a3e; --good-soft:#e2f3e7; --bad:#b3261e; --bad-soft:#fbe7e5;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --panel:#18201d; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2a3531;
  --accent:#6cc7a6; --accent-soft:#1c3129; --key:#e5b765; --key-soft:#2e2717;
  --good:#6fd394; --good-soft:#16301f; --bad:#f08a80; --bad-soft:#3a1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --panel:#18201d; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2a3531;
  --accent:#6cc7a6; --accent-soft:#1c3129; --key:#e5b765; --key-soft:#2e2717;
  --good:#6fd394; --good-soft:#16301f; --bad:#f08a80; --bad-soft:#3a1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font:700 1.25rem/1.1 var(--display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 .72rem var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.views{display:flex;gap:4px;flex-wrap:wrap}
.views button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:.9rem}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.score{margin-left:auto;font:500 .82rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.score b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.8rem}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.rail h4{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.rail h4:first-child{margin-top:0}
.rail button{display:grid;grid-template-columns:2.2em 1fr auto;gap:4px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  border-radius:8px;padding:6px 8px;font-size:.9rem;line-height:1.3;color:var(--ink)}
.rail button:hover{background:var(--accent-soft)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.rail .n{font:500 .78rem var(--mono);color:var(--muted)}
.rail .pct{font:500 .7rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rail .pct.done{color:var(--good)}
.jump{display:none}
main{min-width:0}
.eyebrow{font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(1.6rem,3.4vw,2.3rem)/1.12 var(--display);letter-spacing:-.015em;margin:4px 0 14px;text-wrap:balance}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:8px 0 22px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font-weight:500;color:var(--muted);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.keys{background:var(--accent-soft);border-radius:12px;padding:14px 18px 14px 18px;margin:0 0 26px}
.keys h3{font:600 .78rem var(--mono);letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px;color:var(--accent)}
.keys ul{margin:0;padding-left:1.1em}
.keys li{margin:3px 0}
.guide{max-width:72ch}
.guide h3{font:700 1.2rem/1.25 var(--display);margin:30px 0 8px;text-wrap:balance}
.guide h3:first-child{margin-top:0}
.guide p,.guide li{max-width:70ch}
.guide ul,.guide ol{padding-left:1.25em}
.guide li{margin:4px 0}
.box{border-left:3px solid var(--key);background:var(--key-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.tblwrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px}
.guide table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--panel)}
.guide th,.guide td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.guide th{font:600 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.guide tr:last-child td{border-bottom:0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
.q .qh{display:flex;gap:10px;align-items:baseline}
.q .qn{font:500 .78rem var(--mono);color:var(--muted);flex:none}
.q p.stem{margin:0 0 10px;font-weight:500}
.opts{display:grid;gap:6px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;display:flex;gap:10px;line-height:1.4}
.opts button .l{font:500 .8rem var(--mono);color:var(--muted);flex:none;padding-top:1px}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button:disabled{cursor:default}
.opts button.right{background:var(--good-soft);border-color:var(--good)}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{margin:10px 0 0;font-size:.92rem;padding:8px 12px;border-radius:8px;background:var(--bg)}
.why.ok b{color:var(--good)} .why.no b{color:var(--bad)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 14px;font-size:.9rem;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ans{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:.94rem}
.ans.key{background:var(--key-soft);border-left:3px solid var(--key)}
.ans.sug{background:var(--accent-soft);border-left:3px solid var(--accent)}
.ans .tag{font:600 .68rem var(--mono);letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:2px}
.ans.key .tag{color:var(--key)} .ans.sug .tag{color:var(--accent)}
.self button.on.g{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.self button.on.b{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:-6px 0 18px;color:var(--muted);font-size:.9rem}
.note{color:var(--muted);font-size:.9rem;max-width:70ch}
.eqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 26px}
.eq{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.eq code{font:500 1rem var(--mono);display:block;margin-bottom:4px}
.eq span{color:var(--muted);font-size:.88rem}
.calc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
.calc h3{font:700 1.05rem var(--display);margin:0 0 4px}
.calc .fields{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px}
.calc label{display:grid;gap:3px;font:500 .74rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.calc input{font:500 .95rem var(--mono);width:9.5em;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.out{font:500 .95rem var(--mono);margin-top:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pschips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.pschips button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;text-align:left;line-height:1.3}
.pschips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pschips small{display:block;font:500 .72rem var(--mono);color:var(--muted)}
.empty{color:var(--muted)}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .jump{display:block;margin:0 0 16px}
  .jump select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .score{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:no-preference){.opts button,.views button,.rail button{transition:background .15s,border-color .15s}}

<script id="data" type="application/json">{"lectures": [{"num": 1, "title": "Course Introduction, Amino Acids, and Protein Structure", "key": ["Metabolism is a story about energy, and the original source is sunlight → carbohydrates", "Know 5 amino acid structures: alanine, aspartate, asparagine, glutamate, glutamine", "Transamination: alanine ⇌ pyruvate, aspartate ⇌ oxaloacetate, glutamate ⇌ α-ketoglutarate", "Secondary structure = backbone H-bonds only; tertiary/quaternary = mostly R-group interactions", "Proteins are flexible; hexokinase clamps down on glucose (induced fit)"], "guide": "<h3>The story of the course<\/h3><p>Metabolism is about how <b>energy<\/b> moves through cells. The original source is sunlight, which plants turn into carbohydrates (photosynthesis isn't covered). The course follows what cells do with those carbohydrates. Oxidizing glucose is chemically the same as combustion (the end products are CO<sub>2<\/sub> and H<sub>2<\/sub>O), but it's done stepwise so the energy can be captured as ATP.<\/p><p>Don't brute-force memorize. Learn a few structures, then follow the energy through each reaction. Example: glycolysis has 10 reactions, but only <b>one<\/b> is the key energy-capturing reaction; the rest set it up or follow it. <b>7 of the 10 glycolysis reactions are reversible<\/b>, which is why most of glycolysis runs backwards in <b>gluconeogenesis<\/b>.<\/p><h3>Amino acid structure<\/h3><ul><li>Central <b>α-carbon<\/b> bonded to an α-carboxyl group, an α-amino group, an H (all but proline), and the <b>R group<\/b>.<\/li><li>The α-carbon is a chiral center in every amino acid except <b>glycine<\/b>.<\/li><li>At physiological pH: carboxyl → COO⁻ (proton-acceptor form); amino → NH<sub>3<\/sub>⁺ (amines act as weak bases).<\/li><li>There are 20 amino acids, which differ only in their R groups.<\/li><\/ul><h3>R-group classes<\/h3><ul><li><b>Nonpolar aliphatic<\/b> (hydrophobic): Gly, Ala, Pro, Val, Leu, Ile, Met<\/li><li><b>Polar uncharged<\/b>: –OH, –SH, or amide (Asn, Gln); can H-bond<\/li><li><b>Aromatic<\/b>: Phe, Tyr, Trp<\/li><li><b>Positively charged (basic)<\/b>: Lys, Arg. His has pKa ≈ 6, so it's mostly neutral at pH 7.<\/li><li><b>Negatively charged<\/b>: aspartate and glutamate. The \"-ic acid\" name is the protonated form; \"-ate\" is the deprotonated form.<\/li><\/ul><h3>The five structures you must know<\/h3><p>Amino acids interconvert with their <b>α-keto acids<\/b>: the amino group is swapped for a carbonyl O (transamination) and the R group stays the same.<\/p><table><tr><th>Amino acid<\/th><th>α-keto acid<\/th><th>Why it matters<\/th><\/tr><tr><td>Alanine<\/td><td>Pyruvate<\/td><td>End product of glycolysis<\/td><\/tr><tr><td>Aspartate<\/td><td>Oxaloacetate<\/td><td>Citric acid cycle intermediate<\/td><\/tr><tr><td>Glutamate<\/td><td>α-Ketoglutarate<\/td><td>Citric acid cycle intermediate<\/td><\/tr><\/table><p><b>Asparagine<\/b> = amide of aspartate; <b>glutamine<\/b> = amide of glutamate (an NH<sub>2<\/sub> added to the side-chain COOH). Glutamate has one more CH<sub>2<\/sub> than aspartate.<\/p><h3>Peptide bonds<\/h3><ul><li>An amide linkage between one residue's carboxyl C and the next residue's amino N (the carboxyl O is lost).<\/li><li>It has <b>partial double-bond character<\/b> (resonance), so there's no free rotation around it, which constrains folding.<\/li><li>Chains have an <b>N-terminus<\/b> and a <b>C-terminus<\/b>. Number residues from the N-terminus (e.g. Ser255).<\/li><li>A protein is usually ≥50–100 residues, and an unfolded polypeptide is not a functional protein.<\/li><\/ul><h3>Four levels of structure<\/h3><ol><li><b>Primary<\/b>: the linear sequence.<\/li><li><b>Secondary<\/b>: α-helix and β-pleated sheet (plus loose coil), held by <b>H-bonds between backbone atoms only<\/b>. R groups point outward. In the α-helix, a carbonyl O bonds to the N–H 3–4 residues along. (Analogy: a curly phone cord snapping into its coil.)<\/li><li><b>Tertiary<\/b>: the overall 3-D fold, driven mainly by R groups: hydrophobic interactions (nonpolar groups tucked inside, away from water), H-bonds, ionic bonds, and <b>disulfide bonds<\/b> (covalent, between two Cys thiols; the only covalent bond in folding).<\/li><li><b>Quaternary<\/b>: multiple polypeptide subunits, same or different. Common in metabolic enzymes.<\/li><\/ol><p><b>Myoglobin<\/b> (muscle O<sub>2<\/sub>-binding, heme group) is a single polypeptide, so it has no quaternary structure. Ribbon diagrams hide the R groups, which are most of the protein's bulk.<\/p><h3>Proteins flex<\/h3><p><b>Hexokinase<\/b> (glycolysis step 1: glucose + ATP → glucose 6-phosphate) binds its substrates in a cleft, the <b>active site<\/b>. Glucose binding makes it clamp shut. That change in shape is part of how it catalyzes. All proteins are flexible, and their movement is part of their function.<\/p>", "mc": [{"q": "What is the original energy source for nearly all life on Earth?", "opts": ["Glucose", "ATP", "Sunlight", "Geothermal heat"], "ans": 2, "why": "Plants capture sunlight by photosynthesis and make carbohydrates."}, {"q": "How many of the 10 glycolysis reactions are reversible?", "opts": ["3", "5", "7", "10"], "ans": 2, "why": "7 of 10 are reversible, which is why gluconeogenesis can reuse most of them."}, {"q": "Which amino acid lacks a chiral α-carbon?", "opts": ["Alanine", "Glycine", "Proline", "Serine"], "ans": 1, "why": "Glycine's R group is H, so its α-carbon has two identical substituents."}, {"q": "At physiological pH, the free α-amino and α-carboxyl groups are:", "opts": ["NH2 and COOH", "NH3⁺ and COO⁻", "NH2 and COO⁻", "NH3⁺ and COOH"], "ans": 1, "why": "Amines act as weak bases (pick up H⁺) and carboxylic acids deprotonate."}, {"q": "Transamination of alanine produces:", "opts": ["Oxaloacetate", "α-Ketoglutarate", "Pyruvate", "Acetyl-CoA"], "ans": 2, "why": "Alanine ⇌ pyruvate links amino acid and carbohydrate metabolism."}, {"q": "Aspartate is converted by transamination to which citric acid cycle intermediate?", "opts": ["Oxaloacetate", "Succinate", "Citrate", "α-Ketoglutarate"], "ans": 0, "why": "Aspartate ⇌ oxaloacetate."}, {"q": "Glutamine is best described as:", "opts": ["The α-keto acid of glutamate", "The amide of glutamate", "Glutamate with an extra CH2", "The amide of aspartate"], "ans": 1, "why": "An NH2 replaces the OH of glutamate's side-chain carboxyl."}, {"q": "Why can't residues rotate freely around the peptide bond?", "opts": ["It is an ester bond", "Resonance gives it partial double-bond character", "It is ionic", "R groups block rotation"], "ans": 1, "why": "Electrons delocalize between C=O and N, so it acts like a partial double bond."}, {"q": "α-helix and β-sheet are stabilized by:", "opts": ["Disulfide bonds", "Ionic bonds between R groups", "H-bonds between backbone atoms", "Hydrophobic interactions"], "ans": 2, "why": "Ordered secondary structure uses only backbone C=O···H–N hydrogen bonds; R groups point outward."}, {"q": "The only covalent bond involved in tertiary structure is the:", "opts": ["Peptide bond", "Disulfide bond", "Phosphodiester bond", "Glycosidic bond"], "ans": 1, "why": "Disulfide bonds form between two cysteine thiols."}, {"q": "Myoglobin has no quaternary structure because:", "opts": ["It lacks a heme", "It is a single polypeptide", "It has no α-helix", "It is unfolded"], "ans": 1, "why": "Quaternary structure needs more than one subunit."}, {"q": "What happens when glucose binds hexokinase?", "opts": ["Nothing; proteins are rigid", "The enzyme clamps down (changes shape)", "The enzyme dissociates", "ATP is released"], "ans": 1, "why": "Glucose binding induces a conformational change, an example of protein flexibility."}], "sa": [{"q": "Name the four levels of protein structure and the main interactions behind each.", "a": "Primary: the amino acid sequence (peptide bonds). Secondary: α-helix and β-sheet from backbone H-bonds. Tertiary: the 3-D fold, mainly from R-group interactions (hydrophobic, H-bonds, ionic, disulfide). Quaternary: assembly of subunits, by the same R-group interactions."}, {"q": "Why does the instructor want you to know alanine, aspartate, and glutamate in particular?", "a": "Each transaminates to a central metabolite: alanine ⇌ pyruvate (glycolysis), aspartate ⇌ oxaloacetate and glutamate ⇌ α-ketoglutarate (citric acid cycle). Asparagine and glutamine are just their amides, so these few structures connect amino acid metabolism to the rest of the course."}, {"q": "Explain why hydrophobic R groups end up inside a folded protein.", "a": "Nonpolar groups clustered together don't need water molecules ordered around them. Excluding water this way is lower in free energy (more thermodynamically stable), so folding buries them in the core."}]}, {"num": 2, "title": "Biochemical Thermodynamics", "key": ["G = H − TS: bond energy (enthalpy) and organization (low entropy) both raise free energy", "ΔG°′ = biochemical standard: 1 M solutes, pH 7, 1 mM Mg²⁺, 310 K in this class", "ΔG°′ = −RT ln K′eq, with −RT = −2.578 kJ/mol; Keq > 1 ⇔ ΔG°′ < 0", "The actual ΔG = ΔG°′ + RT ln Q decides direction; ΔG = 0 means equilibrium", "Enzymes lower ΔG‡ (strain bonds, align substrates) but never change ΔG°′, Keq, or ΔG"], "guide": "<h3>Gibbs free energy<\/h3><p>On a free-energy diagram, the y-axis is <b>G<\/b> (joules) and the x-axis is the reaction coordinate. Reactants climb an energy hump to the <b>transition state<\/b> (bonds breaking and forming), then drop to products. <b>ΔG<\/b> = G(products) − G(reactants). Negative ΔG is <b>exergonic<\/b> and favorable (the universe tends toward lower energy); positive ΔG is <b>endergonic<\/b>.<\/p><p><b>G = H − TS<\/b><\/p><ul><li><b>Enthalpy (H)<\/b> is the energy in chemical bonds. ATP's phospho-anhydride bonds are high-enthalpy because three negatively charged phosphates repel each other and strain the bonds.<\/li><li><b>Entropy (S)<\/b> is randomness. More order → lower S → <b>higher G<\/b>. Free nucleotides have lower G than the same nucleotides ordered into DNA. <i>Organization is a form of energy.<\/i><\/li><\/ul><h3>Standard free energy change<\/h3><p>ΔG depends on concentrations, so a constant is defined at fixed conditions. <b>ΔG°<\/b>: 1 M reactants and products (1 atm gases), 25 °C. That doesn't work in biology because [H⁺] would be 1 M (pH 0). So we use <b>ΔG°′ (biochemical standard)<\/b>: 1 M solutes, <b>pH 7<\/b> ([H⁺] = 10⁻⁷ M), <b>1 mM Mg²⁺<\/b> (an ATP-enzyme cofactor; 1 M would disrupt proteins), and 298 or <b>310 K (always use 310 K in this class)<\/b>.<\/p><h3>Linking ΔG°′ and K′eq<\/h3><p>K′eq = [products]<sub>eq<\/sub>/[reactants]<sub>eq<\/sub>. Both describe thermodynamic favorability: <b>ΔG°′ = −RT ln K′eq<\/b>, with R = 8.315 J/mol·K (given on exams).<\/p><div class=\"box\"><b>Shortcut:<\/b> −RT = −(8.315)(310) = −2578 J/mol = <b>−2.578 kJ/mol<\/b>, always.<br>Worked example: G6P + H<sub>2<\/sub>O → glucose + Pi, ΔG°′ = −13.8 kJ/mol. ln K′eq = −13.8/−2.578 = 5.35 → K′eq = e<sup>5.35<\/sup> ≈ <b>211<\/b>.<\/div><ul><li>K′eq &gt; 1 → ΔG°′ negative (the bigger K, the more exergonic)<\/li><li>K′eq &lt; 1 → ΔG°′ positive<\/li><li>K′eq = 1 → ΔG°′ = 0 (ln 1 = 0)<\/li><\/ul><h3>Actual free energy change<\/h3><p>Cells are never at 1 M. The <b>actual ΔG<\/b> (no °′) decides which way a reaction actually goes:<\/p><div class=\"box\"><b>ΔG = ΔG°′ + RT ln Q<\/b>, where Q (mass action ratio) = [products]/[reactants] at <i>starting<\/i> (not equilibrium) concentrations.<\/div><ul><li>ΔG &lt; 0 → goes forward. ΔG &gt; 0 → goes in reverse. <b>ΔG = 0 → at equilibrium.<\/b><\/li><li>A small ΔG°′ (e.g. −1.5 kJ/mol) can be pushed backwards by high product concentrations. A large one (ATP hydrolysis, −30.5 kJ/mol) is effectively irreversible.<\/li><li>ΔG changes constantly as concentrations change. Flux through a pathway sets the direction of many glycolysis and gluconeogenesis steps.<\/li><\/ul><h3>Activation energy<\/h3><p><b>ΔG‡<\/b> (always positive) is the free energy needed to reach the transition state, and it sets the <b>rate<\/b>. A <i>small<\/i> decrease in ΔG‡ gives an <i>exponentially large<\/i> increase in the rate constant k. Example: catalase speeds H<sub>2<\/sub>O<sub>2<\/sub> breakdown about <b>10⁹-fold<\/b> (a bottle takes years on its own, minutes with a drop of enzyme).<\/p><p>ΔG‡ = ΔH‡ − TΔS‡:<\/p><ul><li><b>ΔH‡<\/b>: bond strain needed to break existing bonds<\/li><li><b>ΔS‡<\/b> (negative): organization/alignment the reactants must acquire to react<\/li><\/ul><h3>How enzymes lower ΔG‡<\/h3><ul><li><b>Active site<\/b>: a cleft or pocket that binds <b>substrates<\/b> (the name for reactants in enzyme reactions) with high specificity. Its R groups take part in catalysis.<\/li><li><b>Induced fit<\/b>: binding (weak, non-covalent) shifts the enzyme's conformation until it fits best. Substrate in the induced-fit enzyme ≈ the transition state.<\/li><li><b>Enthalpy<\/b>: binding <b>strains substrate bonds<\/b>, raising the substrate's G, so less extra strain (ΔH‡) is needed.<\/li><li><b>Entropy<\/b>: the enzyme <b>aligns substrates<\/b> with each other (dihydrofolate reductase: dihydrofolate and NADPH held so electrons can transfer) or with catalytic R groups (chymotrypsin: Ser195's –OH lined up to attack the peptide carbonyl), so less organization must be gained.<\/li><li><b>Binding energy (ΔG<sub>B<\/sub>)<\/b>: E + S → ES is always exergonic. That released energy pays for the strain and ordering.<\/li><\/ul><h3>What enzymes do and don't change<\/h3><table><tr><th>Do NOT change<\/th><th>DO change<\/th><\/tr><tr><td>ΔG°′, K′eq, actual ΔG, position of equilibrium<\/td><td>ΔG‡ (lower), rate constant k (higher), how fast equilibrium is reached<\/td><\/tr><\/table><p>Enzymes lower the hump by the <b>same amount for the forward and reverse reactions<\/b>, so both speed up by the same factor. Concentrations decide which direction actually goes. This is what lets metabolic reactions run both ways.<\/p>", "mc": [{"q": "Which conditions define the biochemical standard state (ΔG°′) used in this class?", "opts": ["1 M solutes, pH 0, 298 K", "1 M solutes, pH 7, 1 mM Mg²⁺, 310 K", "Cellular concentrations, pH 7.4", "1 mM solutes, pH 7, 310 K"], "ans": 1, "why": "The prime adds pH 7 and 1 mM Mg²⁺; the class always uses 310 K."}, {"q": "Increasing the organization of a set of molecules does what to their free energy?", "opts": ["Decreases it", "Increases it", "No effect", "Depends only on enthalpy"], "ans": 1, "why": "More order = lower entropy = higher G (G = H − TS)."}, {"q": "Why are ATP's phosphoanhydride bonds high in enthalpy?", "opts": ["They are hydrogen bonds", "Charge repulsion between negative phosphates strains them", "They are ionic", "Mg²⁺ breaks them"], "ans": 1, "why": "Three negatively charged phosphates push apart and strain the O–P bonds."}, {"q": "ΔG°′ = −13.8 kJ/mol. What is K′eq at 310 K?", "opts": ["0.0047", "5.35", "211", "13.8"], "ans": 2, "why": "ln K = −13.8/−2.578 = 5.35, and e^5.35 ≈ 211."}, {"q": "If K′eq = 1, ΔG°′ is:", "opts": ["Positive", "Negative", "Zero", "Undefined"], "ans": 2, "why": "ln 1 = 0."}, {"q": "A reaction has ΔG°′ = −1.5 kJ/mol. Can it run in reverse in a cell?", "opts": ["Never", "Yes, if product concentrations are high enough", "Only with an enzyme", "Only at 25 °C"], "ans": 1, "why": "A small ΔG°′ can be overcome by the RT ln Q term."}, {"q": "The actual ΔG of a reaction is 0. This means:", "opts": ["The reaction cannot occur", "The reaction is at equilibrium", "ΔG°′ = 0", "K′eq = 0"], "ans": 1, "why": "There is no net driving force in either direction."}, {"q": "In ΔG = ΔG°′ + RT ln Q, Q uses:", "opts": ["Equilibrium concentrations", "Starting (current) concentrations", "Standard 1 M concentrations", "Only reactant concentrations"], "ans": 1, "why": "Q is the mass action ratio at current, not equilibrium, concentrations."}, {"q": "What does an enzyme change?", "opts": ["ΔG°′", "K′eq", "Activation energy ΔG‡", "Actual ΔG"], "ans": 2, "why": "Enzymes only lower ΔG‡, which increases the rate constant."}, {"q": "How do enzymes contribute to lowering ΔH‡?", "opts": ["By aligning substrates", "By straining substrate bonds on binding", "By changing pH", "By adding ATP"], "ans": 1, "why": "Bond strain raises the substrate's enthalpy, so less extra strain is needed."}, {"q": "Lowering ΔG‡ by the entropy term mostly involves:", "opts": ["Breaking covalent bonds", "Correctly orienting substrates and catalytic R groups", "Heating the active site", "Raising Keq"], "ans": 1, "why": "Organization imposed by the active site means less ordering is needed to reach the transition state."}, {"q": "An enzyme lowers the forward ΔG‡ by 10 kJ/mol. The reverse ΔG‡:", "opts": ["Is unchanged", "Is lowered by 10 kJ/mol", "Is raised by 10 kJ/mol", "Becomes zero"], "ans": 1, "why": "The transition state drops, lowering both humps equally, so both rates rise by the same factor."}, {"q": "Where does the energy to strain and align the substrate come from?", "opts": ["ATP hydrolysis always", "Binding energy, since E + S → ES is exergonic", "Heat from the cell", "The product"], "ans": 1, "why": "ΔG_B from favorable binding drives the induced-fit change."}], "sa": [{"q": "Calculate ΔG°′ for a reaction with K′eq = 0.0475 and state whether it is exergonic.", "a": "ΔG°′ = −2.578 × ln(0.0475) = −2.578 × (−3.047) = +7.86 kJ/mol. Endergonic, since K′eq < 1."}, {"q": "Explain the difference between ΔG°′ and ΔG and which one determines the direction of a reaction in a cell.", "a": "ΔG°′ is a constant at standard conditions that reports intrinsic favorability (it relates to K′eq). ΔG is the actual change at current concentrations, ΔG = ΔG°′ + RT ln Q. ΔG decides direction: negative goes forward, positive goes in reverse, zero is equilibrium."}, {"q": "Describe how induced fit lowers activation energy through both enthalpy and entropy.", "a": "Binding is exergonic, and that binding energy drives the enzyme into its induced-fit conformation. That conformation strains substrate bonds, raising enthalpy so less ΔH‡ is needed. It also positions substrates relative to each other and to catalytic R groups, so less ordering (ΔS‡) is needed. Together ΔG‡ falls and k rises exponentially."}]}, {"num": 3, "title": "More Information on Enzymes", "key": ["Cofactors = metal ions or coenzymes; coenzymes are either shuttles (NAD⁺, CoA) or permanently bound prosthetic groups", "Six enzyme classes: oxidoreductase, transferase, hydrolase, lyase, isomerase, ligase", "Kinases are transferases moving phosphate to or from ATP/ADP; protein kinases go one way only", "Two modes of regulation: allosteric (reversible, non-covalent, outside the active site) and reversible covalent modification (needs another enzyme)", "Protein phosphorylation on Ser/Thr/Tyr –OH is the main covalent mode; phosphatases remove the phosphate by hydrolysis"], "guide": "<h3>Cofactors: enzyme helper molecules<\/h3><ul><li><b>Metal ions<\/b> take part in catalysis. Oxidoreductases often use <b>Fe or Cu<\/b>, which carry single electrons. Enzymes that bind ATP (e.g. kinases) almost always use <b>Mg²⁺<\/b>, which binds ATP.<\/li><li><b>Coenzymes<\/b> are small organic molecules that take part directly in the reaction:<ul><li><b>Shuttle coenzymes<\/b> act like substrates: they bind, pick something up, leave, and carry it elsewhere. Examples: <b>NAD⁺ → NADH<\/b> carries electrons; <b>CoA → acetyl-CoA<\/b> carries acetyl groups.<\/li><li><b>Prosthetic groups<\/b> are <b>permanently bound<\/b> in the active site and take part in the mechanism.<\/li><\/ul><\/li><\/ul><h3>Six enzyme classes<\/h3><p>Knowing the class tells you what kind of reaction happens, and often the name gives away the class.<\/p><table><tr><th>#<\/th><th>Class<\/th><th>What it does<\/th><\/tr><tr><td>1<\/td><td><b>Oxidoreductase<\/b><\/td><td>Redox reactions (dehydrogenases, oxidases)<\/td><\/tr><tr><td>2<\/td><td><b>Transferase<\/b><\/td><td>Moves a chemical group between two substrates. <b>All kinases.<\/b><\/td><\/tr><tr><td>3<\/td><td><b>Hydrolase<\/b><\/td><td>Cuts using H<sub>2<\/sub>O (proteases, nucleases, lipases, phosphatases)<\/td><\/tr><tr><td>4<\/td><td><b>Lyase<\/b><\/td><td>Removes a double bond while adding a group, or the reverse. In this course: adding or removing H<sub>2<\/sub>O across a C=C. Reversible.<\/td><\/tr><tr><td>5<\/td><td><b>Isomerase<\/b><\/td><td>Rearranges atoms within one molecule. Usually ΔG°′ ≈ 0, so it goes either way. (Mutases are isomerases.)<\/td><\/tr><tr><td>6<\/td><td><b>Ligase<\/b><\/td><td>Condensation: joins two molecules with a new covalent bond, using <b>ATP<\/b> (or another energy source)<\/td><\/tr><\/table><p><b>Kinases<\/b> move a phosphate from ATP to a substrate, or from a high-energy substrate to ADP. They can go either way, and glycolysis has <b>four<\/b>.<\/p><h3>Regulating enzyme activity<\/h3><p>Pathways must be coordinated (otherwise it's \"metabolic chaos\"), so cells regulate key enzymes. There are only <b>two modes<\/b>:<\/p><table><tr><th><\/th><th>Allosteric<\/th><th>Reversible covalent modification<\/th><\/tr><tr><td>Binding<\/td><td>Weak, reversible, non-covalent<\/td><td>Covalent attachment and removal of a group<\/td><\/tr><tr><td>Controlled by<\/td><td>Effector <b>concentration<\/b><\/td><td>Another <b>enzyme<\/b> (e.g. a kinase or phosphatase)<\/td><\/tr><tr><td>Effect<\/td><td>Can increase or decrease activity<\/td><td>Can increase or decrease activity<\/td><\/tr><\/table><h3>Allosteric regulation<\/h3><ul><li>\"Allo\" = other, \"steric\" = shape: the effector changes the enzyme's shape, which changes its activity.<\/li><li>Effectors are small molecules (cAMP, Ca²⁺, ATP, NADH…) that bind an <b>allosteric site separate from the active site<\/b>. That's different from inhibitors, which usually bind the active site.<\/li><li>Usually multi-subunit enzymes: a catalytic subunit (C) with the active site, and a regulatory subunit (R) with the allosteric site.<\/li><li>The course covers only <b>heterotropic<\/b> regulation (the effector isn't the substrate). Ignore homotropic.<\/li><\/ul><p><b>Feedback inhibition<\/b>: a pathway's end product shuts off its first enzyme. Example (bacteria): threonine → isoleucine in 5 steps. When isoleucine is high, it binds <b>threonine dehydratase<\/b> allosterically and turns off the pathway; when it falls, it unbinds and the pathway restarts. In energy metabolism, high-energy products like <b>ATP and NADH<\/b> often feed back on early enzymes.<\/p><h3>Covalent modification: protein phosphorylation<\/h3><ul><li>The most important covalent mode. Many groups are possible (methyl, acetyl, nucleotides), but phosphorylation dominates.<\/li><li><b>Protein kinases<\/b> transfer a phosphate from ATP to a specific residue in a specific sequence context. They are <b>one-way<\/b>: they never regenerate ATP.<\/li><li><b>Protein phosphatases<\/b> remove it by <b>hydrolysis<\/b> (so they're hydrolases).<\/li><li>Only <b>Ser, Thr, Tyr<\/b> are phosphorylated, on their R-group <b>–OH<\/b>.<\/li><li>The phosphate is bulky and carries <b>2 negative charges<\/b>, which shifts the enzyme's conformation.<\/li><\/ul><p>All regulation comes down to <b>shape<\/b>, and it is graded, not all-or-none, so flux can be fine-tuned.<\/p>", "mc": [{"q": "A coenzyme permanently bound in an enzyme's active site is called a:", "opts": ["Shuttle coenzyme", "Prosthetic group", "Allosteric effector", "Substrate"], "ans": 1, "why": "Prosthetic groups stay bound and take part in catalysis."}, {"q": "Which metal ion typically helps kinases bind ATP?", "opts": ["Fe²⁺", "Cu²⁺", "Mg²⁺", "Zn²⁺"], "ans": 2, "why": "Mg²⁺ binds ATP and is a cofactor for ATP-using enzymes."}, {"q": "All kinases belong to which enzyme class?", "opts": ["Hydrolases", "Transferases", "Ligases", "Isomerases"], "ans": 1, "why": "They transfer a phosphoryl group between two substrates."}, {"q": "An enzyme removes H2O from a substrate and forms a C=C double bond. Its class is:", "opts": ["Hydrolase", "Lyase", "Isomerase", "Oxidoreductase"], "ans": 1, "why": "Lyases add or remove groups across double bonds (here, water)."}, {"q": "Which enzyme class always needs ATP (or another energy source) as an extra substrate?", "opts": ["Isomerases", "Hydrolases", "Ligases", "Lyases"], "ans": 2, "why": "Forming a new covalent bond by condensation requires energy input."}, {"q": "Isomerase reactions in metabolism generally:", "opts": ["Have very large negative ΔG°′", "Have ΔG°′ near zero and go either way", "Need ATP", "Cut molecules with water"], "ans": 1, "why": "They only rearrange atoms, so they're energetically near-neutral."}, {"q": "Allosteric effectors bind:", "opts": ["Covalently to the active site", "Reversibly to a site separate from the active site", "Only to substrates", "Only after phosphorylation"], "ans": 1, "why": "Allosteric sites are distinct from the active site, and binding is reversible."}, {"q": "What distinguishes covalent modification from allosteric regulation?", "opts": ["Only covalent modification can activate", "Covalent modification needs another enzyme to add or remove the group", "Allosteric regulation is irreversible", "Covalent modification only inhibits"], "ans": 1, "why": "Allosteric regulation depends on effector concentration; covalent modification needs a modifying enzyme."}, {"q": "In threonine → isoleucine synthesis, isoleucine inhibits threonine dehydratase. This is:", "opts": ["Covalent modification", "Feedback inhibition", "Competitive inhibition at the active site", "Homotropic regulation"], "ans": 1, "why": "The end product allosterically inhibits the first, rate-limiting enzyme."}, {"q": "Which amino acids are phosphorylated to regulate enzymes?", "opts": ["Ser, Thr, Tyr", "Lys, Arg, His", "Asp, Glu, Cys", "Gly, Ala, Pro"], "ans": 0, "why": "Each has an R-group hydroxyl that receives the phosphate."}, {"q": "How are phosphates removed from regulated proteins?", "opts": ["Protein kinases running in reverse to make ATP", "Hydrolysis by protein phosphatases", "Spontaneous loss", "Ligases"], "ans": 1, "why": "Protein kinases are one-way; phosphatases hydrolyze the phosphate off."}, {"q": "Phosphorylation alters enzyme activity mainly by:", "opts": ["Changing ΔG°′", "Adding a bulky, doubly negative group that shifts conformation", "Breaking peptide bonds", "Changing the substrate"], "ans": 1, "why": "Regulation comes down to shape changes."}], "sa": [{"q": "Compare the two types of coenzymes, with an example of a shuttle coenzyme.", "a": "Shuttle coenzymes bind like substrates, pick up a group or electrons, then leave and carry it elsewhere (NAD⁺/NADH carries electrons; CoA/acetyl-CoA carries acetyl groups). Prosthetic groups stay permanently bound in the active site and take part in each catalytic cycle."}, {"q": "Explain feedback inhibition using the isoleucine example.", "a": "When isoleucine is low, none is bound to threonine dehydratase's allosteric site, so the enzyme is active and threonine flows to isoleucine. As isoleucine builds up, it binds the allosteric site and turns the first enzyme off, stopping the pathway. When isoleucine falls, it unbinds and synthesis restarts."}, {"q": "Why are protein kinases one-way, unlike metabolic kinases?", "a": "Moving a phosphate from a phospho-Ser/Thr/Tyr back to ADP to make ATP is not thermodynamically favorable. Protein kinases only phosphorylate using ATP, and a separate enzyme, protein phosphatase, removes the phosphate by hydrolysis."}]}, {"num": 4, "title": "Coupling Endergonic and Exergonic Reactions", "key": ["Catabolism breaks food down to CO₂ + H₂O for energy; anabolism builds. They meet at shared intermediates, with the citric acid cycle as the hub", "ATP = adenine + ribose + α, β, γ phosphates; its energy comes from charge repulsion (bond strain)", "ΔG°′ of ATP hydrolysis = −30.5 kJ/mol (cellular ΔG ≈ −50 to −65). Cells never actually hydrolyze ATP to do work", "Coupled reactions: ΔG°′ values ADD, Keq values MULTIPLY; reversing flips the sign of ΔG°′ and takes 1/Keq", "ATP-driven reactions always go through a high-energy intermediate (e.g. glutamyl phosphate in glutamine synthetase)"], "guide": "<h3>Catabolism vs. anabolism<\/h3><ul><li><b>Catabolism<\/b>: break down carbohydrates, fats, and proteins (ideally all the way to CO<sub>2<\/sub> + H<sub>2<\/sub>O) and capture the energy as <b>ATP and NADH<\/b>.<\/li><li><b>Anabolism<\/b>: biosynthesis, using those high-energy intermediates to build molecules.<\/li><li>Both converge on the same central intermediates (pyruvate, acetyl-CoA…). The <b>citric acid cycle is the central hub<\/b>; not everything enters through acetyl-CoA.<\/li><\/ul><h3>ATP<\/h3><p>ATP is the <b>immediate energy currency of all life<\/b>, from giraffes to geraniums to vent microbes.<\/p><ul><li>Nucleotide = <b>base<\/b> (adenine) + <b>5-C sugar<\/b> (ribose; DNA's deoxyribose lacks the 2′-OH) + ≥1 phosphate. Base + sugar alone = <b>nucleoside<\/b> (adenosine).<\/li><li>AMP, ADP, ATP have 1, 2, 3 phosphates: <b>α<\/b> (bonded to the sugar), <b>β<\/b>, and <b>γ<\/b> (the terminal one). Most ATP-powered reactions break off the γ-phosphate.<\/li><li>Energy storage: four negatively charged oxygens crammed together → huge <b>charge repulsion<\/b> straining the P–O bonds (high enthalpy), like a compressed spring.<\/li><li>Free phosphate at pH 7 = HPO<sub>4<\/sub><sup>2−<\/sup>, written <b>P<sub>i<\/sub><\/b> (inorganic phosphate). Fine to write Pi on exams.<\/li><\/ul><h3>Standard free energy of hydrolysis<\/h3><p>ATP + H<sub>2<\/sub>O → ADP + P<sub>i<\/sub>, <b>ΔG°′ = −30.5 kJ/mol<\/b>.<\/p><div class=\"box\"><b>Critical idea:<\/b> cells do <b>not<\/b> hydrolyze ATP to do work. Hydrolysis just releases heat. ΔG°′<sub>hydrolysis<\/sub> matters because it tells you how much energy is released when that phosphoryl group is removed <i>by any mechanism<\/i>, which is the energy available to power an endergonic process.<\/div><ul><li>In cells, [ATP] ≈ 5 mM and [ADP] is kept low, so the actual <b>ΔG ≈ −50 to −65 kJ/mol<\/b>: more energy than the standard value.<\/li><li>The reverse (ADP + P<sub>i<\/sub> → ATP) costs <b>+30.5 kJ/mol<\/b> and cannot happen on its own. Cells make ATP by <b>substrate-level<\/b> or <b>oxidative phosphorylation<\/b>, both coupled to exergonic processes.<\/li><li>Forward vs. reverse: same magnitude of ΔG°′ with opposite sign; Keq values are reciprocals.<\/li><\/ul><h3>Coupling: pushing the boulder uphill<\/h3><p>Example: glutamate + NH<sub>3<\/sub> → glutamine + H<sub>2<\/sub>O, <b>ΔG°′ = +24.5 kJ/mol<\/b> (not feasible alone).<\/p><table><tr><th>Process<\/th><th>ΔG°′ (kJ/mol)<\/th><th>K′eq<\/th><\/tr><tr><td>Endergonic: glutamate + NH<sub>3<\/sub> → glutamine + H<sub>2<\/sub>O<\/td><td>+24.5<\/td><td>5×10⁻⁵<\/td><\/tr><tr><td>Exergonic: ATP + H<sub>2<\/sub>O → ADP + P<sub>i<\/sub><\/td><td>−30.5<\/td><td>2.2×10⁵<\/td><\/tr><tr><td><b>Coupled<\/b>: glutamate + NH<sub>3<\/sub> + ATP → glutamine + ADP + P<sub>i<\/sub><\/td><td><b>−6.0<\/b><\/td><td><b>≈ 11<\/b><\/td><\/tr><\/table><div class=\"box\"><b>Rule:<\/b> ΔG°′ values <b>add<\/b>; K′eq values <b>multiply<\/b>.<\/div><h3>How the enzyme really couples them<\/h3><p><b>Glutamine synthetase<\/b> works in two steps through a <b>high-energy intermediate<\/b>:<\/p><ol><li>ATP's γ-phosphate is transferred onto the side-chain carboxylate of glutamate, giving the enzyme-bound <b>acyl phosphate<\/b> γ-glutamyl phosphate. ADP is released. The energy of breaking ATP is <b>retained<\/b> in this intermediate.<\/li><li>NH<sub>3<\/sub> attacks the carbonyl C, displacing P<sub>i<\/sub> to form the amide. The carboxylate oxygen leaves on P<sub>i<\/sub>, so no water is released.<\/li><\/ol><p>There is <b>always<\/b> a high-energy intermediate when ATP drives a reaction. The phosphate goes either onto a substrate-derived intermediate or onto an enzyme R group (e.g. a lysine). Exergonic partners aren't always ATP.<\/p><p><i>Acyl group<\/i> = a carbonyl carbon with something attached (R–C=O).<\/p>", "mc": [{"q": "Adenine + ribose without phosphate is called:", "opts": ["A nucleotide", "A nucleoside (adenosine)", "AMP", "A base"], "ans": 1, "why": "A nucleoside is base + sugar; a nucleotide has at least one phosphate."}, {"q": "The terminal phosphate of ATP is the:", "opts": ["α", "β", "γ", "δ"], "ans": 2, "why": "α is bonded to the ribose, then β, then γ at the end."}, {"q": "Why does ATP store so much energy?", "opts": ["Hydrogen bonding", "Charge repulsion among the phosphates strains the P–O bonds", "Aromatic resonance", "Its ribose ring"], "ans": 1, "why": "Negative charges crammed together create high enthalpy."}, {"q": "Why don't cells hydrolyze ATP to power reactions?", "opts": ["Hydrolysis is endergonic", "The energy would be lost as heat", "Water can't reach ATP", "Hydrolysis needs light"], "ans": 1, "why": "Hydrolysis isn't coupled to anything, so the energy just heats the cytoplasm."}, {"q": "The real meaning of ΔG°′ of hydrolysis is:", "opts": ["Only the energy from reacting with water", "The energy released by removing that phosphoryl group by any mechanism", "The activation energy", "The binding energy"], "ans": 1, "why": "That's the energy available to power an endergonic process."}, {"q": "Approximate actual ΔG of ATP breakdown under cellular conditions:", "opts": ["−7 kJ/mol", "−30.5 kJ/mol", "−50 to −65 kJ/mol", "+30.5 kJ/mol"], "ans": 2, "why": "High ATP and low ADP push ΔG well below the standard value."}, {"q": "Reactions with ΔG°′ of +24.5 and −30.5 kJ/mol are coupled. The coupled ΔG°′ is:", "opts": ["+55", "−55", "−6.0", "+6.0"], "ans": 2, "why": "Free energies add: 24.5 + (−30.5) = −6.0."}, {"q": "Keq(endergonic) = 5×10⁻⁵ and Keq(exergonic) = 2.2×10⁵. Coupled Keq ≈", "opts": ["2.2×10⁵", "11", "5×10⁻⁵", "4.4×10⁹"], "ans": 1, "why": "Equilibrium constants multiply."}, {"q": "A reaction's K′eq = 270. The K′eq for the reverse reaction is:", "opts": ["−270", "270", "0.0037", "2.70"], "ans": 2, "why": "Reverse Keq = 1/Keq."}, {"q": "The enzyme-bound intermediate in glutamine synthetase is:", "opts": ["Glutamyl-CoA", "γ-Glutamyl phosphate (an acyl phosphate)", "Glutamine-AMP", "Phospholysine"], "ans": 1, "why": "ATP's γ-phosphate goes onto glutamate's side-chain carboxylate."}, {"q": "In the glutamine synthetase reaction, the carboxylate oxygen of glutamate ends up:", "opts": ["In water", "In inorganic phosphate", "In ADP", "In glutamine"], "ans": 1, "why": "That's why no water is drawn in the coupled reaction."}, {"q": "Which statement about ATP-coupled enzyme reactions is always true?", "opts": ["ATP is hydrolyzed", "A high-energy intermediate forms", "Lysine is phosphorylated", "ΔG°′ becomes positive"], "ans": 1, "why": "The energy from ATP is passed on through a high-energy intermediate, on the substrate or an enzyme R group."}], "sa": [{"q": "Write the endergonic, exergonic, and coupled reactions for glutamine synthesis and calculate ΔG°′ and K′eq for the coupled reaction.", "a": "Endergonic: glutamate + NH3 → glutamine + H2O (+24.5 kJ/mol, K ≈ 5×10⁻⁵). Exergonic: ATP + H2O → ADP + Pi (−30.5, K ≈ 2.2×10⁵). Coupled: glutamate + NH3 + ATP → glutamine + ADP + Pi. ΔG°′ = −6.0 kJ/mol (sum); K′eq ≈ 11 (product)."}, {"q": "Explain mechanistically how glutamine synthetase uses ATP energy without hydrolyzing ATP.", "a": "Step 1: the enzyme transfers ATP's γ-phosphate to glutamate's side-chain carboxylate, forming enzyme-bound γ-glutamyl phosphate (a high-energy acyl phosphate) and releasing ADP; the energy from breaking ATP is stored in that intermediate. Step 2: NH3 attacks the carbonyl carbon and displaces Pi, forming the amide of glutamine. Breaking the acyl phosphate pays for the amide formation."}, {"q": "Why is ADP + Pi → ATP impossible on its own, and how do cells make ATP?", "a": "It has ΔG°′ = +30.5 kJ/mol, too endergonic for any achievable ADP and Pi concentrations to push it forward. Cells couple it to exergonic processes: substrate-level phosphorylation (a high-energy substrate's phosphoryl group goes directly to ADP) or oxidative phosphorylation (driven by electron transport and the proton gradient)."}]}, {"num": 5, "title": "Biological Oxidation-Reduction Reactions", "key": ["Animals get all their energy by oxidizing carbon (stripping electrons, mostly as H atoms)", "Glucose → 6 CO₂ + 6 H₂O: ΔG°′ = −2840 kJ/mol whether burned or oxidized biologically", "Oxidoreductases: oxidases (O₂ is the acceptor) vs. dehydrogenases (remove a hydride or 2 H atoms, to NAD⁺/FAD)", "NAD⁺ takes a hydride (+ an extra H⁺ released) and is a mobile substrate; NADPH is for biosynthesis; FAD takes 2 H atoms and is a prosthetic group", "ΔE°′ = E°′(acceptor) − E°′(donor); positive ΔE°′ ⇔ negative ΔG°′"], "guide": "<h3>Oxidation = energy<\/h3><p>Unless you photosynthesize, <b>all your energy comes from oxidizing carbon<\/b>, pulling electrons out of carbon atoms. Combustion of glucose: C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub> + 6 O<sub>2<\/sub> → 6 CO<sub>2<\/sub> + 6 H<sub>2<\/sub>O, <b>ΔG°′ = −2840 kJ/mol<\/b> (compare ATP's −30.5). Cells do it stepwise and capture the energy as ATP, but the start and end states are the same, so <b>ΔG°′ is identical<\/b>. Some energy is lost as heat. The electrons end up reducing O<sub>2<\/sub> to H<sub>2<\/sub>O. Biologically about <b>10–12 H<sub>2<\/sub>O<\/b> are produced (depending on bookkeeping), not 6.<\/p><p><b>Oxidation state<\/b>: the more reduced a carbon (more C–H bonds), the more electrons it can donate and the more energy it yields. The most oxidized carbon (CO<sub>2<\/sub>) is \"spent.\" You won't calculate oxidation states, but you should be able to rank them: alkane C &gt; alcohol &gt; aldehyde/ketone &gt; carboxylic acid &gt; CO<sub>2<\/sub> in energy content.<\/p><h3>Oxidoreductases<\/h3><table><tr><th>Type<\/th><th>Electron acceptor<\/th><th>Example<\/th><\/tr><tr><td><b>Oxidase<\/b><\/td><td>O<sub>2<\/sub> (often reduced to H<sub>2<\/sub>O)<\/td><td>Cytochrome c oxidase (complex 4 of the ETC): cyt c → O<sub>2<\/sub><\/td><\/tr><tr><td><b>Dehydrogenase<\/b> (central in this course)<\/td><td>Coenzyme (NAD⁺, NADP⁺, FAD)<\/td><td>Lactate dehydrogenase<\/td><\/tr><\/table><p>Dehydrogenases remove electrons as a <b>hydride ion (H⁻ = 2e⁻ + H⁺)<\/b> or a <b>pair of H atoms<\/b>. Biological redox nearly always moves <b>electron pairs<\/b>. (Dehydrogenase ≠ dehydratase, which removes water.)<\/p><div class=\"box\"><b>Lactate dehydrogenase<\/b>: lactate + NAD⁺ ⇌ pyruvate + NADH + H⁺. The C–H hydrogen leaves as hydride to NAD⁺; the O–H hydrogen leaves as H⁺ to solution, forming the C=O. Reversible, driven by concentrations.<\/div><h3>NAD⁺ / NADH and NADP⁺ / NADPH<\/h3><ul><li>NAD⁺ + 2e⁻ + 2H⁺ ⇌ NADH + H⁺. NAD⁺ really takes a <b>hydride<\/b>, and the reaction often releases an extra H⁺, hence the odd stoichiometry. (Not always.)<\/li><li>Act as <b>substrates<\/b>: reduced at one enzyme, diffuse away, oxidized at another. They are electron <b>shuttles<\/b>.<\/li><li><b>NADH<\/b> is the general carrier, used mainly in <b>catabolism<\/b>. <b>NADPH<\/b> (one extra phosphate) supplies electrons for <b>biosynthesis<\/b>.<\/li><li>Cells keep <b>pools of both oxidized and reduced forms<\/b>, with separate pools in the cytoplasm and mitochondria.<\/li><li>Structure: <b>nicotinamide<\/b> nucleotide + <b>AMP<\/b> (a dinucleotide). The hydride goes onto the nicotinamide ring carbon.<\/li><\/ul><h3>FAD / FADH<sub>2<\/sub><\/h3><ul><li>FAD + 2e⁻ + 2H⁺ → FADH<sub>2<\/sub>: picks up <b>two H atoms<\/b> (one on each of two ring nitrogens of the isoalloxazine ring), not a hydride.<\/li><li>A <b>prosthetic group<\/b>: permanently bound, so it is a <b>conduit<\/b>. Electrons pass through FAD into something else (first seen in the PDH complex).<\/li><li>Structure: <b>flavin<\/b> (isoalloxazine 3-ring base + open-chain 5-C sugar + phosphate) + <b>AMP<\/b>. Proteins that use it are <b>flavoproteins<\/b>.<\/li><\/ul><p>You need to <b>recognize<\/b> ATP, NAD, and FAD structures side by side (not draw them). AMP is the base of many coenzymes.<\/p><p><i>Vitamins (not tested)<\/i>: B3 niacin → the nicotinamide of NAD; B2 riboflavin → the flavin of FAD. B vitamins generally make coenzymes.<\/p><h3>Reduction potential<\/h3><p><b>E°′<\/b> (volts) = a molecule's pull on electrons. The higher it is, the more it wants to be reduced.<\/p><div class=\"box\"><b>ΔE°′ = E°′(acceptor) − E°′(donor)<\/b>. Positive ΔE°′ → electrons flow downhill → <b>negative ΔG°′<\/b> (favorable). Redox ΔG°′ decides whether a reaction is reversible (LDH) or effectively one-way. More detail comes with the ETC.<\/div>", "mc": [{"q": "ΔG°′ for complete oxidation of glucose by cells compared with combustion:", "opts": ["Much smaller", "The same, −2840 kJ/mol", "Larger", "Positive"], "ans": 1, "why": "Same starting and ending states give the same ΔG°′, whatever the path."}, {"q": "An oxidase uses which electron acceptor?", "opts": ["NAD⁺", "FAD", "O₂", "Cytochrome c"], "ans": 2, "why": "Oxidases transfer electrons to molecular oxygen."}, {"q": "Cytochrome c oxidase is an example of:", "opts": ["A dehydrogenase", "An oxidase", "A hydrolase", "A kinase"], "ans": 1, "why": "It moves electrons from cyt c to O2, forming water."}, {"q": "A hydride ion is:", "opts": ["One electron + one proton", "Two electrons + one proton", "Two protons", "One electron"], "ans": 1, "why": "H⁻ = 2e⁻ + H⁺."}, {"q": "In lactate dehydrogenase (lactate → pyruvate), the C–H hydrogen:", "opts": ["Leaves as H⁺", "Is transferred as hydride to NAD⁺", "Goes to FAD", "Forms water"], "ans": 1, "why": "The O–H hydrogen is the one released as H⁺."}, {"q": "Why is NAD⁺ reduction written as NAD⁺ + 2e⁻ + 2H⁺ → NADH + H⁺?", "opts": ["NAD⁺ takes two protons", "A hydride is added and an extra H⁺ is often released from the substrate", "It's a typo", "FAD is involved"], "ans": 1, "why": "Stoichiometrically a hydride goes on, and the substrate often loses an extra proton."}, {"q": "NADPH is mainly used for:", "opts": ["Catabolism", "Biosynthesis (anabolism)", "Making ATP directly", "Carrying acetyl groups"], "ans": 1, "why": "NADPH supplies reducing power for building molecules."}, {"q": "How does FAD differ from NAD⁺?", "opts": ["FAD is a mobile substrate", "FAD takes two H atoms and is a permanently bound prosthetic group", "FAD takes a hydride", "FAD has no AMP"], "ans": 1, "why": "FAD is reduced to FADH2 by 2 H atoms on ring nitrogens and stays in the active site."}, {"q": "Which part is common to NAD, FAD, and many coenzymes?", "opts": ["Nicotinamide", "AMP (adenosine monophosphate)", "Riboflavin", "Isoalloxazine ring"], "ans": 1, "why": "AMP is the base of many coenzymes."}, {"q": "Which carbon has the most energy to yield on oxidation?", "opts": ["CO2 carbon", "Carboxylic acid carbon", "Aldehyde carbon", "Alkane (CH2) carbon"], "ans": 3, "why": "The most reduced carbon has the most electrons to donate."}, {"q": "ΔE°′ for a redox reaction is defined as:", "opts": ["E°′(donor) − E°′(acceptor)", "E°′(acceptor) − E°′(donor)", "E°′(acceptor) + E°′(donor)", "−nFΔG"], "ans": 1, "why": "A positive ΔE°′ means the acceptor pulls harder, which is favorable."}, {"q": "A redox reaction with positive ΔE°′ has:", "opts": ["Positive ΔG°′", "Negative ΔG°′", "ΔG°′ = 0", "Keq < 1"], "ans": 1, "why": "Electrons flowing to a higher-E°′ acceptor release free energy."}], "sa": [{"q": "Compare NAD⁺ and FAD as electron carriers (what they accept, how they're bound, where the electrons go).", "a": "NAD⁺ accepts a hydride (2e⁻ + H⁺), often with an extra H⁺ released, and is a mobile substrate that diffuses between enzymes and compartments as a shuttle. FAD accepts two H atoms (on two ring N's) and is a prosthetic group permanently bound to its enzyme, so electrons pass through it to another acceptor."}, {"q": "Draw or describe the lactate dehydrogenase reaction, identifying the hydride and the proton.", "a": "Lactate (CH3–CH(OH)–COO⁻) + NAD⁺ ⇌ pyruvate (CH3–CO–COO⁻) + NADH + H⁺. The H on C2 goes as hydride to NAD⁺'s nicotinamide ring; the hydroxyl H leaves to solution as H⁺; the O–H bond electrons form the C=O."}, {"q": "What determines whether electrons flow from molecule A to molecule B?", "a": "Reduction potentials. Electrons flow from the lower-E°′ donor to the higher-E°′ acceptor. ΔE°′ = E°′(acceptor) − E°′(donor); a positive ΔE°′ gives a negative ΔG°′ (favorable). Concentrations can still push reactions with small ΔG°′ either way."}]}, {"num": 6, "title": "Glycolysis", "key": ["Glucose (6C) → 2 pyruvate (3C) in the cytoplasm, no O₂ needed; net 2 ATP + 2 NADH", "Know every structure, intermediate name, and enzyme (not the mechanisms or ΔG°′ values)", "Irreversible: hexokinase (1), PFK-1 (3), pyruvate kinase (10). The other 7 are reversible", "PFK-1 is the regulated gateway, not hexokinase, because G6P has other fates", "Step 6 (G3P dehydrogenase) is THE key reaction: oxidation energy is stored in the acyl phosphate of 1,3-BPG"], "guide": "<h3>Big picture<\/h3><ul><li>The initial oxidation of glucose. <b>No O<sub>2<\/sub> required<\/b>. It evolved before atmospheric O<sub>2<\/sub>, is nearly universal, and is the same in microbes, plants, and animals.<\/li><li>Occurs in the <b>cytoplasm<\/b>. (Respiration is in the mitochondria.)<\/li><li>Glucose (6C) → <b>2 pyruvate<\/b> (3C). Payoff: <b>net 2 ATP + 2 NADH<\/b>.<\/li><li>10 reactions, <b>7 reversible<\/b>. Those 7 run backwards in gluconeogenesis.<\/li><li>You must know <b>all structures, names, and enzymes<\/b>. Mechanisms and ΔG°′ values are not tested. The names tell you the structures and vice versa.<\/li><\/ul><h3>Carbohydrate chemistry<\/h3><ul><li>Glycerol (3 –OH) → glycer<b>aldehyde<\/b> (C1 = aldehyde) → glycer<b>ate<\/b> (C1 = carboxylate). Number from the <b>carbonyl end<\/b>.<\/li><li>The carbonyl C is the <b>anomeric carbon<\/b> (reactive, partial +).<\/li><li><b>Glucose<\/b> = aldohexose (C1 aldehyde). The C5 –OH attacks C1 to form a <b>hemiacetal ring<\/b>. α = C1 –OH down (the form enzymes use); β = up. About 10% is linear in solution.<\/li><li><b>Fructose<\/b> = ketohexose (C2 ketone). The C5 –OH attacks C2 to form a 5-membered ring; the α form is used.<\/li><li>Drawing glucose: ring O at the top-right corner, C6 sticking up, –OH groups down on C1, C2, C4 and up on C3.<\/li><\/ul><h3>Preparatory phase (spend 2 ATP)<\/h3><table><tr><th>#<\/th><th>Reaction<\/th><th>Enzyme<\/th><th>Notes<\/th><\/tr><tr><td>1<\/td><td>Glucose + ATP → <b>glucose 6-phosphate<\/b> + ADP<\/td><td><b>Hexokinase<\/b><\/td><td><b>Irreversible<\/b> (−16.7). Traps glucose in the cell (GLUT transporters use facilitated diffusion) and primes it. G6P has several possible fates.<\/td><\/tr><tr><td>2<\/td><td>G6P ⇌ <b>fructose 6-phosphate<\/b><\/td><td>Phosphohexose isomerase<\/td><td>Isomerization (+1.7). Moves the ring bond to C2.<\/td><\/tr><tr><td>3<\/td><td>F6P + ATP → <b>fructose 1,6-bisphosphate<\/b> + ADP<\/td><td><b>Phosphofructokinase-1 (PFK-1)<\/b><\/td><td><b>Irreversible<\/b> (−14.2). <b>Highly regulated (allosteric): the gateway to glycolysis.<\/b><\/td><\/tr><tr><td>4<\/td><td>F1,6BP ⇌ <b>DHAP<\/b> (C1–3) + <b>glyceraldehyde 3-phosphate<\/b> (C4–6)<\/td><td><b>Aldolase<\/b><\/td><td>Reverse aldol condensation. ΔG°′ = +23.8, but splitting 1 → 2 at sub-molar concentrations makes Q tiny, which pulls it forward.<\/td><\/tr><tr><td>5<\/td><td>DHAP ⇌ <b>G3P<\/b><\/td><td>Triose phosphate isomerase<\/td><td>Ketone → aldehyde. Now there are <b>2 G3P per glucose<\/b>, so everything from here is ×2.<\/td><\/tr><\/table><div class=\"box\"><b>Why regulate PFK-1, not hexokinase?<\/b> Every cell phosphorylates glucose regardless (to trap it), and G6P feeds several pathways. Step 2 is energetically neutral. PFK-1 is where the cell spends its 2nd ATP and commits the carbon to glycolysis.<\/div><p><b>Hexokinase vs. glucokinase<\/b> (isozymes catalyze the same reaction): hexokinase has a low K<sub>m<\/sub> and grabs glucose even at low concentrations. <b>Glucokinase<\/b> (liver, pancreatic β-cells) has a higher K<sub>m<\/sub>, so it responds across a broad range of blood glucose levels.<\/p><h3>Payoff phase (×2 per glucose)<\/h3><table><tr><th>#<\/th><th>Reaction<\/th><th>Enzyme<\/th><th>Notes<\/th><\/tr><tr><td>6<\/td><td>G3P + NAD⁺ + <b>P<sub>i<\/sub><\/b> ⇌ <b>1,3-bisphosphoglycerate<\/b> + NADH + H⁺<\/td><td><b>Glyceraldehyde 3-phosphate dehydrogenase<\/b><\/td><td><b>The most important reaction.<\/b> Aldehyde H → hydride to NAD⁺ (−43 kJ/mol, exergonic), coupled to adding free P<sub>i<\/sub> to C1 (endergonic). Overall +6.3, reversible. The oxidation energy is kept in a <b>high-energy acyl phosphate<\/b>.<\/td><\/tr><tr><td>7<\/td><td>1,3-BPG + ADP ⇌ <b>3-phosphoglycerate<\/b> + ATP<\/td><td><b>Phosphoglycerate kinase<\/b><\/td><td><b>Substrate-level phosphorylation #1<\/b> (−18.8; reversible). The carboxylate keeps the O from P<sub>i<\/sub>.<\/td><\/tr><tr><td>8<\/td><td>3-PG ⇌ <b>2-phosphoglycerate<\/b><\/td><td>Phosphoglycerate <b>mutase<\/b><\/td><td>Isomerase (+4.4). Moves the phosphate from C3 to C2.<\/td><\/tr><tr><td>9<\/td><td>2-PG ⇌ <b>phosphoenolpyruvate (PEP)<\/b> + H<sub>2<\/sub>O<\/td><td><b>Enolase<\/b><\/td><td><b>Lyase<\/b>: removes water and forms C=C (+7.5). Redistributes energy: the phosphate's ΔG°′<sub>hydrolysis<\/sub> goes from −17.6 (not enough for ATP) to <b>−61.9 kJ/mol<\/b>.<\/td><\/tr><tr><td>10<\/td><td>PEP + ADP → <b>pyruvate<\/b> + ATP<\/td><td><b>Pyruvate kinase<\/b><\/td><td><b>Irreversible<\/b> (−31.4). <b>Substrate-level phosphorylation #2.<\/b> The enol tautomerizes to the much more stable keto form; the phosphate had locked it as an enol.<\/td><\/tr><\/table><h3>Substrate-level phosphorylation<\/h3><p>ATP made by transferring a phosphate from a high-energy substrate directly to ADP. It is one of the <b>only three ways to make ATP<\/b>: (1) substrate-level, (2) <b>oxidative phosphorylation<\/b> (ETC + ATP synthase, needs O<sub>2<\/sub>), (3) photophosphorylation (not covered).<\/p><div class=\"box\"><b>Big question:<\/b> Step 7's ATP comes from breaking the acyl phosphate. But it cost about +49 kJ/mol to attach P<sub>i<\/sub> to C1 in step 6. Where did <i>that<\/i> energy come from? <b>From oxidizing the aldehyde (hydride transferred to NAD⁺).<\/b> The original source of the energy is the <b>oxidation of carbon<\/b>.<\/div><h3>Balance sheet (per glucose)<\/h3><table><tr><th>Step<\/th><th>ATP<\/th><th>NADH<\/th><\/tr><tr><td>1 hexokinase<\/td><td>−1<\/td><td><\/td><\/tr><tr><td>3 PFK-1<\/td><td>−1<\/td><td><\/td><\/tr><tr><td>6 G3P DH<\/td><td><\/td><td>+2<\/td><\/tr><tr><td>7 PGK<\/td><td>+2<\/td><td><\/td><\/tr><tr><td>10 pyruvate kinase<\/td><td>+2<\/td><td><\/td><\/tr><tr><td><b>Net<\/b><\/td><td><b>+2<\/b><\/td><td><b>+2<\/b><\/td><\/tr><\/table><p>Energy released by glycolysis's oxidation ≈ <b>−146 kJ/mol<\/b>, of which about +61 goes to make 2 ATP. That's only a small fraction of the −2840 available from complete oxidation; most of it still lies ahead in respiration.<\/p>", "mc": [{"q": "Where does glycolysis occur in a eukaryotic cell?", "opts": ["Mitochondrial matrix", "Cytoplasm", "Inner mitochondrial membrane", "Nucleus"], "ans": 1, "why": "Glycolysis and fermentation are cytoplasmic."}, {"q": "Which three glycolytic enzymes catalyze irreversible steps?", "opts": ["Hexokinase, PFK-1, pyruvate kinase", "Aldolase, enolase, PGK", "Hexokinase, aldolase, pyruvate kinase", "PFK-1, G3P dehydrogenase, enolase"], "ans": 0, "why": "Steps 1, 3, and 10 are irreversible; gluconeogenesis must bypass them."}, {"q": "Why is PFK-1, not hexokinase, the main regulated entry point of glycolysis?", "opts": ["Hexokinase is irreversible", "G6P has several fates, and PFK-1 spends the 2nd ATP to commit carbon to glycolysis", "PFK-1 makes NADH", "Hexokinase is only in liver"], "ans": 1, "why": "Phosphorylating glucose traps and primes it for any pathway; PFK-1 is the commitment step."}, {"q": "Glucokinase differs from hexokinase in having:", "opts": ["A lower Km for glucose", "A higher Km for glucose", "A different product", "No ATP requirement"], "ans": 1, "why": "A higher Km lets liver and β-cells respond over a broad glucose range."}, {"q": "Aldolase splits fructose 1,6-bisphosphate into:", "opts": ["2 pyruvate", "DHAP and glyceraldehyde 3-phosphate", "2 G3P directly", "G6P and F6P"], "ans": 1, "why": "C1–3 → DHAP; C4–6 → G3P."}, {"q": "Why does aldolase run forward despite ΔG°′ ≈ +24 kJ/mol?", "opts": ["It is coupled to ATP", "Splitting one molecule into two at sub-molar concentrations makes Q very small", "It's irreversible", "Pi pulls it"], "ans": 1, "why": "Multiplying two small concentrations in the numerator makes RT ln Q strongly negative."}, {"q": "Which reaction is the key oxidation step of glycolysis?", "opts": ["Hexokinase", "Glyceraldehyde 3-phosphate dehydrogenase", "Enolase", "Phosphoglycerate mutase"], "ans": 1, "why": "It removes a hydride to NAD⁺ and stores the energy in an acyl phosphate."}, {"q": "In step 6, the phosphate added to C1 comes from:", "opts": ["ATP", "Free inorganic phosphate (Pi)", "PEP", "Glucose 6-phosphate"], "ans": 1, "why": "Free Pi from solution is added, powered by the oxidation."}, {"q": "1,3-bisphosphoglycerate contains a high-energy:", "opts": ["Thioester", "Acyl phosphate on C1", "Enol phosphate", "Phosphoanhydride"], "ans": 1, "why": "The phosphate on the C1 carbonyl is an acyl phosphate."}, {"q": "Enolase belongs to which enzyme class?", "opts": ["Isomerase", "Lyase", "Kinase", "Dehydrogenase"], "ans": 1, "why": "It removes H2O to form a double bond."}, {"q": "Why does PEP have such a large ΔG°′ of hydrolysis (−61.9 kJ/mol)?", "opts": ["It has two phosphates", "Removing the phosphate lets the enol tautomerize to the much more stable keto pyruvate", "It's a thioester", "Mg²⁺ binding"], "ans": 1, "why": "The phosphate locks the high-energy enol form."}, {"q": "Net yield of glycolysis per glucose:", "opts": ["4 ATP, 2 NADH", "2 ATP, 2 NADH", "2 ATP, 4 NADH", "36 ATP"], "ans": 1, "why": "4 ATP made − 2 spent = 2 net; 2 NADH from step 6 (×2)."}, {"q": "Which is NOT one of the three ways cells make ATP?", "opts": ["Substrate-level phosphorylation", "Oxidative phosphorylation", "Photophosphorylation", "ATP hydrolysis"], "ans": 3, "why": "Hydrolysis breaks ATP; it doesn't make it."}, {"q": "Phosphoglycerate mutase converts:", "opts": ["3-PG → 2-PG", "2-PG → PEP", "1,3-BPG → 3-PG", "PEP → pyruvate"], "ans": 0, "why": "A mutase (an isomerase) moves the phosphate from C3 to C2."}], "sa": [{"q": "Write steps 6 and 7 of glycolysis with enzymes, and explain the original source of energy for the ATP made in step 7.", "a": "Step 6: G3P + NAD⁺ + Pi ⇌ 1,3-BPG + NADH + H⁺ (glyceraldehyde 3-phosphate dehydrogenase). Step 7: 1,3-BPG + ADP ⇌ 3-phosphoglycerate + ATP (phosphoglycerate kinase). The immediate source is breaking the high-energy acyl phosphate on C1. Attaching that Pi was endergonic, and it was powered by the exergonic oxidation of the aldehyde (hydride to NAD⁺). So the original source is the oxidation of glucose's carbon."}, {"q": "Explain why phosphorylating glucose is the first step in every cell, and why hexokinase isn't the regulated step.", "a": "GLUT transporters use facilitated diffusion, so free glucose could leave. Glucose 6-phosphate can't use the transporter, so it's trapped, and the phosphate primes it for metabolism. G6P can enter several pathways (glycolysis, glycogen synthesis, the pentose phosphate pathway), so hexokinase must always run. Regulation happens at PFK-1, where the 2nd ATP is spent and the carbon is committed to glycolysis."}, {"q": "Tally the ATP and NADH used and made in glycolysis per glucose.", "a": "Hexokinase −1 ATP, PFK-1 −1 ATP. Then ×2 for each triose: G3P dehydrogenase +2 NADH, phosphoglycerate kinase +2 ATP, pyruvate kinase +2 ATP. Net: 2 ATP and 2 NADH per glucose."}]}, {"num": 7, "title": "Fermentation and Ethanol Metabolism", "key": ["Pyruvate has three main catabolic fates: respiration (needs O₂, ~30–32 ATP), lactate, or ethanol", "The point of fermentation is to regenerate NAD⁺ so glycolysis keeps going. It makes no extra ATP", "Lactate dehydrogenase is reversible: the liver converts lactate back to pyruvate (then glucose)", "Ethanol fermentation: pyruvate decarboxylase (TPP, irreversible, releases CO₂) → acetaldehyde → alcohol DH → ethanol", "Ethanol catabolism: ethanol → acetaldehyde → acetate (2 NADH) → acetyl-CoA. Methanol → formaldehyde, which is why IV ethanol is the treatment"], "guide": "<h3>Fates of pyruvate<\/h3><p>Glycolysis: glucose → 2 pyruvate + 2 ATP, and <b>2 NAD⁺ → 2 NADH<\/b>. That last point is the key to fermentation. Pyruvate is a central intermediate (it can also feed biosynthesis, e.g. amino acids).<\/p><table><tr><th>Fate<\/th><th>O<sub>2<\/sub>?<\/th><th>Where / who<\/th><th>How NAD⁺ is regenerated<\/th><\/tr><tr><td><b>Cellular respiration<\/b><\/td><td>Required (O<sub>2<\/sub> is the final e⁻ acceptor)<\/td><td>Mitochondria; plants, animals, many microbes<\/td><td>NADH → ETC<\/td><\/tr><tr><td><b>Lactate (lactate fermentation)<\/b><\/td><td>No<\/td><td>All plants and animals, many microbes<\/td><td>Lactate dehydrogenase<\/td><\/tr><tr><td><b>Ethanol fermentation<\/b><\/td><td>No<\/td><td>Some microbes (yeast) and invertebrates. <b>Not mammals or plants.<\/b><\/td><td>Alcohol dehydrogenase<\/td><\/tr><\/table><p>Respiration gives <b>~30–32 ATP/glucose<\/b>, which made large animals possible.<\/p><h3>Lactate in exercising muscle<\/h3><ul><li>Warm-up: there's enough O<sub>2<\/sub>, so glycolysis + respiration meet the ATP demand.<\/li><li>Sprint: O<sub>2<\/sub> delivery can't keep up, so the muscle runs <b>extra glycolysis<\/b> (no O<sub>2<\/sub> needed) for extra ATP.<\/li><li>The catch: extra glycolysis turns NAD⁺ into NADH with no ETC to reoxidize it. The cell's NAD⁺ pool is finite; once it's all NADH, G3P dehydrogenase stops and glycolysis stops.<\/li><li>The fix: <b>pyruvate + NADH + H⁺ ⇌ lactate + NAD⁺<\/b> (<b>lactate dehydrogenase<\/b>; hydride onto the carbonyl C). 2 pyruvate → 2 lactate recycles exactly the 2 NADH from glycolysis.<\/li><li>Lactate goes into the blood → <b>liver<\/b> → back to pyruvate by LDH in reverse (reversible, near-neutral) → <b>gluconeogenesis<\/b> → glucose. Otherwise lactate would be a dead end.<\/li><li>Lactobacillus bacteria make lactate in yogurt, cheese, and kimchi (the tang). Many microbes simply secrete lactate.<\/li><\/ul><p>Some microbes ferment <i>even with O<sub>2<\/sub> present<\/i> when glucose is abundant, because respiration's redox chemistry carries risks.<\/p><h3>Ethanol fermentation (two steps)<\/h3><ol><li><b>Pyruvate → acetaldehyde + CO<sub>2<\/sub><\/b>: <b>pyruvate decarboxylase<\/b>, <b>irreversible<\/b>. Uses the prosthetic group <b>thiamine pyrophosphate (TPP)<\/b>; remember this for later (PDH and α-KG DH also use TPP).<\/li><li><b>Acetaldehyde + NADH + H⁺ → ethanol + NAD⁺<\/b>: <b>alcohol dehydrogenase<\/b> (reversible). Every fermentation has a dehydrogenase step, since that's the point.<\/li><\/ol><p>Ethanol fermentation is irreversible because a carbon leaves as CO<sub>2<\/sub>, and refixing CO<sub>2<\/sub> is too costly outside photosynthesis. Many other microbial fermentation types exist.<\/p><ul><li><b>Goldfish and carp<\/b> survive low O<sub>2<\/sub> (swamps, frozen ponds) by making lactate, then decarboxylating it to ethanol with a variant decarboxylase. Lactate is charged and trapped, but ethanol diffuses out through the gills.<\/li><li><b>Saccharomyces cerevisiae<\/b> (brewer's yeast) ferments even in air, flooding rotting fruit with ethanol to kill competitors, then later catabolizes the ethanol itself.<\/li><li>Beer and wine: CO<sub>2<\/sub> from pyruvate decarboxylase gives carbonation. Spirits are distilled: water and ethanol boil together as an <b>azeotrope<\/b>, giving an ethanol-enriched distillate.<\/li><\/ul><h3>Ethanol catabolism in animals (liver)<\/h3><ol><li>Ethanol + NAD⁺ → <b>acetaldehyde<\/b> + NADH (<b>alcohol dehydrogenase<\/b>, running the other way)<\/li><li>Acetaldehyde + NAD⁺ + H<sub>2<\/sub>O → <b>acetate<\/b> + NADH (<b>acetaldehyde dehydrogenase<\/b>)<\/li><li>Acetate + CoA + ATP → <b>acetyl-CoA<\/b> + AMP + PP<sub>i<\/sub> (acetate thiokinase; just know acetate → acetyl-CoA) → citric acid cycle<\/li><\/ol><p>Those 2 NADH are the \"calories\" in alcohol. <b>Population genetics<\/b>: about 80% of people of East Asian descent carry a faster ADH allele and about 50% a slower ALDH allele, giving 5–10× more acetaldehyde: less intoxication, more headache and <b>alcohol flush<\/b>.<\/p><div class=\"box\"><b>Methanol poisoning<\/b>: ADH has broad specificity (ethanol, methanol, isopropanol). Methanol → <b>formaldehyde<\/b> (cross-links proteins) → <b>formate<\/b>. Both are very toxic and especially damage the eyes (blindness). <b>Treatment: IV ethanol<\/b>, which outcompetes methanol for ADH's active site (competitive inhibition) long enough for the kidneys and lungs to clear the methanol.<\/div>", "mc": [{"q": "What is the main purpose of fermentation pathways?", "opts": ["Make extra ATP", "Regenerate NAD⁺ so glycolysis can continue", "Produce CO2", "Make glucose"], "ans": 1, "why": "Without NAD⁺, G3P dehydrogenase stops and glycolysis halts."}, {"q": "Why does extra glycolysis in an oxygen-starved muscle need lactate dehydrogenase?", "opts": ["To make ATP", "No ETC is available to oxidize the extra NADH", "To remove CO2", "To make pyruvate"], "ans": 1, "why": "Without O2, NADH can't give its electrons to the ETC."}, {"q": "Lactate made in muscle is mainly:", "opts": ["Excreted in urine", "Converted back to pyruvate in the liver", "Converted to ethanol", "Stored as fat"], "ans": 1, "why": "The liver reverses LDH and makes glucose by gluconeogenesis."}, {"q": "Which reaction is irreversible?", "opts": ["Pyruvate → lactate", "Pyruvate → acetaldehyde + CO2", "Acetaldehyde → ethanol", "Lactate → pyruvate"], "ans": 1, "why": "Losing CO2 can't be reversed without fixing CO2, which is too expensive."}, {"q": "Pyruvate decarboxylase uses which prosthetic group?", "opts": ["FAD", "Biotin", "Thiamine pyrophosphate (TPP)", "Lipoamide"], "ans": 2, "why": "Note TPP; it reappears in PDH and α-KG dehydrogenase."}, {"q": "Which organisms carry out ethanol fermentation?", "opts": ["Mammals", "Plants", "Some microbes like yeast, and some invertebrates", "All animals"], "ans": 2, "why": "Mammals and plants don't ferment to ethanol."}, {"q": "How do goldfish and carp excrete fermentation products in low O2?", "opts": ["As lactate through the gills", "They convert lactate to ethanol and release it through the gills", "As CO2 only", "As acetate"], "ans": 1, "why": "Charged lactate is trapped; ethanol diffuses out."}, {"q": "The carbonation of beer comes from:", "opts": ["Alcohol dehydrogenase", "Pyruvate decarboxylase releasing CO2", "Added CO2 only", "Lactate dehydrogenase"], "ans": 1, "why": "The decarboxylation step releases CO2."}, {"q": "In the liver, ethanol is oxidized in order to:", "opts": ["Acetone → acetate", "Acetaldehyde → acetate → acetyl-CoA", "Pyruvate → lactate", "Formaldehyde → formate"], "ans": 1, "why": "ADH, then ALDH, then acetate is activated to acetyl-CoA."}, {"q": "How many NADH come from oxidizing one ethanol to acetate?", "opts": ["0", "1", "2", "3"], "ans": 2, "why": "One each from alcohol DH and acetaldehyde DH."}, {"q": "Alcohol flush reaction is mainly due to:", "opts": ["Slow ADH", "Accumulated acetaldehyde from a slow ALDH", "Too much NAD⁺", "Lactate"], "ans": 1, "why": "Fast ADH plus slow ALDH means acetaldehyde builds up."}, {"q": "Why is IV ethanol given for methanol poisoning?", "opts": ["It destroys methanol", "It competes with methanol for ADH, slowing formaldehyde formation", "It neutralizes formate", "It boosts respiration"], "ans": 1, "why": "Competitive inhibition buys time for methanol to be excreted."}, {"q": "True or false: ethanol fermentation and ethanol catabolism use the same enzymes in reverse.", "opts": ["True", "False"], "ans": 1, "why": "They share ADH only. Fermentation uses pyruvate decarboxylase; catabolism uses ALDH and acetate thiokinase."}], "sa": [{"q": "Explain why a sprinting muscle makes lactate, step by step.", "a": "ATP demand exceeds what respiration can supply with the available O2, so the muscle runs extra glycolysis (no O2 needed). Each glucose turns 2 NAD⁺ into 2 NADH, and without O2 the ETC can't reoxidize that NADH, so the NAD⁺ pool would run out and glycolysis would stop. Lactate dehydrogenase reduces pyruvate to lactate with NADH, regenerating NAD⁺ 1:1. Lactate goes to the liver, which converts it back to pyruvate and then glucose."}, {"q": "Is pyruvate → ethanol reversible? Explain, and compare with pyruvate → lactate.", "a": "No. Pyruvate decarboxylase releases C1 as CO2; refixing CO2 is too expensive outside photosynthesis, so acetaldehyde can't go back to pyruvate. Pyruvate ⇌ lactate (LDH) is a reversible redox reaction with no carbon lost, and the liver runs it in reverse."}, {"q": "Write the reactions of methanol metabolism and explain the treatment for methanol poisoning.", "a": "Methanol + NAD⁺ → formaldehyde + NADH (ADH); formaldehyde + NAD⁺ + H2O → formate + NADH. Formaldehyde and formate are highly toxic (protein cross-linking, blindness). IV ethanol competes with methanol for ADH's active site, slowing formaldehyde production so the kidneys and lungs can eliminate the methanol."}]}, {"num": 8, "title": "The Pyruvate Dehydrogenase Complex", "key": ["Mitochondria: permeable outer membrane, impermeable inner membrane (cristae); respiration happens in the matrix", "Pyruvate + CoA + NAD⁺ → acetyl-CoA + CO₂ + NADH (ΔG°′ = −33.4, irreversible: the point of no return)", "Carbohydrate → fat is possible; fat → carbohydrate is not (PDH is irreversible)", "E1 pyruvate DH (TPP) → E2 dihydrolipoyl transacetylase (lipoyl-lysine arm, CoA) → E3 dihydrolipoyl DH (FAD → NAD⁺)", "Regulated on E1: allosteric (−ATP, NADH, acetyl-CoA; +AMP, NAD⁺, CoA) plus phosphorylation by PDH kinase (activated by ATP); a constant phosphatase reverses it"], "guide": "<h3>The mitochondrion<\/h3><ul><li><b>Outer membrane<\/b>: porous, so small molecules diffuse freely.<\/li><li><b>Inner membrane<\/b>: <b>impermeable<\/b> without a specific carrier. Folded into <b>cristae<\/b> (huge surface area), up to about 90% protein. The ETC is embedded here.<\/li><li><b>Intermembrane space (IMS)<\/b> lies between the membranes. The <b>matrix<\/b> is inside, where respiration occurs.<\/li><li>Pyruvate (made in the cytoplasm) crosses the outer membrane through pores and the inner membrane via the <b>mitochondrial pyruvate carrier<\/b>, identified only in 2012, a reminder that the field is still evolving.<\/li><\/ul><h3>Overall reaction<\/h3><div class=\"box\">Pyruvate + CoA-SH + NAD⁺ → <b>acetyl-CoA + CO<sub>2<\/sub> + NADH<\/b>. ΔG°′ = <b>−33.4 kJ/mol, irreversible<\/b>. Oxidative decarboxylation: C1 leaves as CO<sub>2<\/sub> (the start of the CO<sub>2<\/sub> you exhale), and the exergonic oxidation powers formation of the thioester.<\/div><h3>Coenzyme A<\/h3><ul><li>A carrier of <b>acyl groups<\/b> (R–C=O; a 2-carbon acyl = <b>acetyl<\/b>). Its reactive end is a <b>thiol (–SH)<\/b>, which forms a <b>thioester<\/b>.<\/li><li>Structure: adenosine (3′-phosphate ADP) + <b>pantothenic acid<\/b> (vitamin B5) + the thiol end. Recognize it; you don't need to draw it.<\/li><li>Acyl-CoAs are <b>activated<\/b>: attaching the acyl took energy, which is stored in the thioester and released when it's broken.<\/li><\/ul><div class=\"box\"><b>Why it matters:<\/b> acetyl-CoA is the building block for <b>fatty acid synthesis<\/b>, and fatty acids break down back to acetyl-CoA. Because PDH is irreversible, acetyl-CoA can't become pyruvate. So carbs → fat is easy, but <b>fat → carbohydrate is impossible<\/b>.<\/div><h3>The complex<\/h3><p>A giant complex of many copies of E1, E2, and E3 (visible by electron microscope, far bigger than hexokinase). Intermediates stay bound and are passed between active sites: <b>substrate channeling<\/b>.<\/p><table><tr><th>Enzyme<\/th><th>Cofactors<\/th><th>Step<\/th><\/tr><tr><td><b>E1 Pyruvate dehydrogenase<\/b><\/td><td><b>TPP<\/b> (thiamine pyrophosphate, vitamin B1)<\/td><td>(1) The TPP thiazolium carbanion attacks pyruvate's carbonyl C; decarboxylation releases CO<sub>2<\/sub> → <b>hydroxyethyl-TPP<\/b>. (2) The hydroxyethyl group transfers to oxidized lipoamide as an <b>acetyl<\/b> group; the lipoamide is reduced.<\/td><\/tr><tr><td><b>E2 Dihydrolipoyl transacetylase<\/b><\/td><td><b>Lipoyl-lysine arm<\/b>, <b>CoA<\/b> (substrate)<\/td><td>(3) Acetyl moves from the lipoyl arm to CoA-SH → <b>acetyl-CoA<\/b>. The arm is left reduced (two –SH).<\/td><\/tr><tr><td><b>E3 Dihydrolipoyl dehydrogenase<\/b><\/td><td><b>FAD<\/b> (prosthetic), <b>NAD⁺<\/b><\/td><td>(4) The reduced arm's 2 H → FAD → FADH<sub>2<\/sub>; (5) FADH<sub>2<\/sub> → hydride to NAD⁺ → <b>NADH<\/b>. The arm is reoxidized (disulfide).<\/td><\/tr><\/table><p><b>Lipoyl-lysine arm<\/b>: lipoic acid amide-linked to a lysine R group on E2. It is long and flexible, swinging like a crane among the three active sites. Its three states: <b>oxidized (disulfide ring) → reduced and acetylated (acetyl thioester + SH) → reduced (two SH)<\/b>.<\/p><div class=\"box\"><b>Follow the electron pair:<\/b> the C1–C2 bond of pyruvate → the unbonded pair left after decarboxylation → the C–H of hydroxyethyl-TPP → the S–C bond to lipoamide (sulfur is more electronegative, so sulfur now \"owns\" the pair; this is the oxidation) → stays on the S as –SH after acetyl goes to CoA → FAD (FADH<sub>2<\/sub>) → <b>NADH<\/b>.<\/div><p>Compare <b>pyruvate decarboxylase<\/b> (yeast ethanol fermentation): the same TPP chemistry forms hydroxyethyl-TPP, but with no E2 it is simply released as <b>acetaldehyde<\/b>. Same mechanism, different enzyme; mammals lack it.<\/p><h3>Regulation (all on E1)<\/h3><p>The PDH complex is the entry point to respiration, so it is finely tuned, not all-or-none.<\/p><table><tr><th>Mechanism<\/th><th>Turns DOWN<\/th><
