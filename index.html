th>Turns UP<\/th><\/tr><tr><td>Allosteric<\/td><td><b>ATP, NADH, acetyl-CoA<\/b> (high-energy feedback)<\/td><td><b>AMP, NAD⁺, CoA<\/b> (low-energy signals)<\/td><\/tr><tr><td>Phosphorylation<\/td><td><b>PDH kinase<\/b> (part of the complex) phosphorylates E1 → inactive. The kinase is <b>allosterically activated by ATP<\/b>.<\/td><td><b>PDH phosphatase<\/b> (part of the complex), always on at a low <b>constitutive<\/b> level, hydrolyzes the phosphate once the kinase quiets.<\/td><\/tr><\/table><p>Why AMP rather than ADP? Cells regenerate ATP by 2 ADP → ATP + AMP, so AMP is the stronger low-energy signal.<\/p>", "mc": [{"q": "Which mitochondrial membrane is impermeable without specific carriers?", "opts": ["Outer", "Inner", "Both", "Neither"], "ans": 1, "why": "The outer membrane has pores; the inner needs transporters such as the pyruvate carrier."}, {"q": "Where does the PDH complex function?", "opts": ["Cytoplasm", "Intermembrane space", "Mitochondrial matrix", "Outer membrane"], "ans": 2, "why": "All of respiration after pyruvate import happens in the matrix."}, {"q": "Products of the PDH complex per pyruvate:", "opts": ["Acetyl-CoA, CO2, NADH", "Acetaldehyde, CO2", "Lactate, NAD⁺", "Oxaloacetate, ATP"], "ans": 0, "why": "Oxidative decarboxylation plus CoA attachment."}, {"q": "Why can't mammals make glucose from fatty acids?", "opts": ["They lack β-oxidation", "PDH is irreversible, so acetyl-CoA can't become pyruvate", "Fatty acids can't enter mitochondria", "Acetyl-CoA is toxic"], "ans": 1, "why": "Fatty acids break down to acetyl-CoA, which can't go back to pyruvate."}, {"q": "Coenzyme A carries acyl groups as a:", "opts": ["Phosphoester", "Thioester", "Amide", "Glycoside"], "ans": 1, "why": "The thiol forms a high-energy thioester."}, {"q": "Which vitamin is part of CoA?", "opts": ["Thiamine (B1)", "Riboflavin (B2)", "Pantothenic acid (B5)", "Niacin (B3)"], "ans": 2, "why": "Pantothenate forms the middle of CoA."}, {"q": "The prosthetic group of E1 (pyruvate dehydrogenase) is:", "opts": ["FAD", "Lipoamide", "TPP", "Biotin"], "ans": 2, "why": "TPP's carbanion attacks pyruvate."}, {"q": "The first enzyme-bound intermediate after decarboxylation is:", "opts": ["Acetyl-lipoamide", "Hydroxyethyl-TPP", "Acetyl-CoA", "FADH2"], "ans": 1, "why": "The two remaining carbons stay on TPP as a hydroxyethyl group."}, {"q": "What is substrate channeling in the PDH complex?", "opts": ["Pyruvate import", "Intermediates passed between active sites by the lipoyl arm without diffusing away", "NADH export", "Regulation by phosphate"], "ans": 1, "why": "The swinging lipoyl-lysine arm carries the intermediates."}, {"q": "Enzyme 2 of the PDH complex is:", "opts": ["Pyruvate dehydrogenase", "Dihydrolipoyl transacetylase", "Dihydrolipoyl dehydrogenase", "PDH kinase"], "ans": 1, "why": "It transfers the acetyl group from lipoamide to CoA."}, {"q": "After E2 transfers the acetyl group to CoA, the lipoyl arm is:", "opts": ["Oxidized (disulfide)", "Reduced (two –SH)", "Acetylated", "Phosphorylated"], "ans": 1, "why": "It keeps the electron pair until E3 reoxidizes it."}, {"q": "The electron pair from pyruvate ends up in:", "opts": ["CO2", "Acetyl-CoA", "NADH (via FAD)", "H2O"], "ans": 2, "why": "Lipoamide → FAD → NAD⁺ at E3."}, {"q": "Which pair are both allosteric inhibitors of E1?", "opts": ["AMP and NAD⁺", "ATP and acetyl-CoA", "CoA and AMP", "ADP and NAD⁺"], "ans": 1, "why": "High-energy products inhibit; ATP, NADH, and acetyl-CoA turn it down."}, {"q": "PDH kinase is activated by:", "opts": ["AMP", "ATP binding to its allosteric site", "NAD⁺", "Pyruvate only"], "ans": 1, "why": "High ATP → kinase on → E1 phosphorylated and inactive."}, {"q": "How is E1 reactivated after phosphorylation?", "opts": ["PDH kinase runs in reverse", "A constitutively active PDH phosphatase removes the phosphate", "Spontaneous loss", "ATP binding"], "ans": 1, "why": "Once the kinase turns off, the phosphatase catches up."}], "sa": [{"q": "Trace the pair of electrons from pyruvate's C1–C2 bond through the PDH complex to NADH.", "a": "E1: the TPP carbanion adds to pyruvate; C1 leaves as CO2, and the C1–C2 bonding pair stays on C2, then picks up H⁺ to give hydroxyethyl-TPP (that C–H bond). E1 then transfers the 2-carbon unit to oxidized lipoamide; the pair forms the C–S bond, and sulfur (more electronegative) now owns it, so the acetyl is oxidized. E2: the acetyl moves to CoA and the pair stays on the sulfur, leaving reduced dihydrolipoamide (–SH). E3: the two H go to FAD → FADH2, then a hydride goes to NAD⁺ → NADH, regenerating the disulfide."}, {"q": "Describe the full regulation of the PDH complex and why it makes sense.", "a": "All regulation is on E1. Allosteric: ATP, NADH, and acetyl-CoA (high-energy, feedback) inhibit; AMP, NAD⁺, and CoA activate. Covalent: PDH kinase (activated by ATP) phosphorylates and inactivates E1; a constitutively active PDH phosphatase removes the phosphate when the kinase turns off. Since PDH is the irreversible gateway into respiration, this lets the cell tune carbon flow to its energy needs."}, {"q": "Compare pyruvate dehydrogenase (E1) with pyruvate decarboxylase.", "a": "Both use TPP: the carbanion attacks pyruvate, CO2 leaves, and hydroxyethyl-TPP forms. In the PDH complex, the hydroxyethyl group is oxidized and passed to lipoamide and then CoA (acetyl-CoA, electrons to NADH). Pyruvate decarboxylase (yeast, ethanol fermentation) just releases it as acetaldehyde; there's no oxidation and no NADH. Mammals lack pyruvate decarboxylase."}]}, {"num": 9, "title": "The Citric Acid Cycle", "key": ["Per acetyl-CoA: 2 CO₂, 3 NADH, 1 FADH₂, 1 GTP (≈ATP). Per glucose, double that", "Know every enzyme, intermediate name, carbon count, CO₂/NADH/FADH₂/GTP step; know STRUCTURES for α-KG → succinyl-CoA → succinate", "Irreversible: citrate synthase, isocitrate DH, α-KG DH complex", "α-KG DH complex = same mechanism as PDH (TPP, lipoyl arm, FAD, NAD⁺)", "Succinyl-CoA synthetase: thioester → succinyl phosphate (acyl phosphate) → GTP; driven by an earlier oxidation, like glycolysis steps 6–7"], "guide": "<h3>Carbon bookkeeping per glucose<\/h3><p>Glucose (6C) → 2 pyruvate (glycolysis) → 2 acetyl-CoA + <b>2 CO<sub>2<\/sub><\/b> (PDH) → <b>4 CO<sub>2<\/sub><\/b> (two turns of the cycle). All 6 carbons leave as CO<sub>2<\/sub>, and the electrons go to NADH and FADH<sub>2<\/sub> (which will explain the H<sub>2<\/sub>O).<\/p><p><b>What to know:<\/b> each step's enzyme, intermediate names, what happens chemically (carbon counts, CO<sub>2<\/sub>, NADH/FADH<sub>2<\/sub>, substrate-level phosphorylation), and reversibility. Know <b>structures only for α-ketoglutarate → succinyl-CoA → succinate<\/b> (plus the α-KG/glutamate and OAA/aspartate interconversions).<\/p><h3>The 8 steps (in the matrix)<\/h3><table><tr><th>#<\/th><th>Reaction (carbons)<\/th><th>Enzyme<\/th><th>Notes<\/th><\/tr><tr><td>1<\/td><td>Acetyl-CoA (2) + oxaloacetate (4) → <b>citrate<\/b> (6) + CoA<\/td><td><b>Citrate synthase<\/b><\/td><td><b>Irreversible.<\/b> Ligase: new C–C bond (the acetyl CH<sub>3<\/sub> carbon to OAA's carbonyl C), powered by breaking the activated <b>thioester<\/b>. <i>Synthase<\/i> = energy not from ATP; <i>synthetase<\/i> = energy from ATP/NTP.<\/td><\/tr><tr><td>2<\/td><td>Citrate ⇌ <b>isocitrate<\/b> (6)<\/td><td><b>Aconitase<\/b><\/td><td>Isomerization by removing and re-adding water (cis-aconitate stays enzyme-bound). Moves the –OH to set up the next dehydrogenation.<\/td><\/tr><tr><td>3<\/td><td>Isocitrate → <b>α-ketoglutarate<\/b> (5) + CO<sub>2<\/sub><\/td><td><b>Isocitrate dehydrogenase<\/b><\/td><td><b>Irreversible<\/b> oxidative decarboxylation. <b>NADH #1, CO<sub>2<\/sub> #1.<\/b> The hydride comes from the C–H on the –OH carbon, which becomes C=O.<\/td><\/tr><tr><td>4<\/td><td>α-KG + CoA → <b>succinyl-CoA<\/b> (4) + CO<sub>2<\/sub><\/td><td><b>α-Ketoglutarate dehydrogenase complex<\/b><\/td><td><b>Irreversible<\/b> oxidative decarboxylation. <b>NADH #2, CO<sub>2<\/sub> #2.<\/b> The electron pair is the one left on the carbon after CO<sub>2<\/sub> leaves (no H is removed).<\/td><\/tr><tr><td>5<\/td><td>Succinyl-CoA + GDP + P<sub>i<\/sub> ⇌ <b>succinate<\/b> (4) + GTP + CoA<\/td><td><b>Succinyl-CoA synthetase<\/b> (named for the reverse direction)<\/td><td><b>Substrate-level phosphorylation → GTP<\/b> (= ATP via nucleoside diphosphate kinase: GTP + ADP ⇌ GDP + ATP).<\/td><\/tr><tr><td>6<\/td><td>Succinate ⇌ <b>fumarate<\/b><\/td><td><b>Succinate dehydrogenase<\/b><\/td><td><b>FADH<sub>2<\/sub><\/b>: removes 2 H atoms, forming C=C. The <b>only membrane-bound<\/b> enzyme (inner mitochondrial membrane) and the <b>only one using FAD<\/b> (prosthetic). Where do the electrons go? (→ ETC complex II)<\/td><\/tr><tr><td>7<\/td><td>Fumarate + H<sub>2<\/sub>O ⇌ <b>malate<\/b><\/td><td><b>Fumarase<\/b><\/td><td>Lyase hydration; sets up the next dehydrogenation.<\/td><\/tr><tr><td>8<\/td><td>Malate ⇌ <b>oxaloacetate<\/b><\/td><td><b>Malate dehydrogenase<\/b><\/td><td><b>NADH #3.<\/b> Reversible, which matters later (malate–aspartate shuttle, gluconeogenesis).<\/td><\/tr><\/table><h3>α-KG dehydrogenase = PDH's twin<\/h3><p>Both are <b>α-keto acid dehydrogenases<\/b> with the same mechanism and cofactors: E1 (TPP), E2 (lipoyl-lysine arm, CoA), E3 (FAD → NAD⁺). Pyruvate → acetyl-CoA vs. α-ketoglutarate → succinyl-CoA: each releases CO<sub>2<\/sub> and makes NADH. Nature evolves a mechanism once and reuses it.<\/p><h3>Structures to know<\/h3><div class=\"box\"><b>α-Ketoglutarate<\/b>: <sup>−<\/sup>OOC–CH<sub>2<\/sub>–CH<sub>2<\/sub>–C(=O)–COO<sup>−<\/sup><br><b>Succinyl-CoA<\/b>: <sup>−<\/sup>OOC–CH<sub>2<\/sub>–CH<sub>2<\/sub>–C(=O)–S-CoA (C1 of α-KG left as CO<sub>2<\/sub>)<br><b>Succinyl phosphate<\/b> (enzyme-bound): <sup>−<\/sup>OOC–CH<sub>2<\/sub>–CH<sub>2<\/sub>–C(=O)–OPO<sub>3<\/sub><sup>2−<\/sup><br><b>Succinate<\/b>: <sup>−<\/sup>OOC–CH<sub>2<\/sub>–CH<sub>2<\/sub>–COO<sup>−<\/sup><\/div><h3>Succinyl-CoA synthetase mechanism<\/h3><ol><li>Breaking the high-energy thioester (CoA leaves, keeping its electron pair) powers adding free <b>P<sub>i<\/sub><\/b> to the carbonyl C → enzyme-bound <b>succinyl phosphate<\/b> (a high-energy <b>acyl phosphate<\/b>).<\/li><li>The phosphate goes to <b>GDP → GTP<\/b>; succinate is released.<\/li><\/ol><div class=\"box\"><b>Original energy source?<\/b> The <b>oxidation<\/b> at α-KG DH, which made the thioester. It's the same logic as glycolysis steps 6–7 (oxidation → acyl phosphate → substrate-level phosphorylation), with one extra intermediate (the thioester). <b>Whenever free P<sub>i<\/sub> is brought in for substrate-level phosphorylation, it is always linked to an oxidation.<\/b><\/div><h3>Tracking carbons<\/h3><p>The two CO<sub>2<\/sub> released in a turn are <b>not<\/b> the two acetyl carbons that just entered. Once you reach succinate, which is <b>symmetric<\/b>, you can't track the acetyl carbons anymore. They leave in later turns. Stoichiometrically, 2 C in = 2 C out.<\/p><h3>Why so complicated? It's a central hub<\/h3><p>The reactions likely existed in other (often biosynthetic) pathways before O<sub>2<\/sub> and respiration. Intermediates branch in and out:<\/p><ul><li><b>Citrate<\/b>: shuttles acetyl groups to the cytoplasm for fatty acid and sterol synthesis.<\/li><li><b>α-KG ⇌ glutamate<\/b> → other amino acids, purines.<\/li><li><b>Succinyl-CoA<\/b> → biosynthesis (e.g. heme).<\/li><li><b>OAA ⇌ aspartate<\/b> → amino acids; OAA is the first intermediate of <b>gluconeogenesis<\/b>.<\/li><li><b>Malate ⇌ OAA<\/b>: shuttles electron pairs across the inner membrane.<\/li><\/ul><p><b>Know these interconversions (transamination):<\/b> α-ketoglutarate ⇌ glutamate; oxaloacetate ⇌ aspartate. The carbonyl O is swapped for an amino group from another molecule.<\/p>", "mc": [{"q": "Products of one turn of the citric acid cycle:", "opts": ["2 CO2, 3 NADH, 1 FADH2, 1 GTP", "1 CO2, 2 NADH, 1 ATP", "2 CO2, 4 NADH, 1 GTP", "3 CO2, 3 NADH, 1 FADH2"], "ans": 0, "why": "Isocitrate DH, α-KG DH, and malate DH make NADH; succinate DH makes FADH2; succinyl-CoA synthetase makes GTP."}, {"q": "Citrate synthase gets the energy for its new C–C bond from:", "opts": ["ATP", "Breaking the acetyl-CoA thioester", "NADH", "GTP"], "ans": 1, "why": "Synthases use non-ATP energy; here, the activated thioester."}, {"q": "Which citric acid cycle steps are irreversible?", "opts": ["Citrate synthase, isocitrate DH, α-KG DH", "Aconitase, fumarase, malate DH", "Succinate DH and fumarase", "All of them"], "ans": 0, "why": "The first step and the two oxidative decarboxylations."}, {"q": "Aconitase converts citrate to isocitrate. Its purpose is:", "opts": ["To release CO2", "To move the –OH so the next carbon can be dehydrogenated", "To make NADH", "To make GTP"], "ans": 1, "why": "It sets up isocitrate dehydrogenase."}, {"q": "How many carbons does α-ketoglutarate have?", "opts": ["4", "5", "6", "3"], "ans": 1, "why": "Citrate (6) → isocitrate (6) → α-KG (5) + CO2."}, {"q": "The α-KG dehydrogenase complex is most similar to:", "opts": ["Citrate synthase", "The PDH complex", "Succinate DH", "Pyruvate kinase"], "ans": 1, "why": "Both are α-keto acid dehydrogenases with TPP, lipoamide, FAD, and NAD⁺."}, {"q": "In α-KG → succinyl-CoA, the electrons that reduce NAD⁺ come from:", "opts": ["A C–H hydrogen", "The pair left on the carbon after CO2 leaves", "CoA", "Water"], "ans": 1, "why": "No hydrogen is removed; the decarboxylation pair is oxidized."}, {"q": "The enzyme-bound intermediate of succinyl-CoA synthetase is:", "opts": ["Succinyl-AMP", "Succinyl phosphate", "Succinyl-lipoamide", "Fumaryl-CoA"], "ans": 1, "why": "An acyl phosphate formed with free Pi; its phosphate then goes to GDP."}, {"q": "Ultimately, the energy for GTP synthesis at succinyl-CoA synthetase comes from:", "opts": ["Hydrolysis of ATP", "The oxidation at the α-KG dehydrogenase step", "Proton gradient", "Fumarase"], "ans": 1, "why": "Oxidation → thioester → acyl phosphate → GTP."}, {"q": "Which citric acid cycle enzyme is embedded in the inner mitochondrial membrane and uses FAD?", "opts": ["Malate dehydrogenase", "Succinate dehydrogenase", "Isocitrate DH", "Fumarase"], "ans": 1, "why": "It's also complex II of the ETC."}, {"q": "Fumarase is what class of enzyme?", "opts": ["Dehydrogenase", "Lyase (hydration)", "Kinase", "Isomerase"], "ans": 1, "why": "It adds water across the C=C of fumarate."}, {"q": "Why can't you track the acetyl carbons past succinate?", "opts": ["They're lost as CO2", "Succinate is symmetric, so it can bind either way", "They become CoA", "They enter the ETC"], "ans": 1, "why": "Symmetric intermediates scramble the label."}, {"q": "Transamination of oxaloacetate gives:", "opts": ["Glutamate", "Aspartate", "Alanine", "Asparagine"], "ans": 1, "why": "OAA ⇌ aspartate."}, {"q": "Total CO2 released from one glucose by PDH plus the citric acid cycle:", "opts": ["2", "4", "6", "12"], "ans": 2, "why": "2 from PDH + 4 from two turns = 6."}], "sa": [{"q": "Draw/describe α-ketoglutarate → succinyl-CoA → succinate, including the enzyme-bound intermediate, and identify the energy source for GTP synthesis.", "a": "α-KG (⁻OOC–CH2–CH2–CO–COO⁻) + CoA + NAD⁺ → succinyl-CoA (⁻OOC–CH2–CH2–CO–SCoA) + CO2 + NADH (α-KG DH complex, irreversible). Succinyl-CoA + Pi → enzyme-bound succinyl phosphate (⁻OOC–CH2–CH2–CO–OPO3²⁻) + CoA; then succinyl phosphate + GDP → succinate + GTP (succinyl-CoA synthetase). Breaking the thioester powers Pi addition, and the acyl phosphate powers GTP formation. The original source is the oxidation at α-KG DH that created the thioester."}, {"q": "Why is the citric acid cycle more complicated than a minimal pathway for oxidizing acetyl groups?", "a": "Its reactions likely evolved earlier in other, mostly biosynthetic, pathways, and it remains a central hub. Citrate exports acetyl groups for fatty acid synthesis; α-KG and OAA make amino acids (glutamate, aspartate); OAA starts gluconeogenesis; malate/OAA shuttle electrons across the inner membrane; succinyl-CoA feeds biosynthesis; fumarate and aspartate link to the urea cycle."}, {"q": "For one glucose, tally CO2, NADH, FADH2, and ATP/GTP from glycolysis through the citric acid cycle.", "a": "Glycolysis: 2 ATP (net), 2 NADH. PDH: 2 NADH, 2 CO2. Citric acid cycle (×2): 6 NADH, 2 FADH2, 2 GTP, 4 CO2. Total: 10 NADH, 2 FADH2, 4 ATP/GTP, 6 CO2."}]}, {"num": 10, "title": "The Mitochondrial Electron Transport Chain, Part A", "key": ["The ETC (complexes I–IV) is in the inner membrane; downhill electron flow pumps H⁺ from the matrix to the IMS, giving a proton-motive force (chemical + electrical)", "Carriers: FAD/FMN (2e⁻, can hand off 1 at a time), heme/cytochromes (1e⁻, Fe³⁺/Fe²⁺), Fe–S centers (1e⁻), ubiquinone Q ⇌ QH₂ (2e⁻, membrane-soluble pool)", "ΔG°′ = −nFΔE°′; ΔE°′ = E°′(acceptor) − E°′(donor). E°′ is measured against the standard hydrogen electrode", "Complex I (NADH DH): NADH → FMN → Fe–S → Q, pumps 4 H⁺. Complex II (succinate DH = the TCA enzyme): succinate → FAD → Fe–S → Q, pumps 0", "Complex III (ubiquinone–cyt c oxidoreductase): QH₂ → 2 cyt c, pumps 4 H⁺ via the Q cycle"], "guide": "<h3>Overview<\/h3><p>NADH from glycolysis, PDH, and the citric acid cycle (plus FADH<sub>2<\/sub>) delivers electrons to the <b>electron transport chain<\/b>: four huge complexes in the <b>inner mitochondrial membrane<\/b>. Electrons move to carriers of ever-higher reduction potential (exergonic, downhill), and that energy <b>pumps protons from the matrix into the IMS<\/b>. <b>O<sub>2<\/sub><\/b> is the final acceptor, reduced to <b>H<sub>2<\/sub>O<\/b>, which is where respiration's water comes from.<\/p><p>The <b>proton-motive force<\/b> works like a battery and has two parts: a <b>chemical<\/b> H⁺ concentration gradient and an <b>electrical<\/b> potential (positive outside, negative inside the inner membrane). It will power ATP synthesis.<\/p><h3>Electron carriers<\/h3><p>Ordinary R groups can't carry electrons. The path is made of specific prosthetic groups. Know the types and how many electrons each carries; you don't need their order or exact locations.<\/p><table><tr><th>Carrier<\/th><th>e⁻ carried<\/th><th>Notes<\/th><\/tr><tr><td><b>FAD / FMN<\/b><\/td><td>2 (as 2 H atoms)<\/td><td>FMN = FAD without the AMP. Can donate <b>one e⁻ at a time<\/b> (semiquinone), so it acts as a <b>funnel<\/b> from 2e⁻ to 1e⁻ carriers. Recognize the structure.<\/td><\/tr><tr><td><b>Heme<\/b> (in <b>cytochromes<\/b>)<\/td><td>1 (Fe³⁺ ⇌ Fe²⁺)<\/td><td>Porphyrin ring + Fe. A cytochrome is defined by a heme. a, b, c types differ in side groups. Reduction changes the color, which is how they were tracked.<\/td><\/tr><tr><td><b>Iron–sulfur centers<\/b><\/td><td>1<\/td><td>Fe coordinated by S, in many forms. Even multi-Fe clusters carry only 1 e⁻.<\/td><\/tr><tr><td><b>Ubiquinone (coenzyme Q)<\/b><\/td><td>2 (as 2 H)<\/td><td>Q + 2e⁻ + 2H⁺ → <b>QH<sub>2<\/sub> (ubiquinol)<\/b>; a semiquinone radical is possible. Its long nonpolar tail keeps it <b>dissolved in the membrane<\/b>. A <b>pool<\/b> of Q and QH<sub>2<\/sub> shuttles electrons <b>between complexes<\/b>.<\/td><\/tr><\/table><h3>Reduction potential<\/h3><ul><li><b>E°′<\/b> is measured against the <b>standard hydrogen electrode<\/b> (1 M H⁺, 1 atm H<sub>2<\/sub>). The test cell has the oxidized and reduced forms at 1 M each. If electrons flow toward the test cell, E°′ is positive.<\/li><li><b>ΔE°′ = E°′(acceptor) − E°′(donor)<\/b>. Positive means favorable.<\/li><li><div class=\"box\"><b>ΔG°′ = −nFΔE°′<\/b>, with n = number of electrons and F = 96.5 kJ/V·mol. (No logs!)<\/div><\/li><li>NAD⁺/NADH is low (≈ −0.32 V), Q is intermediate, the cytochromes rise, and <b>O<sub>2<\/sub>/H<sub>2<\/sub>O is highest<\/b> (≈ +0.82 V; oxygen is very electronegative).<\/li><\/ul><h3>Complex I: NADH dehydrogenase<\/h3><ul><li>42 polypeptides, ~850 kDa, boot-shaped. <b>The entry point for NADH.<\/b><\/li><li>NADH → <b>FMN<\/b> (2e⁻) → a chain of <b>Fe–S centers<\/b> (1e⁻ each) → <b>Q → QH<sub>2<\/sub><\/b> at a site near the membrane/matrix interface.<\/li><li><b>Pumps 4 H⁺<\/b> per electron pair. Q binding and QH<sub>2<\/sub> release shift the complex, and that shift travels along the membrane arm to four proton-pumping subunits.<\/li><\/ul><h3>Complex II: succinate dehydrogenase<\/h3><ul><li>Small: 4 subunits (A–D), 140 kDa, doesn't span the membrane.<\/li><li>Succinate → fumarate. Electrons go to <b>FAD<\/b> → 3 <b>Fe–S<\/b> → <b>Q → QH<sub>2<\/sub><\/b>. <b>No protons pumped.<\/b> Electrons enter here <b>only from succinate<\/b>.<\/li><li><div class=\"box\"><b>Complex II IS the citric acid cycle's succinate dehydrogenase<\/b>, the membrane-bound FAD enzyme. That's where its \"FADH<sub>2<\/sub>\" electrons go.<\/div><\/li><li>Subunit D has a <b>heme that isn't on the electron path<\/b>. Model: it captures <b>reactive oxygen species (ROS)<\/b>, such as superoxide formed when stray electrons hit O<sub>2<\/sub>. A mutation near this heme causes <b>cancer predisposition<\/b> (more ROS, more DNA damage). ROS are the inherent risk of running the ETC; cells have neutralizing systems.<\/li><\/ul><h3>Complex III: ubiquinone–cytochrome c oxidoreductase<\/h3><ul><li>22 polypeptides, ~500 kDa; hemes and Fe–S centers.<\/li><li>Collects QH<sub>2<\/sub> from <b>both<\/b> complexes I and II. Transfers one electron pair from QH<sub>2<\/sub> to <b>2 cytochrome c<\/b> (1 e⁻ each). <b>Pumps 4 H⁺.<\/b><\/li><li><b>Cytochrome c<\/b>: a small single-polypeptide protein with one heme (1 e⁻), <b>soluble in the IMS<\/b>. It carries electrons from complex III to complex IV, as Q carries them from I/II to III.<\/li><li>Running total: <b>4 (I) + 4 (III) = 8 H⁺<\/b> so far per NADH pair.<\/li><\/ul><h3>The Q cycle (know what it does)<\/h3><p>The mechanism that (1) splits QH<sub>2<\/sub>'s pair between two cyt c and (2) pumps 4 H⁺. Protons added when Q → QH<sub>2<\/sub> always come from the <b>matrix<\/b> side and are released on the <b>IMS<\/b> side.<\/p><ol><li>QH<sub>2<\/sub> #1 binds: 2 H⁺ go to the IMS. One e⁻ goes via Fe–S → heme → cyt c #1. The other goes down via hemes to a Q at a second site → semiquinone (Q•⁻).<\/li><li>QH<sub>2<\/sub> #2 binds: 2 more H⁺ go to the IMS (4 total). One e⁻ → cyt c #2. The other completes Q•⁻ → QH<sub>2<\/sub>, taking 2 H⁺ from the matrix.<\/li><\/ol><p>Net: 2 QH<sub>2<\/sub> used, 1 QH<sub>2<\/sub> regenerated → <b>1 QH<sub>2<\/sub> consumed, 2 cyt c reduced, 4 H⁺ released to the IMS<\/b>.<\/p>", "mc": [{"q": "Which direction does the ETC pump protons?", "opts": ["IMS → matrix", "Matrix → IMS", "Cytoplasm → IMS", "Matrix → cytoplasm"], "ans": 1, "why": "This builds a gradient with high [H⁺] in the IMS."}, {"q": "The proton-motive force consists of:", "opts": ["Only a pH gradient", "A chemical gradient plus an electrical potential", "Only ATP", "Only a membrane potential"], "ans": 1, "why": "Pumping positive charges out creates both."}, {"q": "How many electrons does an iron–sulfur center carry at a time?", "opts": ["1", "2", "4", "Depends on number of Fe"], "ans": 0, "why": "Fe shuttles between 3+ and 2+, even in multi-Fe clusters."}, {"q": "Why are FAD and FMN important in the ETC?", "opts": ["They pump protons", "They accept 2 e⁻ and can pass them on one at a time to 1-e⁻ carriers", "They bind O2", "They're soluble in the IMS"], "ans": 1, "why": "They funnel electron pairs into single-electron carriers."}, {"q": "A cytochrome is defined as a protein containing:", "opts": ["An Fe–S center", "A heme prosthetic group", "FMN", "Copper"], "ans": 1, "why": "Cyto = cell, chrome = color; hemes change color when reduced."}, {"q": "Where is ubiquinone found?", "opts": ["Free in the matrix", "Dissolved in the inner membrane", "In the IMS", "In the cytoplasm"], "ans": 1, "why": "Its long hydrophobic tail keeps it in the membrane as a mobile pool."}, {"q": "ΔG°′ for a redox reaction can be calculated by:", "opts": ["−RT ln ΔE", "−nFΔE°′", "nF/ΔE", "ΔE/RT"], "ans": 1, "why": "F = 96.5 kJ/V·mol; n = electrons transferred."}, {"q": "QH2 (E°′ 0.045 V) gives 2e⁻ to 2 cyt c (E°′ 0.254 V). ΔG°′ ≈", "opts": ["+40.3 kJ/mol", "−40.3 kJ/mol", "−20.2 kJ/mol", "−4.0 kJ/mol"], "ans": 1, "why": "ΔE = 0.209 V; ΔG = −2(96.5)(0.209) = −40.3 kJ/mol."}, {"q": "Complex I transfers electrons from:", "opts": ["Succinate to Q", "NADH to Q", "QH2 to cyt c", "Cyt c to O2"], "ans": 1, "why": "NADH dehydrogenase, via FMN and Fe–S centers."}, {"q": "How many protons do complexes I and II pump per electron pair?", "opts": ["4 and 4", "4 and 0", "2 and 2", "0 and 4"], "ans": 1, "why": "Complex II doesn't pump protons."}, {"q": "Complex II is the same enzyme as:", "opts": ["Malate dehydrogenase", "Succinate dehydrogenase of the citric acid cycle", "Isocitrate DH", "ATP synthase"], "ans": 1, "why": "It's the membrane-bound FAD enzyme from the cycle."}, {"q": "The heme in complex II's subunit D is thought to:", "opts": ["Carry electrons to Q", "Trap reactive oxygen species", "Bind succinate", "Pump protons"], "ans": 1, "why": "It isn't on the electron path; mutations near it raise cancer risk."}, {"q": "Cytochrome c is located:", "opts": ["Embedded in the inner membrane", "Soluble in the intermembrane space", "In the matrix", "In the outer membrane"], "ans": 1, "why": "It shuttles single electrons from complex III to IV."}, {"q": "The Q cycle in complex III accomplishes:", "opts": ["NADH oxidation", "Splitting QH2's electron pair between two cyt c and pumping 4 H⁺", "ATP synthesis", "O2 reduction"], "ans": 1, "why": "Net: 1 QH2 → 2 cyt c reduced + 4 H⁺ to the IMS."}, {"q": "In the Q cycle, the protons released into the IMS originally came from:", "opts": ["The IMS", "The matrix, when Q was reduced to QH2", "Cytochrome c", "Water"], "ans": 1, "why": "Reducing Q always takes protons from the matrix side."}], "sa": [{"q": "Trace an electron pair from NADH through complexes I and III to cytochrome c, giving the carriers and protons pumped.", "a": "NADH → FMN in complex I (2e⁻) → a series of Fe–S centers (1e⁻ at a time) → Q, reduced to QH2 with H⁺ from the matrix; 4 H⁺ pumped. QH2 diffuses in the membrane to complex III, where the Q cycle splits the pair: Fe–S → heme → 2 separate cytochrome c (1e⁻ each); 4 H⁺ released to the IMS. Total so far: 8 H⁺."}, {"q": "Compare complex I and complex II.", "a": "Complex I (NADH dehydrogenase): huge (42 subunits), spans the membrane, takes electrons from NADH via FMN and Fe–S to Q, pumps 4 H⁺. Complex II (succinate dehydrogenase, also a citric acid cycle enzyme): small (4 subunits), takes electrons only from succinate (→ fumarate) via FAD and Fe–S to Q, pumps no protons. Both deliver QH2 to complex III."}, {"q": "Explain how reduction potential is measured and how it relates to ΔG°′.", "a": "A test electrode with the oxidized and reduced forms at 1 M each is connected by a salt bridge and wire to the standard hydrogen electrode (1 M H⁺, 1 atm H2). The voltmeter reading is E°′: positive if electrons flow to the test cell (it pulls harder). ΔE°′ = E°′(acceptor) − E°′(donor), and ΔG°′ = −nFΔE°′, so a positive ΔE°′ is exergonic."}]}, {"num": 11, "title": "Mitochondrial Electron Transport Chain, Part B", "key": ["Complex IV = cytochrome c oxidase: 2 cyt c → ½O₂ + 2H⁺ → H₂O; pumps 2 H⁺ (hemes, Fe–S, Cu²⁺/Cu⁺)", "H⁺ pumped per pair: NADH (I + III + IV) = 4 + 4 + 2 = 10; succinate (II + III + IV) = 0 + 4 + 2 = 6", "Protons are pumped only while electrons are FLOWING; a blocked chain pumps nothing", "Isolated mitochondria + oxidizable substrates (NADH, succinate) + inhibitors + spectrophotometry (oxidized vs. reduced spectra) revealed the order", "Before a block: reduced. After a block: oxidized (drained to O₂). Rotenone blocks I→Q, antimycin A blocks QH₂→III, cyanide blocks IV→O₂"], "guide": "<h3>Complex IV: cytochrome c oxidase<\/h3><ul><li>13 polypeptides, ~204 kDa. Carriers: hemes, Fe–S, and <b>copper<\/b> (Cu²⁺ ⇌ Cu⁺, 1 e⁻).<\/li><li>An <b>oxidase<\/b>: its electron acceptor is <b>O<sub>2<\/sub><\/b>. Two reduced cyt c each hand over 1 e⁻.<\/li><li>Per electron pair: <b>½ O<sub>2<\/sub> + 2 e⁻ + 2 H⁺ (matrix) → H<sub>2<\/sub>O<\/b>. O<sub>2<\/sub> binds a heme near the bottom; the first pair reduces one O atom to H<sub>2<\/sub>O, the second pair the other. So 2 pairs reduce O<sub>2<\/sub> to 2 H<sub>2<\/sub>O.<\/li><li><b>Pumps 2 H⁺<\/b>, separate from the 2 H⁺ consumed to make water. The mechanism is less understood (possibly Q-cycle-like, but no Q).<\/li><li>This is <b>where the water of glucose oxidation comes from<\/b>. CO<sub>2<\/sub> comes from PDH and the citric acid cycle; you breathe in the O<sub>2<\/sub>.<\/li><\/ul><h3>Protons pumped per electron pair<\/h3><table><tr><th>Entry point<\/th><th>Path<\/th><th>H⁺ pumped<\/th><\/tr><tr><td><b>NADH<\/b> → complex I<\/td><td>I (4) → Q → III (4) → cyt c → IV (2)<\/td><td><b>10<\/b><\/td><\/tr><tr><td><b>Succinate<\/b> → complex II<\/td><td>II (0) → Q → III (4) → cyt c → IV (2)<\/td><td><b>6<\/b><\/td><\/tr><\/table><p>So succinate-derived electrons yield less energy. The exergonic electron flow is stored as the proton gradient (a battery), which ATP synthase uses next lecture.<\/p><div class=\"box\"><b>Water-wheel idea:<\/b> protons are pumped only while electrons are <b>moving<\/b> through the complexes. If electrons just sit in a blocked chain, there is <b>no pumping<\/b>.<\/div><h3>How the order was worked out (1950s–80s)<\/h3><ul><li><b>Isolated mitochondria<\/b>: homogenize tissue (e.g. beef liver), then density-gradient centrifugation. Inner and outer membranes stay intact.<\/li><li>Leftover substrates are used up quickly, so <b>you control what's in the matrix<\/b> by adding it to the buffer (it's imported).<\/li><li><b>Readout<\/b>: each carrier (heme, Fe–S, FMN) has a distinct <b>absorption spectrum<\/b> that shifts between oxidized and reduced forms (e.g. cyt c). Spectrophotometry tells you whether each complex holds electrons.<\/li><li><b>Oxidizable substrates<\/b>: NADH (enters at I) and succinate (enters at II). Add either, both, or neither.<\/li><li><b>Inhibitors<\/b> block specific points (you'll be told their sites on exams):<ul><li><b>Rotenone<\/b>: complex I → Q<\/li><li><b>Antimycin A<\/b>: QH<sub>2<\/sub> → complex III<\/li><li><b>Cyanide<\/b>: complex IV → O<sub>2<\/sub><\/li><\/ul><\/li><\/ul><h3>Solving inhibitor problems<\/h3><div class=\"box\"><b>Rules:<\/b> (1) A complex is <b>reduced<\/b> only if electrons can reach it from an added substrate. (2) Everything <b>upstream<\/b> of a block fills up and is <b>reduced<\/b>. (3) Everything <b>downstream<\/b> drains to O<sub>2<\/sub> and is <b>oxidized<\/b>. (4) A complex with no electron source stays <b>oxidized<\/b>. (5) O<sub>2<\/sub> is consumed only if electrons reach complex IV and flow into O<sub>2<\/sub>.<\/div><p>Example: <b>NADH + antimycin A<\/b> → complex I <b>reduced<\/b>, the Q pool becomes all QH<sub>2<\/sub>, complex III <b>oxidized<\/b>, complex IV <b>oxidized<\/b>, complex II oxidized (no succinate). No pumping, no O<sub>2<\/sub> use.<\/p><p><b>Dr. Seuss jug analogy<\/b>: picture interconnected jugs I and II feeding III, then IV, then a drain to O<sub>2<\/sub>. NADH pours water into I; succinate pours into II. Water = electrons = reduced; an empty jug = oxidized. An inhibitor is a plug: jugs above it fill, jugs below it drain empty.<\/p>", "mc": [{"q": "Complex IV is classified as an oxidase because:", "opts": ["It uses NAD⁺", "Its electron acceptor is O2", "It uses FAD", "It oxidizes water"], "ans": 1, "why": "Oxidases transfer electrons to molecular oxygen."}, {"q": "How many protons does complex IV pump per electron pair?", "opts": ["0", "2", "4", "10"], "ans": 1, "why": "Separate from the 2 H⁺ used to make H2O."}, {"q": "One electron pair through complex IV reduces:", "opts": ["One O2 to 2 H2O", "½ O2 to one H2O", "O2 to H2O2", "Cyt c to cyt b"], "ans": 1, "why": "Two pairs are needed for a whole O2."}, {"q": "Total protons pumped per NADH electron pair:", "opts": ["6", "8", "10", "12"], "ans": 2, "why": "4 + 4 + 2."}, {"q": "Total protons pumped per succinate electron pair:", "opts": ["4", "6", "8", "10"], "ans": 1, "why": "Complex II pumps 0, then III (4) + IV (2)."}, {"q": "Which metal carries electrons in complex IV besides Fe?", "opts": ["Mg", "Zn", "Cu", "Mn"], "ans": 2, "why": "Cu²⁺/Cu⁺ centers."}, {"q": "Why are isolated mitochondria a useful system?", "opts": ["They make glucose", "Leftover substrates are used up, so you control what's in the matrix", "They lack membranes", "They don't use O2"], "ans": 1, "why": "Add NADH, succinate, ADP, inhibitors, etc. at will."}, {"q": "How was each complex's redox state measured?", "opts": ["Radioactive labels", "Absorption spectra that differ between oxidized and reduced carriers", "Mass spectrometry", "pH"], "ans": 1, "why": "Spectrophotometry of hemes, Fe–S, FMN."}, {"q": "NADH + rotenone (blocks I → Q). Complex states?", "opts": ["I reduced; II, III, IV oxidized", "All reduced", "All oxidized", "I oxidized; III, IV reduced"], "ans": 0, "why": "Complex I fills; everything downstream drains."}, {"q": "NADH + cyanide. Complex states?", "opts": ["I, III, IV reduced; II oxidized", "All oxidized", "Only IV reduced", "I oxidized"], "ans": 0, "why": "Everything upstream of the IV → O2 block fills; II has no substrate."}, {"q": "Succinate + antimycin A. Complex states?", "opts": ["II reduced; I, III, IV oxidized", "II, III reduced", "All reduced", "I reduced"], "ans": 0, "why": "Electrons enter at II and stop at QH2; III and IV drain; I has no source."}, {"q": "With NADH + antimycin A, are protons being pumped?", "opts": ["Yes, 4 at complex I", "No; electrons aren't flowing", "Yes, 10", "Only at IV"], "ans": 1, "why": "Pumping requires continuous electron flow."}, {"q": "Where does the H2O from complete glucose oxidation come from?", "opts": ["Citric acid cycle", "Complex IV reducing O2", "Glycolysis", "Complex I"], "ans": 1, "why": "The final fate of the electrons stripped from glucose."}], "sa": [{"q": "Isolated mitochondria get NADH + succinate + antimycin A. Give the oxidation state of each complex and whether O2 is consumed.", "a": "Complex I reduced (NADH enters), complex II reduced (succinate enters), Q pool fully QH2. Antimycin A blocks QH2 → complex III, so III and IV drain and stay oxidized. No electrons reach O2, so no O2 is consumed and no protons are pumped."}, {"q": "Explain why NADH electrons support more ATP than succinate electrons.", "a": "NADH electrons enter at complex I, which pumps 4 H⁺, then pass through III (4) and IV (2): 10 H⁺ per pair. Succinate electrons enter at complex II, which pumps none, so only III and IV pump: 6 H⁺. Since ATP synthesis is powered by the proton gradient, NADH yields more ATP (≈2.5 vs. 1.5)."}, {"q": "Describe what complex IV does, including stoichiometry.", "a": "Cytochrome c oxidase takes electrons one at a time from two reduced cytochrome c (IMS side), passes them through hemes and Cu centers, and reduces O2 bound at a heme. Per electron pair: 2 cyt c(red) + ½O2 + 2H⁺(matrix) → 2 cyt c(ox) + H2O, while pumping 2 H⁺ to the IMS. Two pairs reduce a full O2 to 2 H2O."}]}, {"num": 12, "title": "Oxidative Phosphorylation and ATP Synthase", "key": ["ATP synthase: F₀ (membrane proton channel, c-ring) + F₁ (catalytic α₃β₃ in the matrix; active sites on the β subunits)", "Proton flow and ATP synthesis are tightly COUPLED: no ADP/Pi means no proton flow, unless F₁ is detached", "Rotational catalysis: the c-ring, γ, and ε spin; a, b₂, δ, α₃β₃ stay put. Each 120° turn releases 1 ATP. β cycles ADP → ATP → empty", "The proton gradient's energy is used to RELEASE tightly bound ATP (the β-ATP state binds ATP 10⁷× more tightly)", "4 H⁺ per ATP: 3 through F₀ + 1 for the Pi symporter. NADH → 10/4 = 2.5 ATP; FADH₂/succinate → 6/4 = 1.5 ATP", "Cytosolic NADH shuttles: malate–aspartate (liver, kidney, heart → complex I) vs. glycerol 3-phosphate (muscle, brain → Q, like complex II)"], "guide": "<h3>ATP synthase<\/h3><p>ADP + P<sub>i<\/sub> → ATP + H<sub>2<\/sub>O (ΔG°′ = <b>+30.5 kJ/mol<\/b>), powered by protons flowing <b>IMS → matrix<\/b>. This is <b>oxidative phosphorylation<\/b>, the source of most ATP in eukaryotes.<\/p><ul><li><b>F<sub>0<\/sub><\/b> (\"o\" for oligomycin-sensitive, not zero): the membrane <b>proton channel<\/b>. Subunits a (1), b (2, forming the stator arm), and <b>c (~8–11, a ring)<\/b>.<\/li><li><b>F<sub>1<\/sub><\/b>: the <b>catalytic<\/b> head in the matrix. A ring of <b>3 αβ pairs<\/b>; <b>active sites are on β<\/b> (3 sites). γ (a long rod up the middle), ε (base), and δ (attaches to the b arm).<\/li><li>N-side = matrix (negative); P-side = IMS (positive).<\/li><\/ul><h3>Isolated-mitochondria experiments<\/h3><table><tr><th>Condition<\/th><th>Result<\/th><\/tr><tr><td>Oxidizable substrate + ADP + P<sub>i<\/sub><\/td><td>Gradient forms → H⁺ flows → <b>ATP made<\/b><\/td><\/tr><tr><td>Substrate, no ADP/P<sub>i<\/sub><\/td><td>Gradient forms but <b>H⁺ can't flow back<\/b>: flow and synthesis are <b>tightly coupled<\/b><\/td><\/tr><tr><td>F<sub>1<\/sub> detached (mild detergent), no ADP/P<sub>i<\/sub><\/td><td>F<sub>1<\/sub> is soluble in the matrix; the channel is unlocked, so <b>H⁺ flows freely<\/b><\/td><\/tr><tr><td>F<sub>1<\/sub> detached + ADP/P<sub>i<\/sub><\/td><td><b>No ATP<\/b>: there's no coupling to the gradient<\/td><\/tr><tr><td>Purified F<sub>1<\/sub> + ADP/P<sub>i<\/sub><\/td><td>No ATP (+30.5 kJ/mol, infeasible alone)<\/td><\/tr><tr><td>Purified F<sub>1<\/sub> + <b>ATP<\/b><\/td><td>It <b>hydrolyzes ATP<\/b>, since enzymes catalyze both directions. Hence the old name <b>F<sub>1<\/sub>-ATPase<\/b>.<\/td><\/tr><\/table><h3>Rotational catalysis<\/h3><ul><li><b>Spins<\/b>: the c-ring, γ, ε. <b>Stationary<\/b>: a, b<sub>2<\/sub>, δ, α<sub>3<\/sub>β<sub>3<\/sub>. γ turns inside the fixed αβ ring.<\/li><li>Each c subunit has an <b>Asp/Glu<\/b> facing the aqueous cleft beside subunit a. A charged carboxylate can't enter the lipid bilayer. When it picks up an H⁺ from the IMS half-channel, it becomes neutral and rotates into the membrane. After nearly 360° it reaches the matrix half-channel, where a <b>positively charged Arg/Lys on a<\/b> helps release the H⁺ into the matrix.<\/li><li>γ turns in <b>three 120° steps<\/b>, with ≈3 H⁺ per step (varies by species with the number of c subunits).<\/li><\/ul><h3>Binding-change mechanism<\/h3><p>At any instant, each β subunit is in a <b>different<\/b> one of three conformations:<\/p><ol><li><b>β-ADP<\/b> (loose): ADP + P<sub>i<\/sub> bind.<\/li><li><b>β-ATP<\/b> (tight): affinity for ATP rises <b>~10⁷-fold<\/b>, so tight binding effectively pulls P<sub>i<\/sub> onto ADP. ATP forms here, but it's stuck.<\/li><li><b>β-empty<\/b> (open): the next 120° turn, <b>powered by protons through F<sub>0<\/sub><\/b>, forces the site open and <b>releases ATP<\/b>.<\/li><\/ol><div class=\"box\"><b>Key insight:<\/b> the gradient's energy goes mainly to <b>releasing<\/b> the tightly bound ATP. Each 120° turn yields <b>1 ATP<\/b>, so <b>3 H⁺ through F<sub>0<\/sub> per ATP<\/b>.<\/div><h3>Transport costs<\/h3><ul><li><b>P<sub>i<\/sub>–H⁺ symporter<\/b>: P<sub>i<\/sub> must be pumped into the matrix against its gradient, using <b>1 H⁺<\/b> (secondary active transport).<\/li><li><b>ATP/ADP antiporter<\/b>: ATP out, ADP in, 1:1 (not proton-driven).<\/li><li><div class=\"box\"><b>Total = 3 + 1 = 4 H⁺ per ATP.<\/b> NADH (10 H⁺) → <b>2.5 ATP<\/b>. Succinate/FADH<sub>2<\/sub> (6 H⁺) → <b>1.5 ATP<\/b>.<\/div><\/li><\/ul><h3>Getting cytosolic NADH into the ETC<\/h3><p>The cytosol and matrix keep <b>separate NAD pools<\/b>. NADH itself can't cross the inner membrane; only its <b>reducing equivalents<\/b> are shuttled. Which shuttle is used depends on the <b>tissue<\/b>.<\/p><table><tr><th><\/th><th>Malate–aspartate shuttle<\/th><th>Glycerol 3-phosphate shuttle<\/th><\/tr><tr><td>Tissues<\/td><td><b>Liver, kidney, heart<\/b> (metabolically busy)<\/td><td><b>Skeletal muscle, brain<\/b> (specialized)<\/td><\/tr><tr><td>Steps<\/td><td>Cytosolic <b>malate DH<\/b>: OAA + NADH → <b>malate<\/b> + NAD⁺. Malate enters (malate/α-KG antiporter). Matrix malate DH: malate → OAA + <b>NADH<\/b>. OAA is transaminated (glutamate → α-KG) to aspartate, which exits (Asp/Glu antiporter), then is transaminated back to OAA.<\/td><td>Cytosolic <b>glycerol 3-P DH<\/b>: DHAP + NADH → <b>glycerol 3-P<\/b> + NAD⁺. The <b>membrane-bound mitochondrial isozyme<\/b> oxidizes G3P → DHAP, sending electrons to <b>FAD → FADH<sub>2<\/sub> → Q → QH<sub>2<\/sub><\/b> (not complex II, but analogous)<\/td><\/tr><tr><td>Enters ETC at<\/td><td>Complex I (10 H⁺)<\/td><td>Q (6 H⁺)<\/td><\/tr><tr><td>ATP per cytosolic NADH<\/td><td><b>2.5<\/b><\/td><td><b>1.5<\/b><\/td><\/tr><\/table><p>Core idea for the malate–aspartate shuttle: OAA → malate picks up the electrons, malate crosses, then malate → OAA regenerates NADH in the matrix. The aspartate half just returns the carbon.<\/p>", "mc": [{"q": "The F1 portion of ATP synthase is:", "opts": ["The proton channel in the membrane", "The catalytic portion in the matrix", "In the IMS", "The c-ring"], "ans": 1, "why": "F1 holds the 3 β active sites; F0 is the membrane channel."}, {"q": "Isolated mitochondria get NADH but no ADP or Pi. What happens?", "opts": ["Protons flow freely through F0", "A proton gradient forms but protons don't flow back through ATP synthase", "ATP is made", "The ETC stops immediately"], "ans": 1, "why": "Proton flow and ATP synthesis are tightly coupled. (In reality the ETC soon slows from back-pressure.)"}, {"q": "F1 is removed with detergent. Protons now:", "opts": ["Can't cross at all", "Flow freely through F0", "Make ATP", "Bind F1 in solution"], "ans": 1, "why": "Detaching F1 unlocks the channel."}, {"q": "Purified F1 plus ATP will:", "opts": ["Do nothing", "Hydrolyze ATP (ATPase activity)", "Pump protons", "Make more ATP"], "ans": 1, "why": "Enzymes catalyze both directions; hence 'F1-ATPase'."}, {"q": "Which parts of ATP synthase rotate?", "opts": ["α3β3 ring", "c-ring, γ, and ε", "a and b subunits", "δ only"], "ans": 1, "why": "The stator (a, b2, δ) holds α3β3 still while γ turns inside it."}, {"q": "Why must a c-subunit Asp/Glu be protonated before it rotates into the membrane?", "opts": ["To bind ATP", "A charged group can't enter the hydrophobic bilayer", "To bind O2", "To activate γ"], "ans": 1, "why": "Neutralizing the carboxylate lets it move into the lipid."}, {"q": "In which β conformation is ATP held extremely tightly?", "opts": ["β-empty", "β-ADP", "β-ATP", "All equally"], "ans": 2, "why": "Affinity rises about 10⁷-fold, pulling Pi onto ADP."}, {"q": "The energy of the proton gradient is used mainly to:", "opts": ["Bind ADP", "Form the phosphoanhydride bond directly", "Release tightly bound ATP from the β subunit", "Import ADP"], "ans": 2, "why": "The 120° rotation forces β-ATP into β-empty."}, {"q": "How many ATP per full 360° rotation of γ?", "opts": ["1", "2", "3", "10"], "ans": 2, "why": "One per 120° step."}, {"q": "Total H⁺ needed per ATP made and exported:", "opts": ["3", "4", "10", "2.5"], "ans": 1, "why": "3 through F0 + 1 for the Pi–H⁺ symporter."}, {"q": "ATP yield per NADH entering at complex I:", "opts": ["1.5", "2.5", "3", "4"], "ans": 1, "why": "10 H⁺ / 4 H⁺ per ATP."}, {"q": "ATP yield per FADH2 (succinate) entering at complex II:", "opts": ["1", "1.5", "2.5", "6"], "ans": 1, "why": "6 H⁺ / 4."}, {"q": "Which tissues use the glycerol 3-phosphate shuttle?", "opts": ["Liver and kidney", "Skeletal muscle and brain", "Heart only", "All tissues"], "ans": 1, "why": "Liver, kidney, and heart use malate–aspartate."}, {"q": "In the glycerol 3-phosphate shuttle, electrons enter the ETC at:", "opts": ["Complex I", "Ubiquinone (via a membrane FAD enzyme)", "Complex III", "Cytochrome c"], "ans": 1, "why": "Mitochondrial glycerol 3-P DH → FADH2 → Q, bypassing complex I."}, {"q": "In the malate–aspartate shuttle, what crosses the inner membrane carrying the electrons?", "opts": ["NADH", "Malate", "Oxaloacetate", "Glycerol 3-phosphate"], "ans": 1, "why": "Malate is reoxidized to OAA in the matrix, regenerating NADH."}], "sa": [{"q": "Describe the binding-change (rotational) mechanism of ATP synthase and where the proton gradient's energy is used.", "a": "Protons enter from the IMS and protonate Asp/Glu on c subunits, letting the c-ring (with γ and ε) rotate; each H⁺ is released to the matrix after almost a full turn. γ turns in three 120° steps (≈3 H⁺ each) inside the stationary α3β3 ring, forcing each β through three states: β-ADP (binds ADP + Pi), β-ATP (affinity up ~10⁷, ATP forms), β-empty (ATP released). The gradient mainly pays to release the tightly bound ATP. Each 120° step releases 1 ATP."}, {"q": "Calculate the ATP yield of one NADH from the matrix vs. one from glycolysis in skeletal muscle.", "a": "Matrix NADH → complex I → 10 H⁺ pumped. ATP needs 4 H⁺ (3 through F0 + 1 for Pi import), so 10/4 = 2.5 ATP. Muscle uses the glycerol 3-phosphate shuttle: cytosolic NADH → G3P → mitochondrial G3P DH (FAD) → Q, bypassing complex I, so only 6 H⁺ → 1.5 ATP."}, {"q": "Explain the experiments showing that proton flow and ATP synthesis are coupled.", "a": "With an oxidizable substrate plus ADP + Pi, mitochondria make ATP as protons flow through F0. Without ADP/Pi, a gradient forms but protons don't flow back, so flow requires synthesis. Detaching F1 lets protons leak freely through F0 even without ADP/Pi, but no ATP is made. Purified F1 can't make ATP from ADP + Pi, but it hydrolyzes ATP (F1-ATPase)."}]}, {"num": 13, "title": "Gluconeogenesis", "key": ["Synthesis of glucose from pyruvate, mainly in the LIVER (some kidney and small intestine), triggered by glucagon when blood glucose falls", "It is glycolysis reversed, except for 3 bypasses: pyruvate carboxylase + PEPCK; fructose 1,6-bisphosphatase; glucose 6-phosphatase", "Cost per glucose: 4 ATP + 2 GTP + 2 NADH (glycolysis only gives back 2 ATP + 2 NADH)", "PFK-1 and FBPase-1 are reciprocally regulated (one allosteric effector turns one on and the other off) to avoid futile cycling", "Carbon sources: lactate (Cori cycle), glucogenic amino acids, glycerol. NOT fatty acids (acetyl-CoA can't make net OAA or pyruvate)"], "guide": "<h3>Why make glucose?<\/h3><p>The course now <b>zooms out<\/b>: less chemistry, more about how pathways connect and when each one is on. At the organism level, <b>blood glucose is the energy currency<\/b>. <b>Carbohydrate-dependent<\/b> tissues (the <b>brain<\/b> and nervous system, <b>red blood cells<\/b>) need it. Gluconeogenesis happens mainly in the <b>liver<\/b> (a little in kidney and small intestine). Most tissues can't do it.<\/p><h3>Hormonal trigger<\/h3><p>Fasting → blood glucose drops → pancreatic <b>α-cells<\/b> secrete <b>glucagon<\/b> (a protein hormone) → glucagon receptors on <b>hepatocytes<\/b> → signal transduction → <b>gluconeogenesis on<\/b> → glucose released into the blood. (Know: glucagon responds to low blood glucose, and the liver responds by turning on gluconeogenesis.)<\/p><h3>The pathway<\/h3><p>The first step is in the <b>mitochondrial matrix<\/b>; the rest is cytoplasmic. Seven glycolytic reactions simply run backwards (driven by mass action). The three irreversible glycolysis steps are <b>bypassed<\/b>. Know all intermediates and enzymes.<\/p><table><tr><th>Bypass<\/th><th>Reaction<\/th><th>Enzyme<\/th><\/tr><tr><td><b>1a<\/b><\/td><td>Pyruvate + HCO<sub>3<\/sub><sup>−<\/sup> (CO<sub>2<\/sub>) + ATP → <b>oxaloacetate<\/b> + ADP + P<sub>i<\/sub><\/td><td><b>Pyruvate carboxylase<\/b> (ligase; matrix)<\/td><\/tr><tr><td><b>1b<\/b><\/td><td>OAA + GTP → <b>PEP<\/b> + GDP + CO<sub>2<\/sub><\/td><td><b>PEP carboxykinase (PEPCK)<\/b><\/td><\/tr><tr><td>(reverse)<\/td><td>PEP → 2-PG → 3-PG → (+ATP) 1,3-BPG → (+NADH, −P<sub>i<\/sub>) G3P ⇌ DHAP → (aldolase, a true aldol condensation) F1,6BP<\/td><td>Enolase, PG mutase, PG kinase, G3P DH, TPI, aldolase<\/td><\/tr><tr><td><b>2<\/b><\/td><td>F1,6BP + H<sub>2<\/sub>O → <b>F6P<\/b> + P<sub>i<\/sub><\/td><td><b>Fructose 1,6-bisphosphatase<\/b> (hydrolase; <b>highly regulated<\/b>)<\/td><\/tr><tr><td>(reverse)<\/td><td>F6P ⇌ G6P<\/td><td>Phosphohexose isomerase<\/td><\/tr><tr><td><b>3<\/b><\/td><td>G6P + H<sub>2<\/sub>O → <b>glucose<\/b> + P<sub>i<\/sub><\/td><td><b>Glucose 6-phosphatase<\/b> (liver; lets glucose leave the cell)<\/td><\/tr><\/table><ul><li>Adding CO<sub>2<\/sub> (as bicarbonate) temporarily <b>energizes<\/b> the intermediate; it leaves again at PEPCK. Animals can't build biomolecules by fixing CO<sub>2<\/sub>, which is far too expensive, but they use it this way.<\/li><li>Phosphatases (bypasses 2 and 3) can only <b>hydrolyze<\/b> the phosphate off; they can't give it back to ADP.<\/li><li><b>Think about it:<\/b> in reverse, putting the hydride from NADH back onto 1,3-BPG's C1 is very endergonic. The energy comes from breaking the high-energy acyl phosphate that phosphoglycerate kinase made using ATP.<\/li><\/ul><div class=\"box\"><b>Reciprocal regulation:<\/b> PFK-1 (glycolysis) and FBPase-1 (gluconeogenesis) are both allosteric. A single effector <b>activates PFK-1 and inhibits FBPase-1<\/b>. Glucagon triggers its breakdown, so glycolysis goes off and gluconeogenesis on. Running both at once would be a wasteful <b>futile cycle<\/b>.<\/div><h3>Energy cost<\/h3><p>Per glucose: <b>4 ATP<\/b> (2 at pyruvate carboxylase, 2 at PG kinase) + <b>2 GTP<\/b> (PEPCK) + <b>2 NADH<\/b>. Glycolysis returns only 2 ATP + 2 NADH, so making glucose costs more than burning it, but the liver can make 50–100 g/day during prolonged fasting.<\/p><h3>Two versions of bypass 1 (depends on where NADH comes from)<\/h3><table><tr><th><\/th><th>Version 1: NADH must be exported<\/th><th>Version 2: lactate is the source<\/th><\/tr><tr><td>When<\/td><td>The usual case (e.g. amino acids are the carbon source)<\/td><td>After vigorous exercise: lots of lactate reaches the liver<\/td><\/tr><tr><td>Route<\/td><td>Pyruvate → matrix → OAA (pyruvate carboxylase) → <b>malate<\/b> (matrix malate DH, uses matrix NADH) → exported → cytosolic malate DH → OAA + <b>NADH (cytosol)<\/b> → PEP (cytosolic PEPCK)<\/td><td>Lactate → pyruvate + <b>NADH<\/b> (cytosolic LDH). Pyruvate → matrix → OAA → PEP (<b>mitochondrial PEPCK<\/b>) → PEP exported<\/td><\/tr><\/table><p>Version 1 is the malate–aspartate shuttle's chemistry running in reverse: OAA ⇌ malate moves reducing equivalents across the membrane.<\/p><h3>Cori cycle<\/h3><p>Working muscle: glucose → pyruvate → <b>lactate<\/b> (regenerates NAD⁺) → blood → <b>liver<\/b>: lactate → pyruvate → <b>glucose<\/b> → blood → muscle. (Alligators submerged for a long time do the same.)<\/p><h3>Carbon sources for gluconeogenesis<\/h3><table><tr><th>Good sources<\/th><th>NOT a source<\/th><\/tr><tr><td><b>Lactate<\/b> (LDH → pyruvate)<br><b>Glucogenic amino acids<\/b>: alanine → pyruvate; aspartate → OAA; glutamate → α-KG; others → succinyl-CoA etc. These <b>add new<\/b> citric acid cycle intermediates<br><b>Glycerol<\/b> from triglycerides (→ DHAP)<\/td><td><b>Fatty acids<\/b>: broken down only to acetyl-CoA. In the cycle, 2 C in, 2 CO<sub>2<\/sub> out, so there's <b>no net gain of OAA<\/b>, and PDH can't run backwards<br><b>Citric acid cycle intermediates alone<\/b>: siphoning them off without replacement drains the cycle<\/td><\/tr><\/table><div class=\"box\"><b>Carbs → fat: yes. Fat → carbs: no.<\/b> (Only the small glycerol part of fat can become glucose.)<\/div>", "mc": [{"q": "Where does gluconeogenesis mainly occur?", "opts": ["Skeletal muscle", "Liver", "Brain", "Adipose tissue"], "ans": 1, "why": "Plus a little in kidney and small intestine."}, {"q": "Which hormone turns on hepatic gluconeogenesis when blood glucose falls?", "opts": ["Insulin", "Glucagon", "Epinephrine only", "Cortisol only"], "ans": 1, "why": "Secreted by pancreatic α-cells."}, {"q": "The first gluconeogenic step (pyruvate → OAA) occurs in:", "opts": ["Cytoplasm", "Mitochondrial matrix", "ER", "IMS"], "ans": 1, "why": "Pyruvate carboxylase is in the matrix."}, {"q": "Pyruvate carboxylase uses:", "opts": ["GTP and CO2", "ATP and HCO3⁻ (CO2)", "NADH", "Pi only"], "ans": 1, "why": "A ligase that adds CO2 to pyruvate's methyl carbon, making OAA."}, {"q": "PEP carboxykinase converts:", "opts": ["Pyruvate → PEP", "OAA → PEP, using GTP and releasing CO2", "PEP → pyruvate", "Malate → OAA"], "ans": 1, "why": "The CO2 added by pyruvate carboxylase leaves again."}, {"q": "Which enzyme bypasses the PFK-1 step?", "opts": ["Glucose 6-phosphatase", "Fructose 1,6-bisphosphatase", "Aldolase", "Hexokinase"], "ans": 1, "why": "It hydrolyzes the C1 phosphate."}, {"q": "Glucose 6-phosphatase lets the liver:", "opts": ["Trap glucose", "Release free glucose into the blood", "Make glycogen", "Make G6P"], "ans": 1, "why": "Most cells never dephosphorylate G6P; the liver does in order to export glucose."}, {"q": "Total energy cost of making one glucose from 2 pyruvate:", "opts": ["2 ATP + 2 NADH", "4 ATP + 2 GTP + 2 NADH", "6 ATP", "2 ATP + 2 GTP"], "ans": 1, "why": "Pyruvate carboxylase (2 ATP), PEPCK (2 GTP), PGK (2 ATP), G3P DH (2 NADH)."}, {"q": "Why are PFK-1 and FBPase-1 reciprocally regulated?", "opts": ["To speed both", "To avoid a futile cycle wasting ATP", "They're the same enzyme", "To make NADH"], "ans": 1, "why": "One allosteric effector activates PFK-1 and inhibits FBPase-1."}, {"q": "In the version of bypass 1 used without lactate, why is malate exported from the matrix?", "opts": ["To make ATP", "To carry reducing equivalents (NADH) to the cytosol for gluconeogenesis", "To make CO2", "To import pyruvate"], "ans": 1, "why": "Cytosolic malate DH regenerates the NADH that G3P DH needs."}, {"q": "When lactate is the carbon source, cytosolic NADH comes from:", "opts": ["The malate shuttle", "Lactate dehydrogenase (lactate → pyruvate)", "PEPCK", "Complex I"], "ans": 1, "why": "So mitochondrial PEPCK is used, and PEP is exported."}, {"q": "The Cori cycle moves:", "opts": ["Glucose from liver to fat", "Lactate from muscle to liver, and glucose back to muscle", "Alanine to kidney", "Fatty acids to liver"], "ans": 1, "why": "Muscle lactate is recycled to glucose by the liver."}, {"q": "Why can't fatty acids be a net carbon source for gluconeogenesis?", "opts": ["They're too big", "They only yield acetyl-CoA, which gives no net OAA and can't become pyruvate", "They lack carbon", "They're used by the brain"], "ans": 1, "why": "2 C in, 2 CO2 out per cycle turn; PDH is irreversible."}, {"q": "Which is a good carbon source for gluconeogenesis during prolonged fasting (no lactate)?", "opts": ["Fatty acids", "Glucogenic amino acids", "Acetyl-CoA", "Ketone bodies"], "ans": 1, "why": "They form pyruvate or new citric acid cycle intermediates."}, {"q": "Which part of a triglyceride can become glucose?", "opts": ["Fatty acids", "Glycerol (via DHAP)", "Neither", "Both equally"], "ans": 1, "why": "Only the 3-carbon backbone."}], "sa": [{"q": "Diagram the first bypass of gluconeogenesis when lactate is NOT the main pyruvate source, and explain why this route is used.", "a": "Matrix: pyruvate + HCO3⁻ + ATP → OAA (pyruvate carboxylase); OAA + NADH → malate + NAD⁺ (mitochondrial malate DH). Malate is exported. Cytosol: malate + NAD⁺ → OAA + NADH (cytosolic malate DH); OAA + GTP → PEP + CO2 + GDP (cytosolic PEPCK). This exports NADH reducing equivalents to the cytosol, where gluconeogenesis needs NADH at the G3P DH step. With lactate, LDH makes cytosolic NADH, so mitochondrial PEPCK is used instead."}, {"q": "Explain why you can convert carbohydrates to fat but not fat to carbohydrates.", "a": "Glucose → pyruvate → acetyl-CoA (PDH) → fatty acid synthesis. Fatty acids break down only to acetyl-CoA. PDH is irreversible, so acetyl-CoA can't become pyruvate, and in the citric acid cycle its 2 carbons are matched by 2 CO2, so there's no net OAA for gluconeogenesis. Only triglyceride glycerol (→ DHAP) can make glucose."}, {"q": "List the three bypass reactions and the reason each is needed.", "a": "(1) Pyruvate → OAA (pyruvate carboxylase, ATP) → PEP (PEPCK, GTP), bypassing pyruvate kinase (very exergonic). (2) F1,6BP → F6P + Pi (fructose 1,6-bisphosphatase), bypassing PFK-1. (3) G6P → glucose + Pi (glucose 6-phosphatase), bypassing hexokinase. Phosphates can't go back to ADP at those steps, so they're hydrolyzed."}]}, {"num": 14, "title": "Glycogen Metabolism and the Pentose Phosphate Pathway", "key": ["Glycogen: glucose chains with α1→4 links and α1→6 branches; the reducing (C1) end is anchored on glycogenin; growth and breakdown happen at non-reducing ends", "Stored in liver (to maintain blood glucose) and skeletal muscle (fuel for its own work)", "Synthesis: G6P → G1P (phosphoglucomutase) → UDP-glucose (UDP-glucose pyrophosphorylase, uses UTP, releases PPi) → glycogen synthase (+ branching enzyme)", "Breakdown: glycogen phosphorylase (Pi → G1P) → G6P → liver: glucose 6-phosphatase → blood; muscle: glycolysis", "Insulin (high glucose, β-cells): glycogen synthesis in liver + muscle. Glucagon (low glucose, α-cells): glycogenolysis in LIVER only (muscle has no glucagon receptors)", "Pentose phosphate pathway: G6P + 2 NADP⁺ → ribose 5-P + CO₂ + 2 NADPH. The non-oxidative phase recycles extra ribose 5-P back to G6P"], "guide": "<h3>Glycogen structure<\/h3><ul><li>The animal storage polymer of glucose (starch in plants is chemically the same, but can be unbranched; glycogen is always branched).<\/li><li>Straight-chain links: <b>α(1→4) glycosidic bonds<\/b>. Branches: <b>α(1→6)<\/b>. Each glucose in the chain is a <b>residue<\/b>. Segments are 12–14 residues long.<\/li><li>Polarity: the C1 end is the <b>reducing end<\/b> (anomeric C, can reduce test reagents). It is never free; it's anchored to <b>glycogenin<\/b>, a structural protein that also adds the first ~4–5 glucoses. The C4 ends are <b>non-reducing ends<\/b>: free, where glucose is added and removed.<\/li><li>Stored as granules (near the ER). <b>Liver<\/b>: about 5–6% of its mass (≈100–120 g) for blood glucose. <b>Muscle<\/b>: fuel for vigorous activity.<\/li><\/ul><h3>Hormones<\/h3><table><tr><th><\/th><th>Insulin<\/th><th>Glucagon<\/th><\/tr><tr><td>Trigger<\/td><td>Blood glucose ↑ (after a meal)<\/td><td>Blood glucose ↓ (fasting, exercise)<\/td><\/tr><tr><td>Source<\/td><td>Pancreatic <b>β-cells<\/b><\/td><td>Pancreatic <b>α-cells<\/b><\/td><\/tr><tr><td>Responding tissues<\/td><td>Most tissues: <b>liver, skeletal muscle<\/b>, others (also adds glucose transporters to muscle)<\/td><td>Only <b>liver<\/b> and <b>adipose<\/b>. <b>Muscle does NOT respond.<\/b><\/td><\/tr><tr><td>Effect on glycogen<\/td><td><b>Synthesis<\/b> (store excess)<\/td><td>Liver <b>glycogenolysis<\/b>, a faster response than gluconeogenesis<\/td><\/tr><\/table><h3>Glycogen synthesis (know all intermediates and enzymes)<\/h3><ol><li>Glucose 6-P ⇌ <b>glucose 1-P<\/b>: <b>phosphoglucomutase<\/b> (mutase/isomerase; moves the phosphate from C6 to C1).<\/li><li>G1P + <b>UTP<\/b> → <b>UDP-glucose<\/b> + PP<sub>i<\/sub>: <b>UDP-glucose pyrophosphorylase<\/b> (irreversible). The UMP part of UTP attaches to G1P's phosphate. PP<sub>i<\/sub> (pyrophosphate) is quickly hydrolyzed to 2 P<sub>i<\/sub>, pulling the reaction forward. UDP-glucose is an <b>activated<\/b> glucose.<\/li><li>UDP-glucose + glycogen(n) → glycogen(n+1) + UDP: <b>glycogen synthase<\/b> (irreversible) forms an α(1→4) bond at a <b>non-reducing end<\/b>. It needs a primer of about 4 or more residues (glycogenin makes the first one).<\/li><li><b>Branching enzyme<\/b>: cuts a ~6–7 residue segment from a non-reducing end and reattaches it with an <b>α(1→6)<\/b> bond.<\/li><\/ol><h3>Glycogenolysis<\/h3><ol><li>Glycogen(n) + <b>P<sub>i<\/sub><\/b> → <b>glucose 1-P<\/b> + glycogen(n−1): <b>glycogen phosphorylase<\/b> (irreversible). Energy from breaking the α(1→4) bond attaches free P<sub>i<\/sub> (phosphorolysis, not hydrolysis).<\/li><li>G1P → G6P: phosphoglucomutase.<\/li><\/ol><p>The fate of G6P depends on the tissue: <b>liver<\/b> → glucose 6-phosphatase → free glucose → blood. <b>Muscle<\/b> → glycolysis → ATP. Anywhere → back into glycogen, or into the <b>pentose phosphate pathway<\/b>. G6P is a major branch point.<\/p><h3>Pentose phosphate pathway (know inputs and outputs only)<\/h3><div class=\"box\"><b>Glucose 6-P + 2 NADP⁺ + H<sub>2<\/sub>O → ribose 5-P + CO<sub>2<\/sub> + 2 NADPH + 2 H⁺<\/b><\/div><p>An alternative catabolic route for G6P that makes <b>raw materials for biosynthesis<\/b>:<\/p><ul><li><b>NADPH<\/b>: reducing power for anabolism (e.g. <b>fatty acid synthesis<\/b>). Kept as a separate pool from NADH. This pathway is the main source.<\/li><li><b>Ribose 5-phosphate<\/b>: the sugar for <b>nucleotide<\/b> and DNA/RNA synthesis, especially in <b>dividing cells<\/b>.<\/li><\/ul><p>Oxidative phase (FYI): G6P dehydrogenase (NADPH #1) → 6-phosphogluconolactone → hydrolysis → 6-phosphogluconate → oxidative decarboxylation (NADPH #2, CO<sub>2<\/sub>) → ribulose 5-P → isomerized to ribose 5-P.<\/p><h3>Non-oxidative phase<\/h3><p>Cells that need NADPH but not much ribose 5-P (e.g. <b>liver<\/b> doing fatty acid synthesis; its cells rarely divide) recycle the extra. CO<sub>2<\/sub> can't be refixed, so <b>carbon-swapping transferase reactions<\/b> (energetically neutral, no redox) reshuffle carbons: <b>6 five-carbon sugars → 5 six-carbon sugars<\/b> (30 C either way), via xylulose 5-P, sedoheptulose 7-P, G3P, erythrose 4-P, and F6P. Gluconeogenic enzymes then convert these to G6P to run the oxidative phase again. Cells needing both products (dividing cells) run only the oxidative phase.<\/p>", "mc": [{"q": "Glycogen branch points are:", "opts": ["α(1→4) bonds", "α(1→6) bonds", "β(1→4) bonds", "Phosphodiester bonds"], "ans": 1, "why": "Straight chains are α(1→4); branches are α(1→6)."}, {"q": "The reducing end of a glycogen chain is:", "opts": ["The C4 end, which is free", "The C1 end, always bonded to something (e.g. glycogenin)", "Both ends", "The branch point"], "ans": 1, "why": "Glucose is added and removed at non-reducing (C4) ends."}, {"q": "The activated glucose donor for glycogen synthase is:", "opts": ["Glucose 6-phosphate", "Glucose 1-phosphate", "UDP-glucose", "ADP-glucose"], "ans": 2, "why": "Made from G1P + UTP by UDP-glucose pyrophosphorylase."}, {"q": "What helps drive UDP-glucose formation forward?", "opts": ["ATP hydrolysis", "Rapid hydrolysis of the released pyrophosphate", "CO2 release", "NADH"], "ans": 1, "why": "Removing the PPi product pulls the reaction forward."}, {"q": "Phosphoglucomutase converts:", "opts": ["G6P ⇌ G1P", "G1P → UDP-glucose", "G6P → glucose", "F6P ⇌ G6P"], "ans": 0, "why": "It moves the phosphate between C6 and C1 and is used in both synthesis and breakdown."}, {"q": "Which enzyme forms α(1→6) branches?", "opts": ["Glycogen synthase", "Branching enzyme", "Glycogenin", "Glycogen phosphorylase"], "ans": 1, "why": "It moves a 6–7 residue segment to a C6 hydroxyl."}, {"q": "Glycogen phosphorylase releases:", "opts": ["Free glucose", "Glucose 1-phosphate (using Pi)", "Glucose 6-phosphate", "UDP-glucose"], "ans": 1, "why": "Phosphorolysis: the energy of the glycosidic bond attaches Pi."}, {"q": "Why doesn't glucagon trigger glycogen breakdown in skeletal muscle?", "opts": ["Muscle lacks glycogen", "Muscle has no glucagon receptors", "Glucagon is too large", "Muscle lacks phosphorylase"], "ans": 1, "why": "Only liver and adipose have glucagon receptors."}, {"q": "G6P from glycogenolysis in the liver (low blood glucose) is mostly:", "opts": ["Sent into glycolysis", "Dephosphorylated by glucose 6-phosphatase and released", "Made into fat", "Stored as UDP-glucose"], "ans": 1, "why": "The liver maintains blood glucose."}, {"q": "Insulin is released by pancreatic ___ cells in response to ___ blood glucose.", "opts": ["α; low", "β; high", "β; low", "α; high"], "ans": 1, "why": "It promotes storage after a meal."}, {"q": "Net products of the oxidative pentose phosphate pathway per G6P:", "opts": ["2 NADH + pyruvate", "Ribose 5-P + CO2 + 2 NADPH", "2 ATP + ribose", "Xylulose + NADH"], "ans": 1, "why": "One carbon is lost; two NADP⁺ are reduced."}, {"q": "NADPH from the pentose phosphate pathway is used mainly for:", "opts": ["The ETC", "Biosynthesis, e.g. fatty acid synthesis", "Glycolysis", "ATP synthase"], "ans": 1, "why": "NADPH is the anabolic reducing pool."}, {"q": "Which cells most need ribose 5-phosphate?", "opts": ["Non-dividing liver cells", "Rapidly dividing cells (DNA replication)", "Red blood cells", "Adipocytes"], "ans": 1, "why": "Ribose 5-P is used for nucleotides."}, {"q": "The non-oxidative phase of the pentose phosphate pathway:", "opts": ["Makes more NADPH", "Reshuffles carbons to turn excess ribose 5-P back into G6P", "Fixes CO2", "Uses ATP"], "ans": 1, "why": "Transferase reactions: 6 five-carbon sugars → 5 six-carbon sugars."}], "sa": [{"q": "Write the steps of glycogen synthesis from glucose 6-phosphate, including all substrates, products, and enzymes.", "a": "G6P ⇌ G1P (phosphoglucomutase). G1P + UTP → UDP-glucose + PPi (UDP-glucose pyrophosphorylase; PPi → 2 Pi drives it). UDP-glucose + glycogen(n) → glycogen(n+1) + UDP (glycogen synthase, an α1→4 bond at a non-reducing end). Branching enzyme moves ~6–7-residue segments to form α1→6 branches. Glycogenin primes new molecules."}, {"q": "Compare the response of liver and muscle glycogen to insulin and glucagon, and explain the different fates of G6P.", "a": "Insulin (high glucose) stimulates glycogen synthesis in both liver and muscle. Glucagon (low glucose) acts only on liver (and adipose), triggering glycogenolysis. In the liver, G6P is dephosphorylated by glucose 6-phosphatase and released to maintain blood glucose. Muscle lacks glucagon receptors and keeps its glycogen for itself: during exercise, its G6P goes into glycolysis to make ATP."}, {"q": "What are the two biosynthetic products of the pentose phosphate pathway? Give a use for each and explain when the non-oxidative phase is used.", "a": "NADPH, the reducing power for biosynthesis such as fatty acid synthesis in the fed liver. Ribose 5-phosphate, used for nucleotide synthesis, especially in dividing cells replicating DNA. Cells that need lots of NADPH but little ribose 5-P (like the liver) use the non-oxidative phase to reshuffle carbons from extra pentoses back into G6P, so the oxidative phase can keep making NADPH."}]}, {"num": 15, "title": "Oxidation of Fatty Acids and Ketone Bodies", "key": ["Fats and oils are triglycerides (glycerol + 3 fatty acids). Saturated chains pack tightly (solids); cis-unsaturated chains kink (oils)", "Glucagon → adipocyte PKA → phosphorylates hormone-sensitive lipase + perilipins → fatty acids + glycerol into the blood", "Glycerol → glycerol 3-P (glycerol kinase) → DHAP. In the liver it can make glucose (the one fat → glucose exception)", "Activation: fatty acid + CoA + ATP → fatty acyl-CoA + AMP + PPi (costs 2 ATP equivalents). Carnitine shuttle (CAT I/CAT II) into the matrix", "One round of β-oxidation: acyl-CoA DH (FAD → Q) → enoyl-CoA hydratase → β-hydroxyacyl-CoA DH (NADH) → thiolase (acetyl-CoA)", "Palmitate (C16): 7 rounds → 8 acetyl-CoA + 7 NADH + 7 FADH₂ → 106 ATP. Ketone bodies (acetoacetate, β-hydroxybutyrate, acetone) are made in the liver via HMG-CoA"], "guide": "<h3>Fatty acid and lipid structure<\/h3><ul><li>A fatty acid is a long hydrocarbon chain with a carboxylic acid at one end. <b>Saturated<\/b> means no C=C. <b>Unsaturated<\/b> means one or more C=C, always <b>cis<\/b> in natural fatty acids.<\/li><li>Saturated chains pack well (higher melting point) → <b>fats<\/b>, solid at room temperature. Cis kinks prevent packing → <b>oils<\/b>, liquid.<\/li><li>Dietary and stored fat is <b>triglyceride<\/b>: 3 fatty acids esterified to <b>glycerol<\/b>. There are few free fatty acids. Fat stores more energy per gram than carbohydrate or protein.<\/li><\/ul><h3>Mobilizing fat (glucagon)<\/h3><p><b>Adipocytes<\/b> are mostly huge triglyceride droplets coated with <b>perilipin<\/b> proteins. Adipose and liver are the glucagon-responsive tissues. Glucagon → GPCR → <b>protein kinase A<\/b> → phosphorylates <b>hormone-sensitive lipase<\/b> (activating it) and perilipins (creating a docking site) → triglycerides are hydrolyzed → <b>free fatty acids + glycerol<\/b> are released into the blood.<\/p><h3>Fate of glycerol<\/h3><p>Glycerol + ATP → <b>glycerol 3-phosphate<\/b> (<b>glycerol kinase<\/b>, irreversible) → <b>DHAP<\/b> + NADH (<b>glycerol 3-P dehydrogenase<\/b>, the same enzyme as the shuttle). DHAP goes into glycolysis in most tissues, or into <b>gluconeogenesis in the liver<\/b>: the exception to \"fat can't become glucose,\" but only 3 carbons out of ~50.<\/p><h3>Fate of fatty acids<\/h3><p>Taken up by many tissues; especially important for <b>skeletal muscle<\/b>. <b>Not used by carbohydrate-dependent tissues<\/b> (brain, RBCs).<\/p><ol><li><b>Activation (cytoplasm)<\/b>: fatty acid + CoA + ATP → <b>fatty acyl-CoA<\/b> + <b>AMP + PP<sub>i<\/sub><\/b> (<b>acyl-CoA synthetases<\/b>, specific to chain length). Breaking both phosphoanhydride bonds = <b>2 ATP equivalents<\/b>.<\/li><li><b>Carnitine shuttle<\/b> (β-oxidation is in the <b>matrix<\/b>): <b>carnitine acyltransferase I<\/b> (outer membrane) swaps CoA for <b>carnitine<\/b> → an antiporter brings acyl-carnitine in and free carnitine out → <b>carnitine acyltransferase II<\/b> swaps back to acyl-CoA in the matrix.<\/li><\/ol><h3>β-Oxidation: one round (know structures, names, enzymes)<\/h3><p>Numbering: C1 = the carbonyl (thioester) C, C2 = <b>α<\/b>, C3 = <b>β<\/b>. The β-carbon is oxidized to a carbonyl, which becomes the new attachment point for CoA.<\/p><table><tr><th>#<\/th><th>Type<\/th><th>Product<\/th><th>Enzyme<\/th><th>Carrier<\/th><\/tr><tr><td>1<\/td><td><b>Oxidation<\/b><\/td><td><b>trans-Δ²-enoyl-CoA<\/b> (C2=C3 trans double bond)<\/td><td><b>Acyl-CoA dehydrogenase<\/b> (inner-membrane bound, FAD prosthetic group, chain-length isozymes)<\/td><td><b>FADH<sub>2<\/sub> → Q directly<\/b> (like complex II): 1.5 ATP<\/td><\/tr><tr><td>2<\/td><td><b>Hydration<\/b><\/td><td><b>L-β-hydroxyacyl-CoA<\/b> (–OH on C3)<\/td><td><b>Enoyl-CoA hydratase<\/b> (lyase)<\/td><td><\/td><\/tr><tr><td>3<\/td><td><b>Oxidation<\/b><\/td><td><b>β-ketoacyl-CoA<\/b> (C=O on C3)<\/td><td><b>β-Hydroxyacyl-CoA dehydrogenase<\/b><\/td><td><b>NADH<\/b> → complex I: 2.5 ATP<\/td><\/tr><tr><td>4<\/td><td><b>Cleavage<\/b> (thiolysis)<\/td><td><b>Acetyl-CoA<\/b> + acyl-CoA that is <b>2 C shorter<\/b><\/td><td><b>Thiolase<\/b> (acyl-CoA acetyltransferase); a new CoA attaches at the old C3<\/td><td><\/td><\/tr><\/table><p><b>Unsaturated<\/b> fatty acids: once the cis double bond reaches C2–C3, an <b>isomerase<\/b> converts it to <b>trans<\/b>, and it enters at step 2 (hydratase). That skips step 1, so one FADH<sub>2<\/sub> is lost.<\/p><h3>ATP yield: palmitate (C16, saturated)<\/h3><table><tr><th>Source<\/th><th>ATP<\/th><\/tr><tr><td>7 rounds → 7 FADH<sub>2<\/sub> × 1.5<\/td><td>10.5<\/td><\/tr><tr><td>7 NADH × 2.5<\/td><td>17.5<\/td><\/tr><tr><td>8 acetyl-CoA × 10 (3 NADH 7.5 + 1 FADH<sub>2<\/sub> 1.5 + 1 GTP)<\/td><td>80<\/td><\/tr><tr><td>Activation (ATP → AMP)<\/td><td>−2<\/td><\/tr><tr><td><b>Total<\/b><\/td><td><b>106<\/b><\/td><\/tr><\/table><div class=\"box\"><b>Exam idea: ATP per carbon.<\/b> Palmitate: 106/16 ≈ <b>6.6<\/b>. Glucose: 32/6 ≈ <b>5.3<\/b>. Why? Fatty acid carbons are <b>more reduced<\/b> (mostly CH<sub>2<\/sub>), while carbohydrate carbons already carry –OH (partly oxidized), so each fatty acid carbon has more electrons to give.<\/div><h3>Ketone bodies (liver mitochondria)<\/h3><p>Heavy β-oxidation floods the liver with acetyl-CoA, which <b>ties up CoA<\/b>. Ketone bodies <b>recycle CoA<\/b> and <b>export energy<\/b> to carbohydrate-dependent tissues (the brain).<\/p><ul><li>Know the inputs and outputs: <b>acetyl-CoA in<\/b> → <b>acetoacetate, β-hydroxybutyrate, acetone<\/b> out. Also know the intermediate <b>HMG-CoA<\/b> (the branch point to <b>cholesterol synthesis<\/b>).<\/li><li>Path (FYI): 2 acetyl-CoA → acetoacetyl-CoA (thiolase in reverse) → + acetyl-CoA → <b>HMG-CoA<\/b> (HMG-CoA synthase) → acetoacetate + acetyl-CoA (HMG-CoA lyase). Acetoacetate + NADH ⇌ β-hydroxybutyrate (spends NADH to export more energy). Acetoacetate → <b>acetone<\/b> + CO<sub>2<\/sub> (a dead end, exhaled or excreted).<\/li><li><b>Use in the brain<\/b>: β-hydroxybutyrate → acetoacetate (+NADH) → acetoacetyl-CoA (β-ketoacyl-CoA transferase) → 2 acetyl-CoA (thiolase) → citric acid cycle.<\/li><li>During long starvation, blood ketones climb and stay high while glucose holds near 4–5 mM, sparing gluconeogenesis.<\/li><\/ul><div class=\"box\"><b>Ketoacidosis<\/b>: acetoacetate and β-hydroxybutyrate are acids. Excess amounts (prolonged starvation, untreated <b>diabetes<\/b>, where poor insulin action pushes the body onto fatty acids) overwhelm the bicarbonate buffer and lower blood pH, which can cause shock and death. Acetone on the breath was an old sign of diabetes.<\/div>", "mc": [{"q": "Why are saturated fats usually solid at room temperature?", "opts": ["They have cis kinks", "Straight chains pack tightly, giving higher melting points", "They're shorter", "They contain glycerol"], "ans": 1, "why": "Cis double bonds kink chains and lower the melting point (oils)."}, {"q": "Which enzyme, activated by PKA, releases fatty acids from adipocyte triglycerides?", "opts": ["Lipoprotein lipase", "Hormone-sensitive lipase", "Acyl-CoA synthetase", "Carnitine acyltransferase"], "ans": 1, "why": "PKA also phosphorylates perilipins to create its docking site."}, {"q": "Glycerol from triglyceride breakdown enters metabolism as:", "opts": ["Pyruvate", "DHAP (via glycerol 3-phosphate)", "Acetyl-CoA", "Oxaloacetate"], "ans": 1, "why": "Glycerol kinase, then glycerol 3-P dehydrogenase."}, {"q": "How many ATP equivalents does fatty acid activation cost?", "opts": ["1", "2", "3", "0"], "ans": 1, "why": "ATP → AMP + PPi breaks two high-energy bonds."}, {"q": "How do fatty acyl groups get into the mitochondrial matrix?", "opts": ["Free diffusion", "The carnitine shuttle (CAT I, translocase, CAT II)", "The malate shuttle", "As acetyl-CoA"], "ans": 1, "why": "The inner membrane is impermeable to acyl-CoA."}, {"q": "The first step of β-oxidation produces:", "opts": ["β-hydroxyacyl-CoA", "trans-Δ²-enoyl-CoA and FADH2", "β-ketoacyl-CoA and NADH", "Acetyl-CoA"], "ans": 1, "why": "Acyl-CoA dehydrogenase removes 2 H to form the C2=C3 trans double bond."}, {"q": "Electrons from acyl-CoA dehydrogenase's FADH2 enter the ETC at:", "opts": ["Complex I", "Ubiquinone (Q), like complex II", "Cytochrome c", "Complex IV"], "ans": 1, "why": "It's a membrane-bound FAD enzyme, worth 1.5 ATP."}, {"q": "Step 2 of β-oxidation is catalyzed by:", "opts": ["Thiolase", "Enoyl-CoA hydratase", "β-hydroxyacyl-CoA DH", "Acyl-CoA DH"], "ans": 1, "why": "It adds water across the double bond (–OH on the β-carbon)."}, {"q": "Which β-oxidation step makes NADH?", "opts": ["Step 1", "Step 2", "Step 3 (β-hydroxyacyl-CoA dehydrogenase)", "Step 4"], "ans": 2, "why": "It oxidizes the β-OH to a ketone."}, {"q": "How many rounds of β-oxidation for palmitoyl-CoA (C16), and how many acetyl-CoA?", "opts": ["8 rounds, 8 acetyl-CoA", "7 rounds, 8 acetyl-CoA", "7 rounds, 7 acetyl-CoA", "16 rounds, 8 acetyl-CoA"], "ans": 1, "why": "The last round splits C4 into 2 acetyl-CoA."}, {"q": "Net ATP from complete oxidation of palmitate:", "opts": ["32", "80", "106", "129"], "ans": 2, "why": "10.5 + 17.5 + 80 − 2 = 106."}, {"q": "Why do fatty acids give more ATP per carbon than glucose?", "opts": ["They have more oxygen", "Their carbons are more reduced", "They skip the citric acid cycle", "They make GTP"], "ans": 1, "why": "More C–H bonds means more electrons to donate."}, {"q": "Which is NOT a ketone body?", "opts": ["Acetoacetate", "β-Hydroxybutyrate", "Acetone", "Acetyl-CoA"], "ans": 3, "why": "Acetyl-CoA is the precursor."}, {"q": "HMG-CoA is important because it is:", "opts": ["A β-oxidation intermediate", "A ketone body intermediate and the branch point to cholesterol synthesis", "A glycolysis intermediate", "An ETC carrier"], "ans": 1, "why": "Know it as the link to cholesterol."}, {"q": "Ketoacidosis is dangerous because:", "opts": ["Ketones are toxic to the liver", "Acetoacetate and β-hydroxybutyrate are acids that can overwhelm blood buffering", "Acetone causes blindness", "Glucose drops to zero"], "ans": 1, "why": "Blood pH drops, risking shock."}], "sa": [{"q": "Draw/describe one round of β-oxidation with intermediates, enzymes, and the type of each step.", "a": "Fatty acyl-CoA → (acyl-CoA dehydrogenase, oxidation, FAD → FADH2 → Q) trans-Δ²-enoyl-CoA → (enoyl-CoA hydratase, hydration) L-β-hydroxyacyl-CoA → (β-hydroxyacyl-CoA dehydrogenase, oxidation, NAD⁺ → NADH) β-ketoacyl-CoA → (thiolase, cleavage with a new CoA) acetyl-CoA + fatty acyl-CoA two carbons shorter."}, {"q": "Calculate the ATP yield from complete oxidation of palmitate and compare ATP per carbon with glucose.", "a": "7 rounds: 7 FADH2 × 1.5 = 10.5 and 7 NADH × 2.5 = 17.5. 8 acetyl-CoA × 10 (3 NADH, 1 FADH2, 1 GTP) = 80. Minus 2 for activation (ATP → AMP + PPi): 106 ATP. Per carbon: 106/16 ≈ 6.6 vs. glucose 32/6 ≈ 5.3. Fatty acid carbons are more reduced, so each yields more electrons."}, {"q": "Why does the liver make ketone bodies during fasting, and how does the brain use them?", "a": "Heavy β-oxidation in the liver makes more acetyl-CoA than the citric acid cycle can use (OAA is diverted to gluconeogenesis), trapping CoA. Converting acetyl-CoA via HMG-CoA to acetoacetate and β-hydroxybutyrate frees CoA and makes water-soluble fuels for the blood. The brain, which can't use fatty acids, converts β-hydroxybutyrate → acetoacetate (NADH) → acetoacetyl-CoA → 2 acetyl-CoA → citric acid cycle, reducing the need for gluconeogenesis."}]}, {"num": 16, "title": "Fatty Acid and Cholesterol Synthesis", "key": ["Only liver and adipose make fatty acids. Insulin (after a carb meal) turns on glycolysis + fatty acid synthesis; fat is stored as triglyceride in adipose tissue", "Synthesis happens in the CYTOPLASM (β-oxidation is in the matrix). Acetyl-CoA is exported via the citrate shuttle (citrate lyase, uses ATP)", "Acetyl-CoA carboxylase: acetyl-CoA + CO₂ + ATP → malonyl-CoA, the regulated, committed step (activated by dephosphorylation under insulin)", "Malonyl-CoA inhibits carnitine acyltransferase I, so new fatty acids aren't immediately β-oxidized", "Fatty acid synthase (one huge polypeptide; ACP arm + KS): condensation (−CO₂) → reduction (NADPH) → dehydration → reduction (NADPH). Exactly β-oxidation in reverse; stops at C16–18", "Cholesterol: acetyl-CoA → HMG-CoA → mevalonate (HMG-CoA reductase, 2 NADPH, rate-limiting; inhibited by STATINS) → isoprene units → cholesterol"], "guide": "<h3>When and where<\/h3><p>Many tissues β-oxidize fatty acids, but <b>only liver and adipose synthesize them<\/b>. Example: a big starchy (Thanksgiving) meal raises blood glucose, so β-cells release <b>insulin<\/b>, which in liver and adipose turns on:<\/p><ul><li><b>Glycolysis<\/b> → pyruvate → acetyl-CoA (PDH), and<\/li><li><b>Fatty acid synthesis<\/b> (its first enzyme is directly regulated).<\/li><\/ul><p>The liver packages new fatty acids as <b>triglycerides<\/b> and <b>exports<\/b> them to adipose for storage. (Fat building up in the liver = liver disease.) <b>Carbs → fat is easy.<\/b><\/p><h3>Compartments prevent futile cycling<\/h3><table><tr><th>β-Oxidation<\/th><th>Fatty acid synthesis<\/th><\/tr><tr><td>Mitochondrial matrix<\/td><td>Cytoplasm<\/td><\/tr><tr><td>Acyl groups on CoA<\/td><td>Acyl groups on ACP<\/td><\/tr><tr><td>Makes FADH<sub>2<\/sub> + NADH<\/td><td>Uses NADPH<\/td><\/tr><tr><td>Removes 2 C as acetyl-CoA<\/td><td>Adds 2 C from malonyl-CoA (−CO<sub>2<\/sub>)<\/td><\/tr><\/table><h3>1. Citrate shuttle: getting acetyl-CoA out of the matrix<\/h3><p>Excess acetyl-CoA → <b>citrate<\/b> (citrate synthase), which builds up and is exported by the citrate transporter
